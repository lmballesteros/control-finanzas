<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Control financiero</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Control" />
<style>
  /* ====================================================================
     Sistema de diseño — inspirado en Apple Wallet / Apple Card
     Paleta: negro verdadero de fondo, materiales de vidrio esmerilado
     (blur + transparencia) para cada superficie, tipografía nativa del
     sistema (SF Pro en Apple, equivalentes en otras plataformas), colores
     semánticos de iOS (verde/rojo/naranja/azul), esquinas muy redondeadas
     y sombras suaves en vez de bordes duros.
     Las tarjetas de crédito son el elemento distintivo: cada una se
     dibuja como una tarjeta física con degradado único (generado a
     partir de su nombre), como en Apple Wallet — el resto de la app usa
     paneles de vidrio neutros para no competir con ese protagonismo.
     ==================================================================== */
  :root{
    --bg:#000000; --surface:rgba(30,30,32,.68); --surface2:rgba(255,255,255,.07); --surface3:rgba(255,255,255,.055);
    --text:#F5F5F7; --muted:#98989D; --mint:#32D74B; --coral:#FF453A; --amber:#FF9F0A; --blue:#0A84FF;
    --hairline:rgba(255,255,255,.09);
    --disp:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,'SF Mono','Menlo','Cascadia Code',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:3px;}
  h1,h2{letter-spacing:-0.01em;}
  .wrap{max-width:480px;margin:0 auto;padding:32px 16px 100px;}
  .eyebrow{color:var(--blue);font-size:11px;text-transform:uppercase;letter-spacing:.14em;margin-bottom:4px;font-weight:600;}
  h1{font-family:var(--disp);font-size:26px;font-weight:700;letter-spacing:-0.02em;margin:0 0 24px;}
  .stats{display:flex;gap:10px;margin-bottom:32px;overflow-x:auto;}
  .stat{flex:1;min-width:110px;background:var(--surface);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--hairline);border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .stat .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px;}
  .stat .val{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-0.01em;}
  .alerts{background:rgba(255,69,58,.12);border:1px solid rgba(255,69,58,.25);border-left:3px solid var(--coral);border-radius:16px;padding:12px 16px;margin-bottom:24px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
  .alerts .title{color:var(--coral);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .alerts .row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:14px;}
  .alerts .row .amt{font-family:var(--mono);font-size:12px;white-space:nowrap;}
  section{margin-bottom:32px;}
  .sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .sec-title{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:-0.01em;}
  .add-btn{color:var(--blue);font-size:13px;font-weight:600;background:none;border:none;display:flex;align-items:center;gap:4px;padding:4px;font-family:var(--body);}
  .empty{color:var(--muted);font-size:12px;padding:2px 4px;}
  .card{background:var(--surface);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--hairline);border-radius:20px;padding:16px;margin-bottom:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);}
  button{transition:opacity .15s ease, background-color .15s ease, transform .1s ease;font-family:var(--body);}
  button:active{transform:scale(.97);}
  button:focus-visible, input:focus-visible, a:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  .card-top{display:flex;justify-content:space-between;gap:10px;}
  .card-main{flex:1;text-align:left;background:none;border:none;color:inherit;padding:0;font-family:inherit;cursor:pointer;}
  .name{font-family:var(--disp);font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;letter-spacing:-0.01em;}
  .tag{background:var(--surface3);color:var(--muted);font-size:10px;padding:2px 7px;border-radius:20px;}
  .amount-line{display:flex;align-items:baseline;gap:8px;margin-top:4px;flex-wrap:wrap;}
  .amount-main{font-family:var(--mono);font-size:19px;font-weight:600;}
  .amount-sub{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .amount-msi{font-family:var(--mono);font-size:12px;color:var(--amber);}
  .badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .badge{font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid;display:flex;align-items:center;gap:4px;}
  .badge-muted{color:var(--muted);font-size:11px;}
  .icon-btn{background:none;border:none;color:var(--muted);padding:6px;cursor:pointer;}
  .bar{background:var(--surface3);height:6px;border-radius:6px;margin-top:12px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;transition:width .2s;}
  .chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:12px;}
  .chip{background:var(--surface2);border:1px solid var(--hairline);font-family:var(--mono);font-size:12px;padding:6px 10px;border-radius:20px;cursor:pointer;}
  .chip.neg{color:var(--coral);}
  .chip.pos{color:var(--mint);}
  .chip-custom{display:flex;align-items:center;gap:4px;margin-left:auto;}
  .chip-custom input{width:64px;background:var(--surface3);color:var(--text);font-family:var(--mono);font-size:12px;padding:6px 8px;border-radius:8px;border:1px solid var(--hairline);outline:none;}
  .subsection{margin-top:12px;padding-top:12px;border-top:1px solid var(--hairline);}
  .subsection-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .subsection-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
  .mini-add{color:var(--blue);font-size:11px;background:none;border:none;display:flex;align-items:center;gap:4px;font-weight:600;}
  .mini-card{background:var(--surface3);border:1px solid var(--hairline);border-radius:14px;padding:10px;margin-bottom:8px;}
  .mini-row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .swipe-row{position:relative;overflow:hidden;border-radius:12px;margin-bottom:6px;touch-action:pan-y;}
  .swipe-actions{position:absolute;top:0;right:0;bottom:0;display:flex;}
  .swipe-actions button{width:52px;border:none;color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;}
  .swipe-content{position:relative;background:var(--surface);will-change:transform;}
  .mini-desc{font-size:12px;}
  .mini-sub{color:var(--muted);font-family:var(--mono);font-size:11px;margin-top:2px;}
  .mini-actions{display:flex;align-items:center;gap:6px;}
  .mark-btn{background:var(--surface2);color:var(--blue);font-size:10px;padding:4px 8px;border-radius:20px;border:1px solid var(--hairline);white-space:nowrap;font-weight:600;}
  .pay-date{color:var(--muted);font-size:11px;}
  .pay-amt{color:var(--mint);font-family:var(--mono);font-size:12px;font-weight:600;}
  .form-box{background:var(--surface3);border:1px solid var(--hairline);border-radius:14px;padding:10px;margin-top:8px;}
  .form-row{display:flex;gap:8px;margin-bottom:8px;}
  .form-box input{width:100%;background:var(--surface2);color:var(--text);font-size:12px;padding:8px 10px;border-radius:10px;border:1px solid var(--hairline);outline:none;font-family:inherit;}
  .form-box input:focus{border-color:var(--blue);}
  .form-actions{display:flex;gap:8px;}
  .btn-cancel{flex:1;background:none;border:none;color:var(--muted);font-size:13px;padding:6px;font-weight:500;}
  .btn-save{flex:1;background:var(--blue);color:#fff;border:none;border-radius:12px;font-size:13px;padding:9px;font-weight:600;}
  .btn-save:disabled{background:var(--surface2);color:var(--muted);}
  .bank-box{background:var(--surface);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--hairline);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .bank-title{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:12px;}
  .bank-row{margin-bottom:10px;}
  .bank-row-top{display:flex;justify-content:space-between;margin-bottom:4px;font-size:14px;}
  .bank-row-amt{font-family:var(--mono);color:var(--mint);font-weight:600;}
  .chart-box{background:var(--surface);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--hairline);border-radius:20px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .chart-empty{color:var(--muted);font-size:12px;}
  .legend{display:flex;gap:16px;margin-bottom:8px;font-size:11px;}
  .legend span{display:flex;align-items:center;gap:5px;}
  .dot{width:8px;height:8px;border-radius:50%;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px;}
  .modal{background:rgba(38,38,40,.86);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border:1px solid var(--hairline);border-radius:24px;padding:20px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-head h3{font-family:var(--disp);font-size:17px;font-weight:600;letter-spacing:-0.01em;margin:0;}
  .modal-head button{background:none;border:none;color:var(--muted);}
  .modal input{width:100%;background:var(--surface3);color:var(--text);font-size:15px;padding:11px 13px;border-radius:12px;border:1px solid var(--hairline);outline:none;margin-bottom:10px;font-family:inherit;}
  .modal input:focus{border-color:var(--blue);}
  .modal-2col{display:flex;gap:10px;}
  .modal-2col > div{flex:1;}
  .field-label{color:var(--muted);font-size:11px;display:block;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
  .modal-save{width:100%;background:var(--blue);color:#fff;border:none;border-radius:14px;padding:12px;font-size:15px;font-weight:600;margin-top:6px;}
  .modal-save:disabled{background:var(--surface2);color:var(--muted);}
  .loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--muted);font-family:var(--mono);font-size:13px;}
  svg text{font-family:var(--mono);}
</style>
</head>
<body>
<div id="app"><div class="loading">cargando…</div></div>

<!-- Firebase (sincronización en la nube, opcional — la app funciona 100% sin esto si no inicias sesión) -->
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>

<script>
(function(){
  "use strict";

  /* ---------- data + storage ---------- */
  var STORAGE_KEY = "finance-data-standalone";
  var CHIPS = [20, 50, 100, 500];
  var DATA_VERSION = 2;

  var DEFAULT_BUDGET = { salary: 6800, pctGastos: 50, pctDiversion: 30, pctAhorro: 20, configured: false };

  var DEFAULT_CATEGORIES = ["Casa","Comida","Transporte","Entretenimiento","Compras","Salud","Servicios","Educación","Suscripciones","Otros"];

  var DEFAULT_SETTINGS = {
    fontSize: "normal", notificationsEnabled: false,
    alertPayments: true, alertCutoffs: true, alertBudget: true, alertGoals: true,
    alertUtilization: true, alertDebtGrowth: true,
    monthlyBudgetLimit: 0
  };
  var FONT_SCALE = { small: "0.9", normal: "1", large: "1.15", xlarge: "1.3" };

  /* migración progresiva de datos — nunca elimina información existente */
  function migrateData(parsed){
    var v = parsed.__v || 1;
    if(v < 2){
      /* v1 -> v2: cada gasto obtiene una categoría por defecto ("Otros") si no la tenía */
      (parsed.cards||[]).forEach(function(c){
        (c.expenses||[]).forEach(function(e){ if(!e.category) e.category = "Otros"; });
      });
      if(!parsed.categories) parsed.categories = DEFAULT_CATEGORIES.slice();
      v = 2;
    }
    parsed.__v = DATA_VERSION;
    return parsed;
  }

  /* normaliza cualquier objeto de datos (recién cargado o importado de un respaldo)
     asegurando que existan todos los campos esperados y aplicando migraciones. */
  function normalizeData(parsed){
    if(!parsed || typeof parsed !== "object") return null;
    if(!Array.isArray(parsed.cards) || !Array.isArray(parsed.savings)) return null;
    if(!parsed.history) parsed.history = [];
    if(!parsed.personalCredits) parsed.personalCredits = [];
    if(!parsed.categories) parsed.categories = DEFAULT_CATEGORIES.slice();
    if(!parsed.dismissedSubscriptions) parsed.dismissedSubscriptions = [];
    if(!parsed.confirmedSubscriptions) parsed.confirmedSubscriptions = [];
    if(!parsed.celebratedGoalIds) parsed.celebratedGoalIds = [];
    parsed.budget = Object.assign({}, DEFAULT_BUDGET, parsed.budget||{});
    parsed.settings = Object.assign({}, DEFAULT_SETTINGS, parsed.settings||{});
    parsed.cards.forEach(function(c){
      if(!c.expenses) c.expenses = [];
      if(!c.payments) c.payments = [];
      if(!c.msi) c.msi = [];
      if(!c.diferidos) c.diferidos = [];
    });
    return migrateData(parsed);
  }

  function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = normalizeData(JSON.parse(raw));
        if(parsed) return parsed;
      }
    }catch(e){}
    return { __v:DATA_VERSION, cards: [], savings: [], history: [], personalCredits: [], categories: DEFAULT_CATEGORIES.slice(), budget: Object.assign({}, DEFAULT_BUDGET), settings: Object.assign({}, DEFAULT_SETTINGS), dismissedSubscriptions:[], confirmedSubscriptions:[], celebratedGoalIds:[] };
  }
  function saveData(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
  }

  var data = loadData();
  saveData(); /* persiste inmediatamente cualquier migración de datos antiguos */
  var ui = { openCard:null, openSaving:null, msiForm:null, msiEditId:null, paymentForm:null, paymentEditId:null,
             expenseForm:null, expenseEditId:null, deferredForm:null, deferredEditId:null, modal:null,
             apiKeyModal:false, backupModal:false, backupMessage:"", scanningCard:null, scanError:"", expenseDraft:null,
             personalCreditForm:null, tab:"resumen", analysisQuery:"", donutSelected:null, toast:null,
             movQuery:"", movCategory:"", movCard:"", extraPayment:0, movCardPicker:false, deferredInstallPrompt:null, reassignCategory:null, updateAvailable:false, devModeModal:false, renamingCategory:null,
             cloudModal:false, cloudMode:"login", cloudError:"", cloudBusy:false, cloudUser:null, cloudStatus:"signed-out", cloudConflict:null, authChecked:false,
             deleteAccountModal:false, deleteAccountPassword:"", deleteAccountError:"", deleteAccountBusy:false, cloudResetSent:false };
  var API_KEY_STORAGE = "anthropic-api-key";
  var LAST_BACKUP_KEY = "last-backup-date";
  var DEV_MODE_STORAGE = "receipt-dev-mode-enabled";

  /* ====================================================================
     ARQUITECTURA DE IA PARA RECIBOS — LEE ESTO ANTES DE VENDER LA APP
     ====================================================================
     Para una versión comercial, define aquí la URL de TU backend propio
     (un servidor pequeño que reciba la imagen, llame a la API de Anthropic
     con tu clave del lado del servidor, y regrese el JSON extraído).
     Mientras AI_BACKEND_URL esté vacío, la app NUNCA llama a un backend
     propio — solo permite, de forma opcional y apagada por defecto, un
     "modo desarrollador" donde la propia persona usuaria pega su clave
     personal de Anthropic y el navegador llama a la API directo. Ese modo
     está pensado para pruebas locales, no para distribuir a clientes.

     Frontend → (si hay AI_BACKEND_URL) → Backend seguro → API de IA
     Frontend → (si no hay AI_BACKEND_URL, y modo desarrollador activo) → API de IA directo

     Formato esperado de la respuesta del backend (mismo formato en ambos casos):
     { "description": "texto o null", "amount": numero o null, "date": "YYYY-MM-DD" o null }
     ==================================================================== */
  var AI_BACKEND_URL = ""; // ej. "https://tu-backend.com/api/scan-receipt" — vacío = sin backend todavía

  function getApiKey(){ try{ return localStorage.getItem(API_KEY_STORAGE) || ""; }catch(e){ return ""; } }
  function setApiKey(k){ try{ localStorage.setItem(API_KEY_STORAGE, k); }catch(e){} }
  function isDevModeEnabled(){ try{ return localStorage.getItem(DEV_MODE_STORAGE) === "1"; }catch(e){ return false; } }
  function setDevModeEnabled(on){ try{ localStorage.setItem(DEV_MODE_STORAGE, on ? "1" : "0"); }catch(e){} }
  function getLastBackupDate(){ try{ return localStorage.getItem(LAST_BACKUP_KEY); }catch(e){ return null; } }

  /* ---------- helpers ---------- */
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function fmt(n){
    n = Math.round((n||0)*100)/100;
    return "$" + n.toLocaleString("es-MX",{minimumFractionDigits:0});
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function nextDueDate(day){
    if(!day) return null;
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var cand = new Date(now.getFullYear(), now.getMonth(), day);
    if(cand < today) cand = new Date(now.getFullYear(), now.getMonth()+1, day);
    return cand;
  }
  function daysUntil(date){
    var today = new Date(); today.setHours(0,0,0,0);
    var d = new Date(date); d.setHours(0,0,0,0);
    return Math.round((d-today)/86400000);
  }
  function nextCutoffDate(day){
    if(!day) return null;
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var cand = new Date(now.getFullYear(), now.getMonth(), day);
    if(cand < today) cand = new Date(now.getFullYear(), now.getMonth()+1, day);
    return cand;
  }
  function msiMonthly(p){ return p.months>0 ? p.total/p.months : 0; }
  function msiElapsed(plan, cutoffDay, dueDay){
    if(!cutoffDay || !dueDay || !plan.date) return plan.monthsPaid || 0;
    var cycle0 = billingCycle(plan.date, cutoffDay, dueDay);
    if(!cycle0) return plan.monthsPaid || 0;
    var today = new Date(); today.setHours(0,0,0,0);
    var count = 0;
    var pago = cycle0.pago;
    while(count < plan.months && pago < today){
      count++;
      pago = new Date(pago.getFullYear(), pago.getMonth()+1, pago.getDate());
    }
    return count;
  }
  function msiNextPago(plan, cutoffDay, dueDay){
    if(!cutoffDay || !dueDay || !plan.date) return null;
    var cycle0 = billingCycle(plan.date, cutoffDay, dueDay);
    if(!cycle0) return null;
    var paid = msiEffectivePaid(plan, cutoffDay, dueDay);
    if(paid >= plan.months) return null;
    var pago = cycle0.pago;
    for(var i=0;i<paid;i++) pago = new Date(pago.getFullYear(), pago.getMonth()+1, pago.getDate());
    return pago;
  }
  function msiEffectivePaid(plan, cutoffDay, dueDay){
    if(plan.paidMonths != null) return Math.min(plan.months, plan.paidMonths);
    return msiElapsed(plan, cutoffDay, dueDay);
  }
  function msiRemaining(plan, cutoffDay, dueDay){ return Math.max(0, plan.total - msiEffectivePaid(plan,cutoffDay,dueDay)*msiMonthly(plan)); }
  function cardMsiTotal(c){ return (c.msi||[]).reduce(function(s,p){return s+msiRemaining(p,c.cutoffDay,c.dueDay);},0); }
  function msiDueThisPeriod(card, due){
    if(!due) return 0;
    return (card.msi||[]).reduce(function(s,p){
      var next = msiNextPago(p, card.cutoffDay, card.dueDay);
      return (next && next.getTime()===due.getTime()) ? s+msiMonthly(p) : s;
    },0);
  }
  function dateLabel(d){ return new Date(d).toLocaleDateString("es-MX",{day:"numeric",month:"short"}); }
  function dateLabelFull(d){ return new Date(d).toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"}); }

  function billingCycle(dateISO, cutoffDay, dueDay){
    if(!cutoffDay || !dueDay) return null;
    var raw = new Date(dateISO);
    var d = new Date(raw.getFullYear(), raw.getMonth(), raw.getDate());
    var y = d.getFullYear(), m = d.getMonth();
    var cutThis = new Date(y, m, cutoffDay);
    var corte = d <= cutThis ? cutThis : new Date(y, m+1, cutoffDay);
    var cy = corte.getFullYear(), cm = corte.getMonth();
    var pagoSame = new Date(cy, cm, dueDay);
    var pago = pagoSame > corte ? pagoSame : new Date(cy, cm+1, dueDay);
    return {corte:corte, pago:pago};
  }
  function paymentSchedule(card){
    var groups = {};
    var unassigned = {total:0, count:0};
    (card.expenses||[]).forEach(function(e){
      var cycle = billingCycle(e.date, card.cutoffDay, card.dueDay);
      if(!cycle){ unassigned.total += e.amount; unassigned.count += 1; return; }
      var key = cycle.corte.toISOString().slice(0,10);
      if(!groups[key]) groups[key] = {corte:cycle.corte, pago:cycle.pago, total:0, count:0};
      groups[key].total += e.amount;
      groups[key].count += 1;
    });
    var cycles = Object.keys(groups).map(function(k){return groups[k];}).sort(function(a,b){return a.corte-b.corte;});
    return {cycles:cycles, unassigned:unassigned};
  }

  function withHistory(next){
    var totalDebt = next.cards.reduce(function(s,c){ return s + Math.max(0, (c.balance||0) + cardMsiTotal(c) + cardDeferredTotal(c) - (c.extraCredit||0)); },0) + totalPersonalCreditsDebt(next.personalCredits||[]);
    var totalSavings = next.savings.reduce(function(s,sv){ return s + (sv.current||0); },0);
    var now = new Date();
    var todayKey = now.toISOString().slice(0,10);
    var history = (next.history||[]).slice();
    var lastEntry = history[history.length-1];
    var lastKey = lastEntry ? new Date(lastEntry.date).toISOString().slice(0,10) : null;
    if(lastKey===todayKey){
      // ya guardamos un punto hoy: lo actualizamos en vez de sumar otro,
      // para que 500 puntos de historial alcancen para más de un año de uso activo,
      // en lugar de agotarse en unas semanas con varios cambios al día.
      history[history.length-1] = {date:now.toISOString(), totalDebt:totalDebt, totalSavings:totalSavings};
    }else{
      history.push({date:now.toISOString(), totalDebt:totalDebt, totalSavings:totalSavings});

      var remoteUpdatedAt = snap.exists ? (snap.data() && snap.data().updatedAt) : null;
      var remoteMarker = remoteUpdatedAt && remoteUpdatedAt.toMillis ? remoteUpdatedAt.toMillis() : null;
      var lastSynced = getLastSyncedMarker(uid);
      var alreadyReconciled = remoteMarker!=null && lastSynced!=null && String(remoteMarker)===String(lastSynced);

      var localHasContent = data.cards.length || data.savings.length || (data.personalCredits||[]).length;
      var remoteHasContent = remote && ((remote.cards||[]).length || (remote.savings||[]).length || (remote.personalCredits||[]).length);

      if(alreadyReconciled){

        ui.cloudStatus = "synced";

  function monthlyAggregate(history){
    if(!history || !history.length) return [];

  function cardAmountDueNow(card){
    var due = nextDueDate(card.dueDay);
    if(!due) return {due:null, amount:0, futureCycleTotal:0, amountDueNow:0};
    var schedule = paymentSchedule(card);
    var futureCycleTotal = schedule.cycles.filter(function(g){ return g.pago.getTime() > due.getTime(); }).reduce(function(s,g){ return s+g.total; },0);
    var amountDueNow = Math.max(0, card.balance - futureCycleTotal);
    var msiDue = msiDueThisPeriod(card, due);
    var defDue = deferredDueThisPeriod(card, due);
    var rawTotal = amountDueNow+msiDue+defDue;
    var credit = card.extraCredit || 0;
    return {due:due, amount: Math.max(0, rawTotal-credit), futureCycleTotal:futureCycleTotal, amountDueNow:amountDueNow, rawTotal:rawTotal, credit:credit};
  }

  function sortCardsByDue(cards){
    return cards.slice().sort(function(a,b){

      var bPending = db.due && db.amount > 0;
      if(aPending && !bPending) return -1;
      if(!aPending && bPending) return 1;
      if(!aPending && !bPending) return 0;
      return da.due - db.due;
    });
  }

  function upcomingDuePayments(cards){

  function monthTotal(expenses, year, month){

  var IVA_RATE = 0.16;
  function buildAmortization(principal, months, annualRatePct){
    var i = annualRatePct/100/12;
    var payment = i===0 ? principal/months : (principal*i)/(1-Math.pow(1+i,-months));
    var balance = principal;
    var rows = [];
    for(var m=1; m<=months; m++){
      var interest = balance*i;
      var capital = payment-interest;
      if(m===months || capital>balance) capital = balance;
      var iva = interest*IVA_RATE;
      var total = capital+interest+iva;
      balance = Math.max(0, balance-capital);
      rows.push({month:m, interest:interest, capital:capital, iva:iva, total:total, balanceAfter:balance});
    }
    return rows;
  }
  function deferredRemaining(plan, cutoffDay, dueDay){
    var paid = msiEffectivePaid(plan, cutoffDay, dueDay);
    var rows = buildAmortization(plan.principal, plan.months, plan.annualRate);
    return paid<=0 ? plan.principal : rows[Math.min(paid,plan.months)-1].balanceAfter;
  }
  function deferredNextPayment(plan, cutoffDay, dueDay){
    var paid = msiEffectivePaid(plan, cutoffDay, dueDay);
    if(paid >= plan.months) return null;
    var rows = buildAmortization(plan.principal, plan.months, plan.annualRate);
    return rows[paid];
  }
  function cardDeferredTotal(card){
    return (card.diferidos||[]).reduce(function(s,p){return s+deferredRemaining(p,card.cutoffDay,card.dueDay);},0);
  }
  function deferredDueThisPeriod(card, due){
    if(!due) return 0;
    return (card.diferidos||[]).reduce(function(s,p){
      var next = msiNextPago(p, card.cutoffDay, card.dueDay);
      if(!next || next.getTime()!==due.getTime()) return s;
      var row = deferredNextPayment(p, card.cutoffDay, card.dueDay);
      return row ? s+row.total : s;
    },0);
  }

  function personalInstallmentDate(credit, k){
    var start = new Date(credit.startDate);
    return new Date(start.getFullYear(), start.getMonth()+k, credit.paymentDay);
  }
  function personalElapsed(credit){
    if(credit.paidMonths != null) return Math.min(credit.months, credit.paidMonths);
    var today = new Date(); today.setHours(0,0,0,0);
    var count = 0;
    for(var k=1; k<=credit.months; k++){
      if(personalInstallmentDate(credit,k) < today) count++;
      else break;
    }
    return count;
  }
  function personalNextPaymentDate(credit){
    var paid = personalElapsed(credit);

    var paid = personalElapsed(credit);

    return paid<=0 ? credit.principal : rows[Math.min(paid,credit.months)-1].balanceAfter;

  var DONUT_COLORS = ["#0A84FF","#FF453A","#FF9F0A","#98989D","#64D2FF","#FF375F","#5E5CE6"];

  /* Asigna siempre el mismo color a la misma categoría (basado en su nombre, no en su
     posición al ordenar por gasto) — así "Comida" se ve igual mes con mes, en vez de
     cambiar de color según qué tanto se gastó ese periodo en particular. */
  function colorForCategory(name){
    var hash = 0;
    for(var i=0;i<name.length;i++){ hash = (hash*31 + name.charCodeAt(i)) & 0xffffffff; }
    var idx = Math.abs(hash) % DONUT_COLORS.length;
    return DONUT_COLORS[idx];
  }

     siempre el mismo degradado (basado en su nombre), como si fuera su color físico. */
  var CARD_GRADIENTS = [
    ["#3A3A3C","#1C1C1E"],

    ["#5E5CE6","#241F6B"],
    ["#32D74B","#0B4318"],

  function gradientForCard(name){
    var hash = 0;
    for(var i=0;i<name.length;i++){ hash = (hash*31 + name.charCodeAt(i)) & 0xffffffff; }
    return CARD_GRADIENTS[Math.abs(hash) % CARD_GRADIENTS.length];
  }

  function utilizationLevel(pct){

  function cardUsedTotal(card){

  function cardUtilizationPct(card){

  function debtByCard(cards){
    return cards.map(function(c,i){ return {label:c.name, value:cardUsedTotal(c), color:DONUT_COLORS[i%DONUT_COLORS.length]}; })
      .filter(function(d){ return d.value>0.5; })
      .sort(function(a,b){ return b.value-a.value; });
  }
  function paymentPriorityList(dataObj){
    var items = [];
    dataObj.cards.forEach(function(c){
      if(c.revolvingRate && c.balance>0){
        var hasRealMin = c.minPayment && c.minPayment>0;
        var estMin = hasRealMin ? c.minPayment : Math.max(c.balance*0.05, 300);
        items.push({label:c.name+" · saldo", type:"revolving", rate:c.revolvingRate, remaining:c.balance, monthlyPayment:estMin, amortPayment:estMin, isEstimated:!hasRealMin});
      }
      (c.diferidos||[]).forEach(function(p){
        var rem = deferredRemaining(p, c.cutoffDay, c.dueDay);
        if(rem>0.5){
          var paidD = msiEffectivePaid(p, c.cutoffDay, c.dueDay);
          var rowsD = buildAmortization(p.principal, p.months, p.annualRate);
          var rowD = rowsD.length ? rowsD[Math.min(paidD, p.months-1)] : null;
          items.push({label:c.name+" · "+p.description, type:"diferido", rate:p.annualRate, remaining:rem,
            monthlyPayment: rowD ? rowD.total : 0, amortPayment: rowD ? (rowD.capital+rowD.interest) : 0, isEstimated:false});
        }
      });
    });
    (dataObj.personalCredits||[]).forEach(function(c){
      var rem = personalRemaining(c);
      if(rem>0.5){
        var paidP = personalElapsed(c);
        var rowsP = buildAmortization(c.principal, c.months, c.annualRate);
        var rowP = rowsP.length ? rowsP[Math.min(paidP, c.months-1)] : null;
        items.push({label:c.description, type:"personalCredit", rate:c.annualRate, remaining:rem,
          monthlyPayment: rowP ? rowP.total : 0, amortPayment: rowP ? (rowP.capital+rowP.interest) : 0, isEstimated:false});
      }
    });
    return items.sort(function(a,b){ return b.rate-a.rate; });
  }
  function detectSubscriptions(cards, dismissed){
    dismissed = dismissed || [];
    var all = [];
    cards.forEach(function(c){ (c.expenses||[]).forEach(function(e){ all.push(Object.assign({}, e, {card:c.name})); }); });
    var groups = {};
    all.forEach(function(e){
      var key = e.description.trim().toLowerCase();
      if(!key) return;
      if(!groups[key]) groups[key] = [];
      groups[key].push(e);
    });
    var subs = [];
    Object.keys(groups).forEach(function(key){
      if(dismissed.indexOf(key)!==-1) return;
      var list = groups[key];
      if(list.length<2) return;
      var months = {};
      list.forEach(function(e){ var d=new Date(e.date); months[d.getFullYear()+"-"+d.getMonth()]=true; });
      var distinctMonths = Object.keys(months).length;
      if(distinctMonths<2) return;
      var amounts = list.map(function(e){ return e.amount; });
      var avg = amounts.reduce(function(s,a){return s+a;},0)/amounts.length;
      var consistent = amounts.every(function(a){ return Math.abs(a-avg)/avg < 0.15; });
      if(!consistent) return;
      // frecuencia aproximada: promedio de días entre cargos consecutivos ordenados por fecha
      var sortedDates = list.map(function(e){ return new Date(e.date).getTime(); }).sort(function(a,b){return a-b;});
      var gaps = [];
      for(var i=1;i<sortedDates.length;i++){ gaps.push((sortedDates[i]-sortedDates[i-1])/86400000); }
      var avgGapDays = gaps.length ? gaps.reduce(function(s,g){return s+g;},0)/gaps.length : 30;
      var freqLabel = avgGapDays<=10 ? "semanal" : avgGapDays<=45 ? "mensual" : avgGapDays<=100 ? "trimestral" : "anual";
      var monthlyEquivalent = avgGapDays<=10 ? avg*4.33 : avgGapDays<=45 ? avg : avgGapDays<=100 ? avg/3 : avg/12;
      subs.push({key:key, description:list[0].description, card:list[0].card, avgAmount:avg, count:list.length, freqLabel:freqLabel, monthlyEquivalent:monthlyEquivalent});
    });
    return subs.sort(function(a,b){ return b.monthlyEquivalent-a.monthlyEquivalent; });
  }

  /* ---------- salud financiera ---------- */
  function computeHealthScore(dataObj, totalDebt, totalSavings){
    var reasons = [];
    var score = 100;
    var factorsEvaluated = 0;
    var factorsSkipped = [];

    // 1) Utilización promedio de tarjetas (peso alto)
    var cardsWithLimit = dataObj.cards.filter(function(c){ return c.limit>0; });
    var avgUtil = 0;
    if(cardsWithLimit.length){
      factorsEvaluated++;
      avgUtil = cardsWithLimit.reduce(function(s,c){ return s+cardUtilizationPct(c); },0)/cardsWithLimit.length;
      var utilPenalty = Math.round(Math.min(30, (avgUtil/100)*30));
      score -= utilPenalty;
      if(avgUtil>=70) reasons.push({text:"Tu utilización promedio de tarjetas es de "+Math.round(avgUtil)+"%. Bajarla de 70% suele ayudar según nuestros criterios internos (no es una regla bancaria universal).", weight:utilPenalty});
    }

    // 2) Capacidad de ahorro (ingresos vs gasto) — SOLO si el usuario configuró su sueldo real en Presupuesto.
    // Nunca usamos el valor de referencia ($6,800) que trae la app por defecto: eso produciría un score falso.
    if(dataObj.budget && dataObj.budget.configured && (dataObj.budget.salary||0)>0){
      factorsEvaluated++;
      var salaryMonthly = dataObj.budget.salary*4.33;
      var now = new Date();
      var gastoMes = dataObj.cards.reduce(function(s,c){ return s+monthTotal(c.expenses||[], now.getFullYear(), now.getMonth()); },0);
      var capacidad = Math.max(-1, (salaryMonthly-gastoMes)/salaryMonthly);
      var capPenalty = capacidad<0.1 ? Math.round(Math.min(20, (0.1-capacidad)*100)) : 0;
      score -= capPenalty;
      if(capPenalty>0) reasons.push({text:"Tu capacidad de ahorro este mes es baja frente al sueldo mensual que tú configuraste en Presupuesto ("+fmt(dataObj.budget.salary)+"/semana). Si ese número ya no es correcto, actualízalo.", weight:capPenalty});
    }else{
      factorsSkipped.push("capacidad de ahorro (no has configurado tu sueldo en Presupuesto)");
    }

    // 3) Relación deuda / ahorro
    var debtSavingsPenalty = 0;
    if(totalDebt>0){
      factorsEvaluated++;
      var ratio = totalSavings>0 ? totalDebt/totalSavings : (totalDebt>0?3:0);
      debtSavingsPenalty = Math.round(Math.min(20, Math.max(0, (ratio-1)*8)));
      score -= debtSavingsPenalty;
      if(debtSavingsPenalty>0) reasons.push({text:"Tu deuda total es varias veces mayor que tu ahorro acumulado (criterio interno de esta app, no un estándar de la industria).", weight:debtSavingsPenalty});
    }

    // 4) Pagos próximos vencidos o urgentes
    var urgentPayments = upcomingDuePayments(dataObj.cards).filter(function(a){ return a.dLeft<=3; }).length +
      upcomingPersonalCreditPayments(dataObj.personalCredits).filter(function(a){ return a.dLeft<=3; }).length;
    if(urgentPayments>0){
      factorsEvaluated++;
      var payPenalty = Math.min(15, urgentPayments*5);
      score -= payPenalty;
      reasons.push({text:"Tienes "+urgentPayments+" pago(s) venciendo en los próximos 3 días.", weight:payPenalty});
    }

    // 5) Progreso de reducción de deuda (usando historial)
    var points = monthlyAggregate(dataObj.history);
    if(points.length>=2){
      factorsEvaluated++;
      var prevDebt = points[points.length-2].Deuda;
      var lastDebt = points[points.length-1].Deuda;
      if(prevDebt>0 && lastDebt>prevDebt){
        var growthPenalty = 10;
        score -= growthPenalty;
        reasons.push({text:"Tu deuda total creció respecto al mes anterior.", weight:growthPenalty});
      }
    }

    score = Math.max(0, Math.min(100, Math.round(score)));
    reasons.sort(function(a,b){ return b.weight-a.weight; });
    var level = score>=70 ? {label:"Bien", color:"var(--mint)", icon:"🟢"} : score>=40 ? {label:"Atención", color:"var(--amber)", icon:"🟡"} : {label:"Crítico", color:"var(--coral)", icon:"🔴"};
    return {
      score:score, level:level,
      mainReason: reasons.length ? reasons[0].text : "No detectamos focos rojos importantes con la información registrada.",
      reasons:reasons, factorsEvaluated:factorsEvaluated, factorsSkipped:factorsSkipped
    };
  }

  function categoryBreakdown(cards, year, month){
    var byCat = {};
    var total = 0;
    cards.forEach(function(c){

  /* ---------- plan para salir de deudas ---------- */
  function debtPayoffPlan(dataObj, extraMonthly){
    extraMonthly = extraMonthly || 0;
    var items = paymentPriorityList(dataObj); // ya viene ordenado de mayor a menor tasa (avalancha)
    var totalDebt = items.reduce(function(s,i){ return s+i.remaining; },0);
    if(!items.length) return null;
    var hasEstimated = items.some(function(i){ return i.isEstimated; });
    var totalMonthlyPayment = items.reduce(function(s,i){ return s+(i.monthlyPayment||0); },0);

    function simulate(extra){
      // Cada partida se amortiza con su propio pago real (diferidos/créditos personales usan su
      // mensualidad ya calculada con interés + IVA) o, cuando no hay un pago registrado
      // (saldo revolvente de tarjeta), con un pago mínimo estimado — señalado como tal en la UI.
      // El método avalancha aplica el pago adicional íntegro a la deuda de mayor tasa vigente;
      // al liquidarse, su mensualidad completa se libera y se suma al "pool" disponible para las demás.
      //
      // amortPayment (capital+interés, SIN IVA) es lo que reduce el saldo cada mes — el IVA no
      // amortiza capital, es un impuesto adicional sobre el interés. Pero el costo total que
      // reportamos al usuario ("intereses estimados") SÍ debe incluir el IVA cuando la deuda lo
      // genera (diferidos y créditos personales), igual que se muestra en el detalle de cada
      // tarjeta/crédito — de lo contrario el IVA "desaparecería" del estimado. Las tarjetas
      // revolventes no manejan IVA en ningún otro cálculo de la app, así que no se le agrega aquí.
      var balances = items.map(function(i){ return {type:i.type, rate:i.rate, remaining:i.remaining, amortPayment:i.amortPayment||i.monthlyPayment||0}; });
      var months = 0, totalInterest = 0;
      while(balances.some(function(b){ return b.remaining>0.5; }) && months<600){
        months++;
        var freedUp = 0; // mensualidades de deudas ya liquidadas, redirigidas a la de mayor tasa (bola de nieve del método avalancha)
        for(var k=0;k<balances.length;k++){
          var bk = balances[k];
          if(bk.remaining<=0.5){
            freedUp += bk.amortPayment; // esta deuda ya se liquidó: su pago mensual se redirige a las demás
            continue;
          }
          var monthlyRate = (bk.rate/100)/12;
          var interest = bk.remaining*monthlyRate;
          var interestCost = (bk.type==="diferido" || bk.type==="personalCredit") ? interest*(1+IVA_RATE) : interest;
          totalInterest += interestCost;
          var pay = Math.min(bk.amortPayment+freedUp, bk.remaining+interest);
          freedUp = Math.max(0, (bk.amortPayment+freedUp) - pay);
          bk.remaining = Math.max(0, bk.remaining + interest - pay);
        }
        // pago extra: se aplica completo a la deuda de mayor tasa que siga pendiente (avalancha)
        var availableExtra = extra;
        for(var j=0;j<balances.length;j++){
          if(availableExtra<=0) break;
          var bj = balances[j];
          if(bj.remaining<=0.5) continue;
          var payExtra = Math.min(availableExtra, bj.remaining);
          bj.remaining -= payExtra;
          availableExtra -= payExtra;
        }
      }
      return { months: months, totalInterest: totalInterest };
    }

    var base = simulate(0);
    var withExtra = extraMonthly>0 ? simulate(extraMonthly) : base;
    return {
      items: items,
      totalDebt: totalDebt,
      hasEstimated: hasEstimated,
      totalMonthlyPayment: totalMonthlyPayment,
      currentMonths: base.months,
      currentInterest: base.totalInterest,
      extraMonths: withExtra.months,
      extraInterest: withExtra.totalInterest,
      monthsSaved: Math.max(0, base.months - withExtra.months),
      interestSaved: Math.max(0, base.totalInterest - withExtra.totalInterest)
    };
  }

  function scanReceipt(cardId, file){
    if(!AI_BACKEND_URL && !isDevModeEnabled()){
      ui.devModeModal = true;
      render();
      return;
    }
    if(!AI_BACKEND_URL && !getApiKey()){
      ui.apiKeyModal = true;
      render();
      return;
    }
    ui.scanningCard = cardId;
    ui.scanError = "";
    render();
    fileToBase64(file).then(function(base64){
      if(AI_BACKEND_URL){
        // Arquitectura recomendada: la imagen va a TU backend, que guarda la clave del lado del servidor.
        return fetch(AI_BACKEND_URL, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ image: base64, mediaType: file.type || "image/jpeg" })
        }).then(function(res){ return res.json(); }).then(function(json){
          return { fromBackend:true, data: json };
        });
      }
      // Modo desarrollador (BYO key): llamada directa desde el navegador, solo para pruebas locales.
      var apiKey = getApiKey();
      return fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 500,
          messages: [{
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: file.type || "image/jpeg", data: base64 } },
              { type: "text", text: 'Analiza esta foto de un recibo o comprobante de compra. Responde ÚNICAMENTE con un objeto JSON, sin texto adicional ni markdown, con este formato exacto: {"description": "nombre breve del comercio o compra (máx 40 caracteres)", "amount": monto_total_pagado_como_numero, "date": "YYYY-MM-DD si la fecha es visible, si no null"}. Si no puedes leer el recibo con claridad, responde {"description": null, "amount": null, "date": null}.' }
            ]
          }]
        })
      }).then(function(res){ return res.json(); }).then(function(resp){
        return { fromBackend:false, data: resp };
      });
    }).then(function(wrapped){
      var parsed;
      if(wrapped.fromBackend){
        if(wrapped.data && wrapped.data.error){ throw new Error(wrapped.data.error); }
        parsed = wrapped.data || {};
      }else{
        var resp = wrapped.data;
        if(resp && resp.error){ throw new Error(resp.error.message || "error de API"); }
        var text = (resp.content||[]).filter(function(c){return c.type==="text";}).map(function(c){return c.text;}).join("");
        var clean = text.replace(/```json|```/g,"").trim();
        parsed = JSON.parse(clean);
      }
      var draft = { description:"", amount:"", date: new Date().toISOString().slice(0,10) };
      if(parsed.description) draft.description = String(parsed.description).slice(0,60);
      if(parsed.amount && !isNaN(parsed.amount)) draft.amount = String(parsed.amount);
      if(parsed.date && /^\d{4}-\d{2}-\d{2}$/.test(parsed.date)) draft.date = parsed.date;
      if(!parsed.description && !parsed.amount){
        ui.scanError = "No pude leer el recibo con claridad. Revisa los datos o llénalos a mano.";
      }
      ui.expenseDraft = draft;
      ui.expenseForm = cardId;
      ui.scanningCard = null;
      render();
    }).catch(function(err){
      ui.scanError = "No se pudo leer la foto (" + err.message + "). Intenta de nuevo o llena los datos a mano.";
      ui.expenseForm = cardId;
      ui.scanningCard = null;
      render();
    });
  }

  function computePaymentEffect(card, amount, due, rawTotal){
    var balanceApplied = Math.min(amount, card.balance);
    var leftoverBanked = amount - balanceApplied;
    var existingCredit = card.extraCredit || 0;
    var coversEverything = due && rawTotal > 0 && (amount + existingCredit) >= rawTotal - 0.01;
    var msi = card.msi || [];
    var diferidos = card.diferidos || [];
    var extraCredit = existingCredit + leftoverBanked;
    if(coversEverything){
      msi = msi.map(function(p){
        var next = msiNextPago(p, card.cutoffDay, card.dueDay);
        if(next && next.getTime()===due.getTime()){
          var paid = msiEffectivePaid(p, card.cutoffDay, card.dueDay);
          return Object.assign({}, p, {paidMonths: Math.min(p.months, paid+1)});
        }
        return p;
      });
      diferidos = diferidos.map(function(p){
        var next = msiNextPago(p, card.cutoffDay, card.dueDay);
        if(next && next.getTime()===due.getTime()){
          var paid2 = msiEffectivePaid(p, card.cutoffDay, card.dueDay);
          return Object.assign({}, p, {paidMonths: Math.min(p.months, paid2+1)});
        }
        return p;
      });
      var nonBalancePortion = Math.max(0, rawTotal - balanceApplied);
      extraCredit = Math.max(0, extraCredit - nonBalancePortion);
    }
    return {
      balanceApplied: balanceApplied,
      creditAdded: leftoverBanked,
      msi: msi,
      diferidos: diferidos,
      extraCredit: extraCredit,
      newBalance: Math.max(0, +(card.balance-balanceApplied).toFixed(2))
    };
  }

  function registerPayment(cardId, amount, dateStr){
    if(!amount || isNaN(amount) || amount<=0) return;
    var iso = dateStr ? new Date(dateStr+"T12:00:00").toISOString() : new Date().toISOString();
    var cardBefore = data.cards.find(function(c){return c.id===cardId;});
    if(!cardBefore) return;
    var info = cardAmountDueNow(cardBefore);
    var effect = computePaymentEffect(cardBefore, amount, info.due, info.rawTotal);
    var cards = data.cards.map(function(c){
      if(c.id!==cardId) return c;
      var payments = (c.payments||[]).concat([{id:uid(), date:iso, amount:amount, balanceApplied:effect.balanceApplied, creditAdded:effect.creditAdded}])
        .sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
      return Object.assign({}, c, {balance: effect.newBalance, payments:payments, msi:effect.msi, diferidos:effect.diferidos, extraCredit:effect.extraCredit});
    });
    persist(withHistory(Object.assign({}, data, {cards:cards})));
  }

  function updatePayment(cardId, paymentId, amount, dateStr){
    if(!amount || isNaN(amount) || amount<=0) return;
    var iso = dateStr ? new Date(dateStr+"T12:00:00").toISOString() : new Date().toISOString();
    var cardBefore = data.cards.find(function(c){return c.id===cardId;});
    if(!cardBefore) return;
    var oldPayment = (cardBefore.payments||[]).find(function(p){return p.id===paymentId;});
    if(!oldPayment) return;
    var oldBalanceApplied = oldPayment.balanceApplied != null ? oldPayment.balanceApplied : oldPayment.amount;
    var oldCreditAdded = oldPayment.creditAdded || 0;
    var reversedCard = Object.assign({}, cardBefore, {
      balance: +(cardBefore.balance + oldBalanceApplied).toFixed(2),
      extraCredit: Math.max(0, (cardBefore.extraCredit||0) - oldCreditAdded)
    });
    var info = cardAmountDueNow(reversedCard);
    var effect = computePaymentEffect(reversedCard, amount, info.due, info.rawTotal);
    var cards = data.cards.map(function(c){
      if(c.id!==cardId) return c;
      var payments = (c.payments||[]).map(function(p){
        return p.id===paymentId ? Object.assign({},p,{amount:amount, date:iso, balanceApplied:effect.balanceApplied, creditAdded:effect.creditAdded}) : p;
      }).sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
      return Object.assign({}, c, {balance: effect.newBalance, payments:payments, msi:effect.msi, diferidos:effect.diferidos, extraCredit:effect.extraCredit});
    });
    persist(withHistory(Object.assign({}, data, {cards:cards})));
  }

    var cards = data.cards.map(function(c){
      if(c.id!==cardId) return c;
      var p = (c.payments||[]).find(function(x){return x.id===paymentId;});
      var payments = (c.payments||[]).filter(function(x){return x.id!==paymentId;});
      if(!p) return Object.assign({}, c, {payments:payments});
      var balanceApplied = p.balanceApplied != null ? p.balanceApplied : p.amount;
      var creditAdded = p.creditAdded || 0;
      return Object.assign({}, c, {

  function restorePayment(cardId, paymentObj){
    if(!paymentObj) return;
    var balanceApplied = paymentObj.balanceApplied != null ? paymentObj.balanceApplied : paymentObj.amount;
    var creditAdded = paymentObj.creditAdded || 0;
    var cards = data.cards.map(function(c){
      if(c.id!==cardId) return c;
      if((c.payments||[]).some(function(p){ return p.id===paymentObj.id; })) return c; // ya existe, evita duplicados
      var payments = (c.payments||[]).concat([paymentObj]);
      return Object.assign({}, c, {
        balance: Math.max(0, +(c.balance-balanceApplied).toFixed(2)),
        extraCredit: (c.extraCredit||0) + creditAdded,
        payments: payments
      });

  function updateExpense(cardId, expenseId, amount, description, dateStr, category){
    if(!amount || isNaN(amount) || amount<=0) return;
    var iso = dateStr ? new Date(dateStr+"T12:00:00").toISOString() : new Date().toISOString();
    var cards = data.cards.map(function(c){
      if(c.id!==cardId) return c;
      var old = (c.expenses||[]).find(function(e){return e.id===expenseId;});
      var diff = old ? amount-old.amount : 0;
      var expenses = (c.expenses||[]).map(function(e){ return e.id===expenseId ? Object.assign({},e,{amount:amount, description:description||"Gasto", date:iso, category:category||e.category||"Otros"}) : e; });
      return Object.assign({}, c, {balance: Math.max(0, +(c.balance+diff).toFixed(2)), expenses:expenses});
    });
    persist(withHistory(Object.assign({}, data, {cards:cards})));
  }
  function deleteExpense(cardId, expenseId){
    var cardBefore = data.cards.find(function(c){return c.id===cardId;});
    var deletedExpense = cardBefore ? (cardBefore.expenses||[]).find(function(e){return e.id===expenseId;}) : null;
    var cards = data.cards.map(function(c){
      if(c.id!==cardId) return c;
      var exp = (c.expenses||[]).find(function(e){return e.id===expenseId;});
      var expenses = (c.expenses||[]).filter(function(e){return e.id!==expenseId;});
      var balance = exp ? Math.max(0, +(c.balance-exp.amount).toFixed(2)) : c.balance;
      return Object.assign({}, c, {expenses:expenses, balance:balance});

  function renderCategoryBreakdown(){
    var now = new Date();
    var cur = categoryBreakdown(data.cards, now.getFullYear(), now.getMonth());

    var prev = categoryBreakdown(data.cards, prevM.year, prevM.month);
    if(!cur.byCat.length) return "";
    var prevByCat = {};
    prev.byCat.forEach(function(c){ prevByCat[c.category]=c.amount; });
    var topGrowth = null;
    cur.byCat.forEach(function(c){
      var before = prevByCat[c.category]||0;
      var growth = before>0 ? ((c.amount-before)/before)*100 : (c.amount>0?100:0);
      c.growth = growth;
      c.hasPrev = before>0;
      if(growth>0 && (!topGrowth || growth>topGrowth.growth)) topGrowth = c;
    });

  function renderAnalysisSection(){
    var html = '<div style="display:flex;flex-direction:column;gap:24px;">';
    var utilCards = data.cards.filter(function(c){ return c.limit>0; });
    var highUtil = utilCards.filter(function(c){ return cardUtilizationPct(c)>=70; })
      .sort(function(a,b){ return cardUtilizationPct(b)-cardUtilizationPct(a); });
    var donut = debtByCard(data.cards);
    var subs = detectSubscriptions(data.cards, data.dismissedSubscriptions||[]);
    var subsTotal = subs.reduce(function(s,x){ return s+x.monthlyEquivalent; },0);

    html += renderCategoryBreakdown();

    if(highUtil.length){
      html += '<section><div class="sec-title" style="margin-bottom:12px;">⚠ Utilización alta de crédito</div><div style="display:flex;flex-direction:column;gap:8px;">';
      highUtil.forEach(function(c){

        html += '<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:6px;">'+
          '<span style="color:var(--text);font-size:14px;">'+esc(c.name)+'</span>'+

          '<div style="color:var(--muted);font-size:11px;margin-top:6px;">Referencia orientativa: menor a 30% se considera ideal, 30–69% pide atención, 70% o más se considera alta. No son reglas bancarias universales, solo una guía general.</div>'+

      html += '</div></section>';

    if(donut.length){

      html += '<div style="color:var(--muted);font-size:11px;margin-bottom:12px;">No podemos confirmar con certeza que sea una suscripción — solo que el patrón se repite. Confírmala o descártala si no lo es.</div>';

        var confirmed = (data.confirmedSubscriptions||[]).indexOf(s.key)!==-1;
        html += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--surface2);">'+
          '<div style="min-width:0;flex:1;"><div style="color:var(--text);font-size:12px;display:flex;align-items:center;gap:6px;">'+esc(s.description)+
          (confirmed?'<span style="color:var(--mint);font-size:10px;">✓ confirmada</span>':'<span style="color:var(--amber);font-size:10px;">posible suscripción</span>')+'</div>'+
          '<div style="color:var(--muted);font-size:11px;">'+esc(s.card)+' · '+s.freqLabel+' · '+s.count+' cargos</div>'+
          '<div style="color:var(--mint);font-family:var(--mono);font-size:12px;margin-top:2px;">'+fmt(s.avgAmount)+' c/u · ≈'+fmt(s.monthlyEquivalent)+'/mes</div></div>'+
          '<div style="display:flex;gap:6px;flex-shrink:0;">'+
          (confirmed?'':'<button class="icon-btn" data-act="confirm-subscription" data-key="'+esc(s.key)+'" title="Confirmar">✓</button>')+
          '<button class="icon-btn" data-act="discard-subscription" data-key="'+esc(s.key)+'" title="No es suscripción">✕</button>'+
          '</div></div>';
      });
      html += '<div style="padding-top:2px;color:var(--muted);font-size:11px;">Total estimado: <span style="color:var(--text);">'+fmt(subsTotal)+'/mes</span> · <span style="color:var(--text);">'+fmt(subsTotal*12)+'/año</span></div>';
    }
    html += '</div></section>';

    html += '<section><div class="sec-title" style="margin-bottom:12px;">Buscar movimientos</div>'+
      '<div class="form-row">'+
      '<input type="text" id="analysis-search" placeholder="Ej. Netflix, Carnicería..." value="'+esc(ui.analysisQuery||"")+'" />'+
      '<button class="btn-save" data-act="run-search" style="max-width:90px;">Buscar</button>'+
      '</div>';
    var q = (ui.analysisQuery||"").trim();
    if(q.length>=2){
      var results = searchMovements(data.cards, q);
      html += '<div class="card">';
      if(!results.length){
        html += '<div style="color:var(--muted);font-size:12px;">Sin resultados para "'+esc(q)+'".</div>';
      }else{

        });

    html += '</section>';

    html += '</div>';

  function renderAlerts(){
    var s = data.settings;
    var alerts = s.alertPayments ? upcomingDuePayments(data.cards) : [];
    var loanAlerts = s.alertPayments ? upcomingPersonalCreditPayments(data.personalCredits) : [];

    var out = "";

    if(s.alertBudget && data.budget.configured){
      var now0 = new Date();
      var gastoMes0 = data.cards.reduce(function(sum,c){ return sum+monthTotal(c.expenses||[], now0.getFullYear(), now0.getMonth()); },0);

    if(s.alertGoals){

        return sv.goal>0 && sv.current>=sv.goal && (data.celebratedGoalIds||[]).indexOf(sv.id)===-1;
      });
      if(reachedGoals.length){
        var reachedRows = reachedGoals.map(function(sv){
          return '<div class="row" style="align-items:center;"><span>🎉 '+esc(sv.name)+'</span>'+
            '<button data-act="dismiss-goal-celebration" data-id="'+sv.id+'" style="background:none;border:none;color:var(--mint);font-size:11px;padding:0;">✓ Genial</button></div>';
        }).join("");
        out += '<div class="alerts" style="background:#0F2A22;border-left-color:var(--mint);margin-top:'+(out?"8px":"0")+';"><div class="title" style="color:var(--mint);">🟢 ¡Meta de ahorro alcanzada!</div>'+reachedRows+'</div>';
      }
      var delayedGoals = data.savings.filter(function(sv){
        if(!sv.targetDate) return false;
        var target = new Date(sv.targetDate); target.setHours(0,0,0,0);
        var today = new Date(); today.setHours(0,0,0,0);
        return target<today && sv.current<sv.goal;
      });
      if(delayedGoals.length){
        var goalRows = delayedGoals.map(function(sv){
          return '<div class="row"><span>'+esc(sv.name)+'</span><span class="amt" style="color:var(--amber)">meta retrasada</span></div>';
        }).join("");
        out += '<div class="alerts" style="background:#241E15;border-left-color:var(--amber);margin-top:'+(out?"8px":"0")+';"><div class="title" style="color:var(--amber);">🟡 Metas de ahorro retrasadas</div>'+goalRows+'</div>';
      }
    }
    if(s.alertUtilization){
      var highUtilCards = data.cards.filter(function(c){ return c.limit>0 && cardUtilizationPct(c)>=70; });
      if(highUtilCards.length){
        var utilRows = highUtilCards.map(function(c){
          return '<div class="row"><span>'+esc(c.name)+'</span><span class="amt" style="color:var(--amber)">'+Math.round(cardUtilizationPct(c))+'% de uso</span></div>';
        }).join("");
        out += '<div class="alerts" style="background:#241E15;border-left-color:var(--amber);margin-top:'+(out?"8px":"0")+';"><div class="title" style="color:var(--amber);">🟡 Utilización de crédito alta</div>'+utilRows+'</div>';
      }
    }
    if(s.alertDebtGrowth){
      var histPoints = monthlyAggregate(data.history);
      if(histPoints.length>=2){
        var prevD = histPoints[histPoints.length-2].Deuda;
        var lastD = histPoints[histPoints.length-1].Deuda;
        if(prevD>0 && lastD>prevD){
          out += '<div class="alerts" style="background:#241E15;border-left-color:var(--amber);margin-top:'+(out?"8px":"0")+';"><div class="title" style="color:var(--amber);">🟡 Tu deuda total creció</div>'+
            '<div class="row"><span>Vs. mes anterior</span><span class="amt" style="color:var(--amber)">'+fmt(prevD)+' → '+fmt(lastD)+'</span></div></div>';
        }
      }
    }

    if(alerts.length){
      var rows = alerts.map(function(a){
        var color = a.dLeft<=3 ? "var(--coral)" : "var(--amber)";
        var label = a.dLeft===0 ? "hoy" : ("en "+a.dLeft+" día"+(a.dLeft===1?"":"s"));
        return '<div class="row"><span>'+esc(a.card.name)+'</span><span class="amt" style="color:'+color+'">'+label+' · '+dateLabel(a.due)+'</span></div>';
      }).join("");
      out += '<div class="alerts"><div class="title">⏰ Pagos próximos (tarjetas)</div>'+rows+'</div>';
    }
    if(loanAlerts.length){
      var rows3 = loanAlerts.map(function(a){
        var color = a.dLeft<=3 ? "var(--coral)" : "var(--amber)";
        var label = a.dLeft===0 ? "hoy" : ("en "+a.dLeft+" día"+(a.dLeft===1?"":"s"));
        return '<div class="row"><span>'+esc(a.credit.description)+'</span><span class="amt" style="color:'+color+'">'+label+' · '+dateLabel(a.date)+'</span></div>';
      }).join("");
      out += '<div class="alerts" style="background:#1A1D24;border-left-color:var(--mint);margin-top:'+(alerts.length?'8px':'0')+';"><div class="title" style="color:var(--mint);">⏰ Cuotas próximas (préstamos)</div>'+rows3+'</div>';
    }
    if(cutoffs.length){
      var rows2 = cutoffs.map(function(a){
        var label = a.dLeft===0 ? "hoy" : ("en "+a.dLeft+" día"+(a.dLeft===1?"":"s"));
        return '<div class="row"><span>'+esc(a.card.name)+'</span><span class="amt" style="color:var(--amber)">'+label+' · '+dateLabel(a.cutoff)+'</span></div>';
      }).join("");
      out += '<div class="alerts" style="background:#241E15;border-left-color:var(--amber);margin-top:'+((alerts.length||loanAlerts.length)?'8px':'0')+';"><div class="title" style="color:var(--amber);">⏰ Cortes próximos</div>'+rows2+'</div>';
    }
    return out;
  }

  function renderBudgetPanel(totalDebt){
    var b = data.budget;
    var salary = b.salary || 0;
    var pctSum = b.pctGastos + b.pctDiversion + b.pctAhorro;
    function weekly(pct){ return salary*pct/100; }
    function monthly(pct){ return weekly(pct)*4.33; }
    var rows = [
      {key:"gastos", label:"Gastos", val:b.pctGastos, color:"var(--coral)"},
      {key:"diversion", label:"Diversión", val:b.pctDiversion, color:"var(--amber)"},
      {key:"ahorro", label:"Ahorro", val:b.pctAhorro, color:"var(--mint)"}
    ];
    var html = '<div class="bank-box">';
    html += '<div class="bank-title">Presupuesto semanal</div>';
    if(!b.configured){
      html += '<div style="color:var(--muted);font-size:11px;line-height:1.5;margin-bottom:10px;">Todavía no has confirmado tu sueldo real. Hasta que lo hagas, no usamos ningún número de sueldo en tu Salud financiera ni en el semáforo de presupuesto — el campo de abajo trae un valor de ejemplo, no lo tomamos como tuyo.</div>';
    }
    html += '<span class="field-label">Sueldo semanal</span><input type="text" inputmode="decimal" id="budget-salary" value="'+salary+'" style="margin-bottom:10px;" />';
    rows.forEach(function(r){
      html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--surface2);">'+
        '<div style="display:flex;align-items:center;gap:8px;">'+
        '<span style="font-size:14px;">'+r.label+'</span>'+
        '<input type="text" inputmode="numeric" id="budget-pct-'+r.key+'" value="'+r.val+'" style="width:44px;padding:6px 8px;text-align:center;color:'+r.color+';" />'+
        '<span style="color:var(--muted);font-size:12px;">%</span>'+
        '</div>'+
        '<div style="text-align:right;">'+
        '<div style="color:'+r.color+';font-family:var(--mono);font-size:13px;">'+fmt(weekly(r.val))+'/sem</div>'+
        '<div style="color:var(--muted);font-family:var(--mono);font-size:11px;">≈ '+fmt(monthly(r.val))+'/mes</div>'+
        '</div></div>';
    });
    if(pctSum !== 100){
      html += '<div style="color:var(--amber);font-size:11px;margin-top:8px;">Los porcentajes suman '+pctSum+'%, no 100% — ajústalos si quieres que cuadre exacto.</div>';
    }
    if(!b.configured){
      html += '<button class="modal-save" data-act="save-budget" style="margin-top:12px;">Confirmar mi sueldo y activar el presupuesto</button>';
      html += '</div>';
      return html;
    }
    var now = new Date();
    var gastoMesActual = data.cards.reduce(function(s,c){ return s+monthTotal(c.expenses||[], now.getFullYear(), now.getMonth()); },0);
    var presupuestoGastoMensual = monthly(b.pctGastos);
    if(presupuestoGastoMensual>0){
      var usedPct = Math.min(999, (gastoMesActual/presupuestoGastoMensual)*100);
      var semColor = usedPct>=100 ? "var(--coral)" : usedPct>=80 ? "var(--amber)" : "var(--mint)";
      var semIcon = usedPct>=100 ? "🔴" : usedPct>=80 ? "🟡" : "🟢";
      var daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
      var daysLeft = daysInMonth - now.getDate();
      html += '<div style="background:var(--surface3);border-radius:10px;padding:10px 12px;margin-top:12px;">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">'+
        '<span style="color:var(--text);font-size:12px;">'+semIcon+' Presupuesto de gastos del mes</span>'+
        '<span style="color:'+semColor+';font-family:var(--mono);font-size:12px;">'+Math.round(usedPct)+'%</span></div>'+
        '<div class="bar"><div class="bar-fill" style="width:'+Math.min(100,usedPct)+'%;background:'+semColor+';"></div></div>'+
        '<div style="color:var(--muted);font-size:11px;margin-top:6px;">Has usado '+fmt(gastoMesActual)+' de '+fmt(presupuestoGastoMensual)+' y quedan '+daysLeft+' día'+(daysLeft===1?"":"s")+' del mes.</div>'+
        '</div>';
    }
    if(totalDebt > 0){
      var PAYOFF_WEEKS = 26;
      var suggestedWeekly = totalDebt / PAYOFF_WEEKS;
      var currentAhorroWeekly = weekly(b.pctAhorro);
      var onTrack = currentAhorroWeekly >= suggestedWeekly;
      var suggestedPct = salary>0 ? Math.min(100, Math.round((suggestedWeekly/salary)*100)) : null;

  function renderPersonalCreditRow(credit){

    var remaining = personalRemaining(credit);
    var nextRow = personalNextPaymentRow(credit);
    var nextDate = personalNextPaymentDate(credit);
    var donePct = Math.min(100, (paid/credit.months)*100);
    var dLeft = nextDate ? daysUntil(nextDate) : null;
    var dueColor = dLeft===null ? "var(--muted)" : dLeft<=3 ? "var(--coral)" : dLeft<=7 ? "var(--amber)" : "var(--muted)";
    var html = '<div class="card">';

      html += '<div style="color:'+dueColor+';font-size:11px;margin-top:4px;">Próxima cuota: '+fmt(nextRow.total)+' · '+dateLabel(nextDate)+

    html += '<div style="display:flex;gap:2px;">'+

  function renderCard(item){
    var msiOwed = cardMsiTotal(item);
    var deferredOwed = cardDeferredTotal(item);
    var usedTotal = Math.max(0, item.balance + msiOwed + deferredOwed - (item.extraCredit||0));
    var pct = item.limit>0 ? Math.min(100, (usedTotal/item.limit)*100) : 0;
    var barColor = pct>90 ? "var(--coral)" : pct>70 ? "var(--amber)" : "var(--mint)";
    var available = item.limit>0 ? Math.max(0, item.limit-usedTotal) : null;
    var due = nextDueDate(item.dueDay);
    var dLeft = due ? daysUntil(due) : null;
    var dueColor = dLeft===null ? "var(--muted)" : dLeft<=3 ? "var(--coral)" : dLeft<=7 ? "var(--amber)" : "var(--muted)";
    var dueLabel = dLeft===null ? null : (dLeft===0?"Pago hoy":"Pago en "+dLeft+" día"+(dLeft===1?"":"s"));
    var payments = item.payments || [];
    var lastPayment = payments.length ? payments[payments.length-1] : null;
    var open = ui.openCard === item.id;

    var html = '<div class="card" data-card="'+item.id+'">';
    html += '<div class="card-top">';
    html += '<button class="card-main" data-act="toggle-card" data-id="'+item.id+'">';
    var grad = gradientForCard(item.name);
    html += '<div style="background:linear-gradient(135deg,'+grad[0]+','+grad[1]+');border-radius:16px;padding:14px 16px;margin-bottom:2px;position:relative;overflow:hidden;">';
    html += '<div style="position:absolute;top:14px;right:16px;width:26px;height:19px;border-radius:5px;background:rgba(255,255,255,.28);"></div>';
    html += '<div class="name" style="color:#fff;">'+esc(item.name)+'</div>';
    html += '<div class="amount-line"><span class="amount-main" style="color:#fff;">'+fmt(item.balance)+'</span><span class="amount-sub" style="color:rgba(255,255,255,.65);">/ '+fmt(item.limit)+'</span>';
    if(msiOwed>0) html += '<span class="amount-msi" style="color:#FFD866;">+ '+fmt(msiOwed)+' MSI</span>';
    if(deferredOwed>0) html += '<span style="color:#FF8A80;font-family:var(--mono);font-size:12px;">+ '+fmt(deferredOwed)+' diferido</span>';
    html += '</div>';
    if(available!==null) html += '<div style="color:rgba(255,255,255,.65);font-family:var(--mono);font-size:11px;margin-top:2px;">Disponible: '+fmt(available)+' · '+Math.round(pct)+'% usado</div>';
    html += '</div>';
    if(dueLabel || item.cutoffDay || lastPayment){
      html += '<div class="badges">';
      if(dueLabel) html += '<span class="badge" style="color:'+dueColor+';border-color:'+dueColor+'">⏰ '+dueLabel+'</span>';
      if(item.cutoffDay) html += '<span class="badge-muted">Corte: día '+item.cutoffDay+'</span>';
      if(lastPayment) html += '<span class="badge-muted">Último pago: '+fmt(lastPayment.amount)+' · '+dateLabel(lastPayment.date)+'</span>';
      if(item.extraCredit > 0) html += '<span class="badge-muted" style="color:var(--mint);">Crédito a favor: '+fmt(item.extraCredit)+'</span>';
      html += '</div>';
    }
    var dueInfo = cardAmountDueNow(item);
    var msiDue = msiDueThisPeriod(item, due);
    var defDue = deferredDueThisPeriod(item, due);
    var futureCycleTotal = dueInfo.futureCycleTotal;
    var amountDueNow = dueInfo.amountDueNow;
    if(due && dueInfo.amount>0){
      var dueTotal = dueInfo.amount;
      html += '<div style="background:var(--surface3);border-left:3px solid '+dueColor+';border-radius:10px;padding:8px 10px;margin-top:8px;">'+
        '<div style="color:var(--text);font-size:12px;">Según los movimientos registrados, deberías cubrir aproximadamente <span style="font-family:var(--mono);color:'+dueColor+'">'+fmt(dueTotal)+'</span> antes del '+dateLabel(due)+'</div>'+
        '<div style="color:var(--muted);font-size:10px;margin-top:2px;">Consulta tu estado de cuenta para confirmar el pago para no generar intereses — la app no conoce el saldo oficial del banco.</div>'+
        (msiDue>0 ? '<div style="color:var(--amber);font-size:11px;margin-top:2px;">incluye '+fmt(msiDue)+' de cuotas MSI</div>' : '')+
        (defDue>0 ? '<div style="color:var(--coral);font-size:11px;margin-top:2px;">incluye '+fmt(defDue)+' de pagos diferidos (con interés + IVA)</div>' : '')+
        (dueInfo.credit>0 ? '<div style="color:var(--mint);font-size:11px;margin-top:2px;">se restó '+fmt(dueInfo.credit)+' de crédito a favor</div>' : '')+
        (futureCycleTotal>0 ? '<div style="color:var(--muted);font-size:11px;margin-top:2px;">'+fmt(futureCycleTotal)+' en compras recientes no entran aquí — se facturan en el próximo corte</div>' : '')+
        '<div style="color:var(--muted);font-size:11px;margin-top:2px;">'+(dLeft===0?"vence hoy":"faltan "+dLeft+" día"+(dLeft===1?"":"s"))+' desde el corte del día '+item.cutoffDay+'</div>'+
        '</div>';
    }
    html += '</button>';
    html += '<div style="display:flex;gap:2px;">';
    html += '<button class="icon-btn" data-act="edit-card" data-id="'+item.id+'">✎</button>';
    html += '<button class="icon-btn" data-act="delete-card" data-id="'+item.id+'">🗑</button>';
    html += '</div></div>';
    html += '<div class="bar"><div class="bar-fill" style="width:'+pct+'%;background:'+barColor+'"></div></div>';

    if(open){
      html += renderChips(item.id, "card");
      html += renderExpensesSection(item);
      html += renderPaymentsSection(item, payments);
      html += renderMsiSection(item);
      html += renderDeferredSection(item);
    }
    html += '</div>';
    return html;
  }

  function renderExpensesSection(item){
    var schedule = paymentSchedule(item);
    var expenses = item.expenses || [];
    var scanning = ui.scanningCard === item.id;
    var html = '<div class="subsection"><div class="subsection-head"><span class="subsection-label">Gastos</span>';
    html += '<div style="display:flex;align-items:center;gap:10px;">';
    html += '<input type="file" accept="image/*" capture="environment" id="receipt-input-'+item.id+'" style="display:none;" />';
    html += '<button class="mini-add" style="color:var(--amber);" data-act="scan-receipt" data-id="'+item.id+'" '+(scanning?"disabled":"")+'>📷 '+(scanning?"leyendo…":"escanear recibo")+'</button>';
    if(ui.expenseForm !== item.id){
      html += '<button class="mini-add" data-act="show-expense-form" data-id="'+item.id+'">+ registrar gasto</button>';
    }
    html += '</div></div>';

    if(ui.expenseForm === item.id && ui.scanError){
      html += '<div style="color:var(--coral);font-size:11px;margin-bottom:8px;">'+esc(ui.scanError)+'</div>';
    }

    if(!item.cutoffDay || !item.dueDay){
      html += '<div class="empty" style="margin-bottom:8px;">Agrega el día de corte y de pago en "editar" para que te diga cuándo pagar cada gasto.</div>';
    }

    var now = new Date();
    var prevMonthDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
    var thisTotal = monthTotal(expenses, now.getFullYear(), now.getMonth());
    var prevTotal = monthTotal(expenses, prevMonthDate.getFullYear(), prevMonthDate.getMonth());
    if(thisTotal>0 || prevTotal>0){
      var diff = thisTotal-prevTotal;
      var pctChange = prevTotal>0 ? Math.round((diff/prevTotal)*100) : null;
      html += '<div style="background:var(--surface3);border-radius:10px;padding:8px 10px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;">'+
        '<span style="color:var(--muted);font-size:11px;">Este mes: <span style="color:var(--text);font-family:var(--mono);">'+fmt(thisTotal)+'</span> · mes anterior: '+fmt(prevTotal)+'</span>'+
        (pctChange!==null ? '<span style="color:'+(diff>0?"var(--coral)":"var(--mint)")+';font-size:11px;white-space:nowrap;">'+(diff>0?"▲":diff<0?"▼":"—")+' '+Math.abs(pctChange)+'%</span>' : '')+
        '</div>';
    }

    schedule.cycles.forEach(function(g){
      var dl = daysUntil(g.pago);
      var color = dl<=3 ? "var(--coral)" : dl<=10 ? "var(--amber)" : "var(--mint)";
      html += '<div class="mini-card"><div class="mini-row">'+
        '<span style="font-size:12px;">Corte '+dateLabel(g.corte)+' · '+g.count+' gasto'+(g.count===1?"":"s")+'</span>'+
        '<span style="font-family:var(--mono);font-size:12px;">'+fmt(g.total)+'</span></div>'+
        '<div style="color:'+color+';font-size:11px;margin-top:4px;">Paga antes del '+dateLabel(g.pago)+' · '+(dl<=0?"vence hoy":"faltan "+dl+" día"+(dl===1?"":"s"))+'</div>'+
        '</div>';
    });
    if(schedule.unassigned.count>0){
      html += '<div class="empty" style="margin-bottom:8px;">'+schedule.unassigned.count+' gasto'+(schedule.unassigned.count===1?"":"s")+' sin ciclo asignado ('+fmt(schedule.unassigned.total)+')</div>';
    }

    if(expenses.length){
      var recent = expenses.slice().reverse().slice(0,5);
      recent.forEach(function(e){
        html += '<div class="swipe-row" data-swipe-id="exp-'+e.id+'">'+
          '<div class="swipe-actions">'+
          '<button style="background:var(--amber);" data-act="edit-expense" data-card="'+item.id+'" data-exp="'+e.id+'">✎</button>'+
          '<button style="background:var(--coral);" data-act="delete-expense" data-card="'+item.id+'" data-exp="'+e.id+'">✕</button>'+
          '</div>'+
          '<div class="swipe-content mini-row" style="padding:2px 0;">'+

  function renderSaving(item){
    var pct = item.goal>0 ? Math.min(100, (item.current/item.goal)*100) : 0;
    var open = ui.openSaving === item.id;
    var remaining = Math.max(0, item.goal-item.current);
    var suggestion = "";
    if(item.targetDate && remaining>0){
      var today = new Date(); today.setHours(0,0,0,0);
      var target = new Date(item.targetDate); target.setHours(0,0,0,0);
      var overdue = target < today;
      var monthsLeft = Math.max(0, (target.getFullYear()-today.getFullYear())*12 + (target.getMonth()-today.getMonth()) + (target.getDate()>=today.getDate()?0:-1) + 1);
      var monthlyNeeded = overdue ? remaining : remaining/Math.max(1, monthsLeft);
      var tLabel = target.toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"});
      if(overdue){
        suggestion = '<div style="color:var(--coral);font-size:11px;margin-top:6px;">Meta vencida el '+dateLabel(target)+' · te faltan '+fmt(remaining)+'</div>';
      }else if(item.monthlyContribution && item.monthlyContribution>0){
        var monthsAtCurrentRate = Math.ceil(remaining/item.monthlyContribution);
        if(monthsAtCurrentRate > monthsLeft){
          var estCompletion = new Date(today.getFullYear(), today.getMonth()+monthsAtCurrentRate, today.getDate());
          var monthsLate = monthsAtCurrentRate - monthsLeft;
          suggestion = '<div style="color:var(--amber);font-size:11px;margin-top:6px;line-height:1.4;">Con tu aportación actual de '+fmt(item.monthlyContribution)+'/mes, alcanzarías esta meta aproximadamente '+monthsLate+' mes'+(monthsLate===1?"":"es")+' después de la fecha objetivo (≈ '+dateLabel(estCompletion)+'). Necesitarías '+fmt(monthlyNeeded)+'/mes para llegar a tiempo.</div>';
        }else{
          suggestion = '<div style="color:var(--mint);font-size:11px;margin-top:6px;">Vas bien: con '+fmt(item.monthlyContribution)+'/mes llegarías antes del '+tLabel+'. El mínimo para llegar a tiempo es '+fmt(monthlyNeeded)+'/mes.</div>';
        }
      }else{
        suggestion = '<div style="color:var(--mint);font-size:11px;margin-top:6px;">Ahorra '+fmt(monthlyNeeded)+'/mes para llegar el '+tLabel+'</div>';
      }

    var html = '<div class="card"><div class="card-top">';
    html += '<button class="card-main" data-act="toggle-saving" data-id="'+item.id+'">';
    html += '<div class="name">'+esc(item.name);

    html += '<div class="amount-line"><span class="amount-main" style="color:var(--mint)">'+fmt(item.current)+'</span>'+

    html += suggestion;
    html += '</button>';
    html += '<div style="display:flex;gap:2px;">'+
      '<button class="icon-btn" data-act="edit-saving" data-id="'+item.id+'">✎</button>'+
      '<button class="icon-btn" data-act="delete-saving" data-id="'+item.id+'">🗑</button>'+
      '</div></div>';
    html += '<div class="bar"><div class="bar-fill" style="width:'+pct+'%;background:var(--mint)"></div></div>';
    if(open) html += renderChips(item.id, "saving");
    html += '</div>';
    return html;
  }
