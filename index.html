<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Control financiero</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Control" />
<style>
  /* ====================================================================
     Sistema de diseño — inspirado en Apple Wallet / Apple Card
     Paleta: negro verdadero de fondo, materiales de vidrio esmerilado
     (blur + transparencia) para cada superficie, tipografía nativa del
     sistema (SF Pro en Apple, equivalentes en otras plataformas), colores
     semánticos de iOS (verde/rojo/naranja/azul), esquinas muy redondeadas
     y sombras suaves en vez de bordes duros.
     Las tarjetas de crédito son el elemento distintivo: cada una se
     dibuja como una tarjeta física con degradado único (generado a
     partir de su nombre), como en Apple Wallet — el resto de la app usa
     paneles de vidrio neutros para no competir con ese protagonismo.
     ==================================================================== */
  :root{
    --bg:#000000; --surface:rgba(30,30,32,.68); --surface2:rgba(255,255,255,.07); --surface3:rgba(255,255,255,.055);
    --text:#F5F5F7; --muted:#98989D; --mint:#32D74B; --coral:#FF453A; --amber:#FF9F0A; --blue:#0A84FF;
    --hairline:rgba(255,255,255,.09);
    --modal-bg:rgba(38,38,40,.86);
    --disp:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,'SF Mono','Menlo','Cascadia Code',monospace;
  }
  /* Tema claro: misma estructura, colores estilo iOS en modo claro (fondo blanco
     verdadero en vez de negro verdadero, superficies grises muy sutiles en vez de
     vidrio oscuro, y los mismos colores semánticos pero en su variante clara). Las
     caras de las tarjetas de crédito NO cambian con el tema — igual que en una
     wallet física, cada tarjeta ya tiene su propio color fijo. */
  :root[data-theme="light"]{
    --bg:#FFFFFF; --surface:rgba(255,255,255,.72); --surface2:rgba(0,0,0,.045); --surface3:rgba(0,0,0,.035);
    --text:#1C1C1E; --muted:#6E6E73; --mint:#34C759; --coral:#FF3B30; --amber:#FF9500; --blue:#007AFF;
    --hairline:rgba(0,0,0,.1);
    --modal-bg:rgba(255,255,255,.88);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:3px;}
  h1,h2{letter-spacing:-0.01em;}
  .wrap{max-width:480px;margin:0 auto;padding:32px 16px 100px;}
  .eyebrow{color:var(--blue);font-size:11px;text-transform:uppercase;letter-spacing:.14em;margin-bottom:4px;font-weight:600;}
  h1{font-family:var(--disp);font-size:26px;font-weight:700;letter-spacing:-0.02em;margin:0 0 24px;}
  .stats{display:flex;gap:8px;margin-bottom:32px;}
  .stat{flex:1;min-width:0;background:var(--surface);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--hairline);border-radius:18px;padding:14px 12px;box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .stat .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stat .val{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .alerts{background:rgba(255,69,58,.12);border:1px solid rgba(255,69,58,.25);border-left:3px solid var(--coral);border-radius:16px;padding:12px 16px;margin-bottom:24px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
  .alerts .title{color:var(--coral);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .alerts .row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:14px;background:none;border:none;color:inherit;font-family:inherit;text-align:left;width:100%;cursor:pointer;}
  .alerts .row .amt{font-family:var(--mono);font-size:12px;white-space:nowrap;}
  section{margin-bottom:32px;}
  .sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .sec-title{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:-0.01em;}
  .add-btn{color:var(--blue);font-size:13px;font-weight:600;background:none;border:none;display:flex;align-items:center;gap:4px;padding:4px;font-family:var(--body);}
  .empty{color:var(--muted);font-size:12px;padding:2px 4px;}
  .card{background:var(--surface);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--hairline);border-radius:20px;padding:16px;margin-bottom:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);}
  button{transition:opacity .15s ease, background-color .15s ease, transform .1s ease;font-family:var(--body);}
  button:active{transform:scale(.97);}
  button:focus-visible, input:focus-visible, a:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  .card-top{display:flex;justify-content:space-between;gap:10px;}
  .card-main{flex:1;text-align:left;background:none;border:none;color:inherit;padding:0;font-family:inherit;cursor:pointer;}
  .name{font-family:var(--disp);font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;letter-spacing:-0.01em;}
  .tag{background:var(--surface3);color:var(--muted);font-size:10px;padding:2px 7px;border-radius:20px;}
  .amount-line{display:flex;align-items:baseline;gap:8px;margin-top:4px;flex-wrap:wrap;}
  .amount-main{font-family:var(--mono);font-size:19px;font-weight:600;}
  .amount-sub{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .amount-msi{font-family:var(--mono);font-size:12px;color:var(--amber);}
  .badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .badge{font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid;display:flex;align-items:center;gap:4px;}
  .badge-muted{color:var(--muted);font-size:11px;}
  .icon-btn{background:none;border:none;color:var(--muted);padding:6px;cursor:pointer;}
  .bar{background:var(--surface3);height:6px;border-radius:6px;margin-top:12px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;transition:width .2s;}
  .chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:12px;}
  .chip{background:var(--surface2);border:1px solid var(--hairline);font-family:var(--mono);font-size:12px;padding:6px 10px;border-radius:20px;cursor:pointer;}
  .chip.neg{color:var(--coral);}
  .chip.pos{color:var(--mint);}
  .chip-custom{display:flex;align-items:center;gap:4px;margin-left:auto;}
  .chip-custom input{width:64px;background:var(--surface3);color:var(--text);font-family:var(--mono);font-size:12px;padding:6px 8px;border-radius:8px;border:1px solid var(--hairline);outline:none;}
  .subsection{margin-top:12px;padding-top:12px;border-top:1px solid var(--hairline);}
  .subsection-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .subsection-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
  .mini-add{color:var(--blue);font-size:11px;background:none;border:none;display:flex;align-items:center;gap:4px;font-weight:600;}
  .mini-card{background:var(--surface3);border:1px solid var(--hairline);border-radius:14px;padding:10px;margin-bottom:8px;}
  .mini-row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .swipe-row{position:relative;overflow:hidden;border-radius:12px;margin-bottom:6px;touch-action:pan-y;}
  .swipe-actions{position:absolute;top:0;right:0;bottom:0;display:flex;}
  .swipe-actions button{width:52px;border:none;color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;}
  .swipe-content{position:relative;background:var(--surface);will-change:transform;}
  .mini-desc{font-size:12px;}
  .mini-sub{color:var(--muted);font-family:var(--mono);font-size:11px;margin-top:2px;}
  .mini-actions{display:flex;align-items:center;gap:6px;}
  .mark-btn{background:var(--surface2);color:var(--blue);font-size:10px;padding:4px 8px;border-radius:20px;border:1px solid var(--hairline);white-space:nowrap;font-weight:600;}
  .pay-date{color:var(--muted);font-size:11px;}
  .pay-amt{color:var(--mint);font-family:var(--mono);font-size:12px;font-weight:600;}
  .form-box{background:var(--surface3);border:1px solid var(--hairline);border-radius:14px;padding:10px;margin-top:8px;}
  .form-row{display:flex;gap:8px;margin-bottom:8px;}
  .form-box input{width:100%;background:var(--surface2);color:var(--text);font-size:12px;padding:8px 10px;border-radius:10px;border:1px solid var(--hairline);outline:none;font-family:inherit;}
  .form-box input:focus{border-color:var(--blue);}
  .form-actions{display:flex;gap:8px;}
  .btn-cancel{flex:1;background:none;border:none;color:var(--muted);font-size:13px;padding:6px;font-weight:500;}
  .btn-save{flex:1;background:var(--blue);color:#fff;border:none;border-radius:12px;font-size:13px;padding:9px;font-weight:600;}
  .btn-save:disabled{background:var(--surface2);color:var(--muted);}
  .bank-box{background:var(--surface);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--hairline);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .bank-title{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:12px;}
  .bank-row{margin-bottom:10px;}
  .bank-row-top{display:flex;justify-content:space-between;margin-bottom:4px;font-size:14px;}
  .bank-row-amt{font-family:var(--mono);color:var(--mint);font-weight:600;}
  .chart-box{background:var(--surface);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--hairline);border-radius:20px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .chart-empty{color:var(--muted);font-size:12px;}
  .legend{display:flex;gap:16px;margin-bottom:8px;font-size:11px;}
  .legend span{display:flex;align-items:center;gap:5px;}
  .dot{width:8px;height:8px;border-radius:50%;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px;}
  .modal{background:var(--modal-bg);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border:1px solid var(--hairline);border-radius:24px;padding:20px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-head h3{font-family:var(--disp);font-size:17px;font-weight:600;letter-spacing:-0.01em;margin:0;}
  .modal-head button{background:none;border:none;color:var(--muted);}
  .modal input{width:100%;background:var(--surface3);color:var(--text);font-size:15px;padding:11px 13px;border-radius:12px;border:1px solid var(--hairline);outline:none;margin-bottom:10px;font-family:inherit;}
  .modal input:focus{border-color:var(--blue);}
  .modal-2col{display:flex;gap:10px;}
  .modal-2col > div{flex:1;}
  .field-label{color:var(--muted);font-size:11px;display:block;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
  .modal-save{width:100%;background:var(--blue);color:#fff;border:none;border-radius:14px;padding:12px;font-size:15px;font-weight:600;margin-top:6px;}
  .modal-save:disabled{background:var(--surface2);color:var(--muted);}
  .loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--muted);font-family:var(--mono);font-size:13px;}
  svg text{font-family:var(--mono);}
</style>
</head>

     no queremos que ese cambio se quede esperando el temporizador de 1.5s sin
     subir nunca a la nube — lo empujamos de inmediato en cuanto la página deja
     de estar visible (funciona igual al minimizar la app instalada). */
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState==="hidden" && cloudSyncTimer){
      clearTimeout(cloudSyncTimer);

  /* Evita que los datos financieros de una cuenta se mezclen con los de otra en el mismo
     dispositivo (por ejemplo, una computadora o celular compartido entre dos personas).
     Si la cuenta que inicia sesión no es la misma que dejó los datos guardados localmente
     la última vez, borramos lo local ANTES de conciliar con la nube — así nunca se sube,
     compara, ni mezcla accidentalmente información de la cuenta anterior. */
  function ensureLocalDataBelongsTo(uid){
    var owner = null;
    try{ owner = localStorage.getItem(LOCAL_DATA_OWNER_KEY); }catch(e){}
    if(owner && owner !== uid){
      data = { __v:DATA_VERSION, cards: [], savings: [], history: [], personalCredits: [], categories: DEFAULT_CATEGORIES.slice(), budget: Object.assign({}, DEFAULT_BUDGET), settings: Object.assign({}, DEFAULT_SETTINGS), dismissedSubscriptions:[], confirmedSubscriptions:[], celebratedGoalIds:[] };
      saveData();
      // la clave de API (modo desarrollador) también es de una persona específica —
      // no debe heredarla la siguiente cuenta que use este mismo dispositivo.
      setApiKey("");
      setDevModeEnabled(false);
    }
    try{ localStorage.setItem(LOCAL_DATA_OWNER_KEY, uid); }catch(e){}
  }

  function cloudResolveInitialSync(uid){
    ensureLocalDataBelongsTo(uid);
    cloudDocRef(uid).get().then(function(snap){
      var remote = snap.exists ? (snap.data() && snap.data().payload) : null;
      var remoteUpdatedAt = snap.exists ? (snap.data() && snap.data().updatedAt) : null;
      var remoteMarker = remoteUpdatedAt && remoteUpdatedAt.toMillis ? remoteUpdatedAt.toMillis() : null;
      var lastSynced = getLastSyncedMarker(uid);
      var alreadyReconciled = remoteMarker!=null && lastSynced!=null && String(remoteMarker)===String(lastSynced);

      var localHasContent = data.cards.length || data.savings.length || (data.personalCredits||[]).length;
      var remoteHasContent = remote && ((remote.cards||[]).length || (remote.savings||[]).length || (remote.personalCredits||[]).length);

      if(alreadyReconciled){
        // ya vimos y resolvimos esta versión de la nube antes en este dispositivo — no volver a preguntar
        ui.cloudStatus = "synced";
        render();
      }else if(remote && remoteHasContent && localHasContent){
        // la nube trae una versión que este dispositivo nunca ha visto, y aquí también hay datos: pedimos confirmación
        ui.cloudConflict = { remote: remote, remoteMarker: remoteMarker };
        render();
      }else if(remote && remoteHasContent && !localHasContent){
        cloudApplyRemoteData(remote, remoteMarker);
      }else{
        cloudPushNow();
      }
      cloudStartListening(uid);
    }).catch(function(){
      ui.cloudStatus = "error";
      render();
    });
  }

  /* Borra la cuenta por completo: el documento en Firestore, la cuenta de autenticación,

  function cloudDeleteAccountForever(password){
    if(!fbAuth || !fbAuth.currentUser) return;

      data = { __v:DATA_VERSION, cards: [], savings: [], history: [], personalCredits: [], categories: DEFAULT_CATEGORIES.slice(), budget: Object.assign({}, DEFAULT_BUDGET), settings: Object.assign({}, DEFAULT_SETTINGS), dismissedSubscriptions:[], confirmedSubscriptions:[], celebratedGoalIds:[] };

  function cloudTranslateError(err){

    if(code.indexOf("invalid-email")!==-1) return "Ese correo no parece válido.";
    if(code.indexOf("weak-password")!==-1) return "La contraseña debe tener al menos 6 caracteres.";
    if(code.indexOf("wrong-password")!==-1 || code.indexOf("invalid-credential")!==-1) return "Correo o contraseña incorrectos.";
    if(code.indexOf("user-not-found")!==-1) return "No existe una cuenta con ese correo.";

    if(code.indexOf("too-many-requests")!==-1) return "Demasiados intentos seguidos. Espera unos minutos e inténtalo de nuevo.";
    if(code.indexOf("requires-recent-login")!==-1) return "Por seguridad, cierra sesión y vuelve a entrar antes de hacer esto.";

  function monthlyAggregate(history){
    if(!history || !history.length) return [];
    var byMonth = {};
    history.forEach(function(h){
      var d = new Date(h.date);
      var key = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
      byMonth[key] = {date:d, totalDebt:h.totalDebt, totalSavings:h.totalSavings};
    });
    return Object.keys(byMonth).map(function(k){return byMonth[k];})
      .sort(function(a,b){return a.date-b.date;})
      .map(function(m){
        return {
          label: m.date.toLocaleDateString(tlang()==="en"?"en-US":"es-MX",{month:"short",year:"2-digit"}),
          Deuda: Math.round(m.totalDebt),
          Ahorro: Math.round(m.totalSavings)
        };
      });
  }
  function cardAmountDueNow(card){
    var due = nextDueDate(card.dueDay);
    var credit = card.extraCredit || 0;
    // Deuda total de la tarjeta (saldo + MSI + diferidos pendientes) sin importar si
    // tiene día de pago configurado. Antes, sin día de pago, esta función regresaba
    // "nada pendiente" de inmediato — ocultando tarjetas con MSI/saldo real de las
    // alertas y mandándolas al fondo del orden.
    var totalOwed = Math.max(0, card.balance + cardMsiTotal(card) + cardDeferredTotal(card) - credit);
    if(!due) return {due:null, amount:0, futureCycleTotal:0, amountDueNow:0, totalOwed:totalOwed, needsDueDay: totalOwed>0};
    var schedule = paymentSchedule(card);
    var futureCycleTotal = schedule.cycles.filter(function(g){ return g.pago.getTime() > due.getTime(); }).reduce(function(s,g){ return s+g.total; },0);
    var amountDueNow = Math.max(0, card.balance - futureCycleTotal);
    var msiDue = msiDueThisPeriod(card, due);
    var defDue = deferredDueThisPeriod(card, due);
    var rawTotal = amountDueNow+msiDue+defDue;
    return {due:due, amount: Math.max(0, rawTotal-credit), futureCycleTotal:futureCycleTotal, amountDueNow:amountDueNow, rawTotal:rawTotal, credit:credit, totalOwed:totalOwed, needsDueDay:false};
  }

  function sortCardsByDue(cards){
    return cards.slice().sort(function(a,b){
      var da = cardAmountDueNow(a);
      var db = cardAmountDueNow(b);
      var aPending = da.due && da.amount > 0;
      var bPending = db.due && db.amount > 0;
      // 1) Tarjetas con fecha de pago conocida y algo pendiente: la más próxima primero.
      if(aPending && bPending) return da.due - db.due;
      if(aPending && !bPending) return -1;
      if(!aPending && bPending) return 1;
      // 2) Ninguna tiene fecha de pago pendiente conocida: si alguna tiene deuda real
      // pero le falta configurar el día de corte/pago, no debe perderse al fondo —
      // la ordenamos primero (de mayor a menor deuda) para que salte a la vista.
      if(da.needsDueDay && !db.needsDueDay) return -1;
      if(!da.needsDueDay && db.needsDueDay) return 1;
      if(da.needsDueDay && db.needsDueDay) return db.totalOwed - da.totalOwed;
      return 0;
    });
  }

  function upcomingDuePayments(cards){
    return cards.map(function(c){

      return {card:c, due:r.due, dLeft:daysUntil(r.due)};
    }).filter(function(a){ return a && a.dLeft<=7; })
      .sort(function(a,b){ return a.dLeft-b.dLeft; });
  }
  function upcomingPersonalCreditPayments(credits){

      if(!date) return null;
      return {credit:c, date:date, dLeft:daysUntil(date)};
    }).filter(function(a){ return a && a.dLeft<=7; })
      .sort(function(a,b){ return a.dLeft-b.dLeft; });
  }
  function sortPersonalCreditsByDue(credits){
    return credits.slice().sort(function(a,b){
      var da = personalNextPaymentDate(a);
      var db = personalNextPaymentDate(b);
      if(da && !db) return -1;
      if(!da && db) return 1;
      if(!da && !db) return 0;
      return da - db;
    });

  function upcomingCutoffs(cards){
    return cards.map(function(c){

      return {card:c, cutoff:cutoff, dLeft:daysUntil(cutoff)};

  function monthTotal(expenses, year, month){
    return (expenses||[]).reduce(function(s,e){

      return (d.getFullYear()===year && d.getMonth()===month) ? s+e.amount : s;
    },0);
  }

  var IVA_RATE = 0.16;
  function buildAmortization(principal, months, annualRatePct){
    var i = annualRatePct/100/12;
    var payment = i===0 ? principal/months : (principal*i)/(1-Math.pow(1+i,-months));
    var balance = principal;
    var rows = [];
    for(var m=1; m<=months; m++){
      var interest = balance*i;
      var capital = payment-interest;
      if(m===months || capital>balance) capital = balance;
      var iva = interest*IVA_RATE;
      var total = capital+interest+iva;
      balance = Math.max(0, balance-capital);
      rows.push({month:m, interest:interest, capital:capital, iva:iva, total:total, balanceAfter:balance});
    }
    return rows;
  }
  /* Igual que buildAmortization, pero respeta ajustes manuales por mes (cuando el
     banco recalculó una cuota y el monto real ya no coincide con la tabla teórica).
     A partir del mes ajustado, el resto de la tabla se recalcula usando el saldo
     que quedó después de ese ajuste — así los meses siguientes no arrastran un
     número equivocado. */
  function buildAmortizationAdjusted(principal, months, annualRatePct, overrides){
    if(!overrides || !Object.keys(overrides).length) return buildAmortization(principal, months, annualRatePct);
    var i = annualRatePct/100/12;
    var payment = i===0 ? principal/months : (principal*i)/(1-Math.pow(1+i,-months));
    var balance = principal;
    var rows = [];
    for(var m=1; m<=months; m++){
      var ov = overrides[m];
      var interest, capital, iva, total;
      if(ov && ov.total>0){
        interest = balance*i;
        iva = interest*IVA_RATE;
        capital = Math.max(0, ov.total-interest-iva);
        if(capital>balance) capital = balance;
        total = ov.total;
      }else{
        interest = balance*i;
        capital = payment-interest;
        if(m===months || capital>balance) capital = balance;
        iva = interest*IVA_RATE;
        total = capital+interest+iva;
      }
      balance = Math.max(0, balance-capital);
      rows.push({month:m, interest:interest, capital:capital, iva:iva, total:total, balanceAfter:balance, adjusted:!!(ov&&ov.total>0)});
    }
    return rows;
  }
  function deferredRemaining(plan, cutoffDay, dueDay){
    var paid = msiEffectivePaid(plan, cutoffDay, dueDay);
    var rows = buildAmortizationAdjusted(plan.principal, plan.months, plan.annualRate, plan.overrides);
    return paid<=0 ? plan.principal : rows[Math.min(paid,plan.months)-1].balanceAfter;
  }
  function deferredNextPayment(plan, cutoffDay, dueDay){
    var paid = msiEffectivePaid(plan, cutoffDay, dueDay);

  function cardDeferredTotal(card){
    return (card.diferidos||[]).reduce(function(s,p){return s+deferredRemaining(p,card.cutoffDay,card.dueDay);},0);

  function deferredDueThisPeriod(card, due){
    if(!due) return 0;

      // no solo si cae justo en este corte exacto.
      if(!next || next.getTime()>due.getTime()) return s;
      var row = deferredNextPayment(p, card.cutoffDay, card.dueDay);
      return row ? s+row.total : s;
    },0);
  }

  function personalInstallmentDate(credit, k){

  }
  function personalElapsed(credit){
    if(credit.paidMonths != null) return Math.min(credit.months, credit.paidMonths);
    var today = new Date(); today.setHours(0,0,0,0);
    var count = 0;
    for(var k=1; k<=credit.months; k++){
      if(personalInstallmentDate(credit,k) < today) count++;

    }
    return count;
  }
  function personalNextPaymentDate(credit){
    var paid = personalElapsed(credit);

  function personalRemaining(credit){
    var paid = personalElapsed(credit);
    var rows = buildAmortizationAdjusted(credit.principal, credit.months, credit.annualRate, credit.overrides);
    return paid<=0 ? credit.principal : rows[Math.min(paid,credit.months)-1].balanceAfter;
  }
  function personalNextPaymentRow(credit){
    var paid = personalElapsed(credit);

  function totalPersonalCreditsDebt(list){

  var DONUT_COLORS = ["#0A84FF","#FF453A","#FF9F0A","#98989D","#64D2FF","#FF375F","#5E5CE6"];

  /* Asigna siempre el mismo color a la misma categoría (basado en su nombre, no en su
     posición al ordenar por gasto) — así "Comida" se ve igual mes con mes, en vez de
     cambiar de color según qué tanto se gastó ese periodo en particular. */
  function colorForCategory(name){
    var hash = 0;
    for(var i=0;i<name.length;i++){ hash = (hash*31 + name.charCodeAt(i)) & 0xffffffff; }
    var idx = Math.abs(hash) % DONUT_COLORS.length;
    return DONUT_COLORS[idx];
  }

  /* Paleta de degradados estilo Apple Card/Wallet — cada tarjeta guardada obtiene
     siempre el mismo degradado (basado en su nombre), como si fuera su color físico. */
  var CARD_GRADIENTS = [
    ["#3A3A3C","#1C1C1E"],
    ["#0A84FF","#003D80"],
    ["#5E5CE6","#241F6B"],
    ["#32D74B","#0B4318"],
    ["#FF9F0A","#7A3D00"],
    ["#FF453A","#6E0E09"],
    ["#64D2FF","#014A6E"],
    ["#BF5AF2","#3D1259"]
  ];
  function gradientForCard(name, colorOverride){
    // Si la persona eligió un color manualmente al crear/editar la tarjeta, ese
    // siempre gana sobre la detección automática por nombre de banco.
    if(colorOverride!=null && CARD_GRADIENTS[colorOverride]) return CARD_GRADIENTS[colorOverride];
    // Si el nombre de la tarjeta menciona un banco o tienda conocido en México,
    // usamos el color real de esa marca (sin reproducir su logotipo, solo el
    // color) para que se sienta como tu tarjeta física de verdad.
    var lower = (name||"").toLowerCase();
    var knownIssuers = [
      { match:"nu(bank)?", gradient:["#9013D6","#5A0091"] },
      { match:"bbva", gradient:["#1464F4","#072146"] },
      { match:"liverpool", gradient:["#E6007E","#9E0057"] },
      { match:"sears", gradient:["#C9A227","#7A5C0E"] },
      { match:"klar", gradient:["#00B2A9","#00676A"] },
      { match:"hey", gradient:["#1C1C1E","#000000"] },
      { match:"banamex|citibanamex", gradient:["#004B87","#00263F"] },
      { match:"santander", gradient:["#EC0000","#7A0000"] },
      { match:"banorte", gradient:["#D22630","#7A0F14"] },
      { match:"hsbc", gradient:["#DB0011","#7A0009"] },
      { match:"scotiabank|scotia", gradient:["#EC111A","#7A0A0E"] },
      { match:"invex", gradient:["#8C1D40","#4A0F22"] },
      { match:"amex|american express", gradient:["#016FD0","#003D75"] }
    ];
    for(var i=0;i<knownIssuers.length;i++){
      var re = new RegExp("\\b("+knownIssuers[i].match+")\\b", "i");
      if(re.test(lower)) return knownIssuers[i].gradient;
    }
    var hash = 0;
    for(var k=0;k<name.length;k++){ hash = (hash*31 + name.charCodeAt(k)) & 0xffffffff; }
    return CARD_GRADIENTS[Math.abs(hash) % CARD_GRADIENTS.length];
  }

  function utilizationLevel(pct){
    if(pct>=70) return {label:t("util_high"), color:"var(--coral)"};
    if(pct>=30) return {label:t("util_attention"), color:"var(--amber)"};
    return {label:t("util_ideal"), color:"var(--mint)"};
  }

  function cardUsedTotal(card){
    return Math.max(0, (card.balance||0) + cardMsiTotal(card) + cardDeferredTotal(card) - (card.extraCredit||0));
  }
  function cardUtilizationPct(card){
    if(!card.limit) return 0;
    return Math.min(100, (cardUsedTotal(card)/card.limit)*100);
  }
  function debtByCard(cards){
    return cards.map(function(c,i){ return {label:c.name, value:cardUsedTotal(c), color:DONUT_COLORS[i%DONUT_COLORS.length]}; })
      .filter(function(d){ return d.value>0.5; })
      .sort(function(a,b){ return b.value-a.value; });
  }
  function paymentPriorityList(dataObj){
    var items = [];
    dataObj.cards.forEach(function(c){
      if(c.revolvingRate && c.balance>0){
        var hasRealMin = c.minPayment && c.minPayment>0;
        var estMin = hasRealMin ? c.minPayment : Math.max(c.balance*0.05, 300);
        items.push({label:c.name+" · saldo", type:"revolving", rate:c.revolvingRate, remaining:c.balance, monthlyPayment:estMin, amortPayment:estMin, isEstimated:!hasRealMin});
      }
      (c.diferidos||[]).forEach(function(p){
        if(!p.annualRate || p.annualRate<=0) return; // 0% de interés: igual que MSI, no aplica a este plan
        var rem = deferredRemaining(p, c.cutoffDay, c.dueDay);
        if(rem>0.5){
          var paidD = msiEffectivePaid(p, c.cutoffDay, c.dueDay);
          var rowsD = buildAmortizationAdjusted(p.principal, p.months, p.annualRate, p.overrides);
          var rowD = rowsD.length ? rowsD[Math.min(paidD, p.months-1)] : null;
          items.push({label:c.name+" · "+p.description, type:"diferido", rate:p.annualRate, remaining:rem,
            monthlyPayment: rowD ? rowD.total : 0, amortPayment: rowD ? (rowD.capital+rowD.interest) : 0, isEstimated:false});
        }
      });
    });
    (dataObj.personalCredits||[]).forEach(function(c){
      if(!c.annualRate || c.annualRate<=0) return; // 0% de interés: no aplica a un plan de optimización de intereses
      var rem = personalRemaining(c);
      if(rem>0.5){
        var paidP = personalElapsed(c);
        var rowsP = buildAmortization(c.principal, c.months, c.annualRate);
        var rowP = rowsP.length ? rowsP[Math.min(paidP, c.months-1)] : null;
        items.push({label:c.description, type:"personalCredit", rate:c.annualRate, remaining:rem,
          monthlyPayment: rowP ? rowP.total : 0, amortPayment: rowP ? (rowP.capital+rowP.interest) : 0, isEstimated:false});
      }
    });
    return items.sort(function(a,b){ return b.rate-a.rate; });
  }
  function detectSubscriptions(cards, dismissed){
    dismissed = dismissed || [];
    var all = [];
    cards.forEach(function(c){ (c.expenses||[]).forEach(function(e){ all.push(Object.assign({}, e, {card:c.name})); }); });
    var groups = {};
    all.forEach(function(e){
      var key = e.description.trim().toLowerCase();
      if(!key) return;
      if(!groups[key]) groups[key] = [];
      groups[key].push(e);
    });
    var subs = [];
    Object.keys(groups).forEach(function(key){
      if(dismissed.indexOf(key)!==-1) return;
      var list = groups[key];
      if(list.length<2) return;
      var months = {};
      list.forEach(function(e){ var d=new Date(e.date); months[d.getFullYear()+"-"+d.getMonth()]=true; });
      var distinctMonths = Object.keys(months).length;
      if(distinctMonths<2) return;
      var amounts = list.map(function(e){ return e.amount; });
      var avg = amounts.reduce(function(s,a){return s+a;},0)/amounts.length;
      var consistent = amounts.every(function(a){ return Math.abs(a-avg)/avg < 0.15; });
      if(!consistent) return;
      // frecuencia aproximada: promedio de días entre cargos consecutivos ordenados por fecha
      var sortedDates = list.map(function(e){ return new Date(e.date).getTime(); }).sort(function(a,b){return a-b;});
      var gaps = [];
      for(var i=1;i<sortedDates.length;i++){ gaps.push((sortedDates[i]-sortedDates[i-1])/86400000); }
      var avgGapDays = gaps.length ? gaps.reduce(function(s,g){return s+g;},0)/gaps.length : 30;
      var freqLabel = avgGapDays<=10 ? "semanal" : avgGapDays<=45 ? "mensual" : avgGapDays<=100 ? "trimestral" : "anual";
      var monthlyEquivalent = avgGapDays<=10 ? avg*4.33 : avgGapDays<=45 ? avg : avgGapDays<=100 ? avg/3 : avg/12;
      subs.push({key:key, description:list[0].description, card:list[0].card, avgAmount:avg, count:list.length, freqLabel:freqLabel, monthlyEquivalent:monthlyEquivalent});
    });
    return subs.sort(function(a,b){ return b.monthlyEquivalent-a.monthlyEquivalent; });
  }
  function searchMovements(cards, query){
    var q = query.trim().toLowerCase();
    if(q.length<2) return [];
    var results = [];
    cards.forEach(function(c){
      (c.expenses||[]).forEach(function(e){
        if(e.description.toLowerCase().indexOf(q)!==-1){
          results.push({id:e.id, description:e.description, amount:e.amount, date:e.date, card:c.name});
        }
      });
    });
    return results.sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
  }

  function filterMovements(cards, opts){
    opts = opts || {};
    var q = (opts.query||"").trim().toLowerCase();
    var results = [];
    cards.forEach(function(c){
      if(opts.cardId && c.id!==opts.cardId) return;
      (c.expenses||[]).forEach(function(e){
        if(q && e.description.toLowerCase().indexOf(q)===-1) return;
        if(opts.category && (e.category||"Otros")!==opts.category) return;
        if(opts.month && new Date(e.date).toISOString().slice(0,7)!==opts.month) return;
        results.push({id:e.id, description:e.description, amount:e.amount, date:e.date, category:e.category||"Otros", cardId:c.id, cardName:c.name});
      });
    });
    return results.sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
  }
  /* Meses distintos (AAAA-MM) en los que hay al menos un gasto registrado, sin
     importar los demás filtros — para llenar el selector de periodo. Más reciente
     primero. */
  function movementMonths(cards){
    var set = {};
    cards.forEach(function(c){
      (c.expenses||[]).forEach(function(e){ set[new Date(e.date).toISOString().slice(0,7)] = true; });
    });
    return Object.keys(set).sort().reverse();

  function monthLabel(ym){

    var label = d.toLocaleDateString(tlang()==="en"?"en-US":"es-MX",{month:"long",year:"numeric"});
    return label.charAt(0).toUpperCase()+label.slice(1);
  }

  /* ---------- salud financiera ---------- */
  function computeHealthScore(dataObj, totalDebt, totalSavings){
    var reasons = [];
    var factorDetails = [];
    var score = 100;
    var factorsEvaluated = 0;
    var factorsSkipped = [];

    // 1) Utilización promedio de tarjetas (peso alto) — solo penaliza por arriba de 30%,
    // que es el mismo umbral "Ideal" que usa el resto de la app (utilizationLevel()).
    // Antes penalizaba desde 0% de forma silenciosa (sin mostrar el motivo salvo arriba
    // de 70%), lo cual bajaba el score aunque tu utilización fuera "Ideal" y sin explicación.
    var cardsWithLimit = dataObj.cards.filter(function(c){ return c.limit>0; });
    var avgUtil = 0;
    if(cardsWithLimit.length){
      factorsEvaluated++;
      avgUtil = cardsWithLimit.reduce(function(s,c){ return s+cardUtilizationPct(c); },0)/cardsWithLimit.length;
      var utilPenalty = avgUtil>30 ? Math.round(Math.min(30, ((avgUtil-30)/70)*30)) : 0;
      score -= utilPenalty;
      if(utilPenalty>0) reasons.push({text:t("hs_util_reason",{pct:Math.round(avgUtil)}), weight:utilPenalty});
      var utilLvl = utilizationLevel(avgUtil);
      factorDetails.push({label:t("hsf_util_label"), evaluated:true, rating:utilLvl.label, color:utilLvl.color, detail:t("hsf_util_detail",{pct:Math.round(avgUtil)})});
    }else{
      factorDetails.push({label:t("hsf_util_label"), evaluated:false, detail:t("hsf_util_na")});
    }

    // 2) Capacidad de ahorro (ingresos vs gasto) — SOLO si el usuario configuró su sueldo real en Presupuesto.
    // Nunca usamos el valor de referencia ($6,800) que trae la app por defecto: eso produciría un score falso.
    // Si gastas más de lo que ganas (déficit activo cada mes), esto tampoco puede calificar como "Bien",
    // por la misma razón que la deuda mayor al ahorro no puede: es una señal grave que ningún otro
    // factor saludable debería poder compensar.
    var monthlyDeficit = false;
    if(dataObj.budget && dataObj.budget.configured && (dataObj.budget.salary||0)>0){
      factorsEvaluated++;
      var salaryMonthly = dataObj.budget.salary*4.33;
      var now = new Date();
      var gastoMes = dataObj.cards.reduce(function(s,c){ return s+monthTotal(c.expenses||[], now.getFullYear(), now.getMonth()); },0);
      var capacidad = Math.max(-1, (salaryMonthly-gastoMes)/salaryMonthly);
      monthlyDeficit = capacidad<0;
      var capPenalty = capacidad<0.1 ? Math.round(Math.min(30, (0.1-capacidad)*130)) : 0;
      score -= capPenalty;
      if(monthlyDeficit) reasons.push({text:t("hs_deficit_reason",{amount:fmtMasked(dataObj.budget.salary)}), weight:Math.max(capPenalty,1)});
      else if(capPenalty>0) reasons.push({text:t("hs_low_capacity_reason",{amount:fmtMasked(dataObj.budget.salary)}), weight:capPenalty});
      var capRating, capColor, capDetail;
      if(monthlyDeficit){ capRating=t("hsf_capacity_deficit"); capColor="var(--coral)"; capDetail=t("hsf_capacity_deficit_detail",{pct:Math.round(-capacidad*100)}); }
      else if(capPenalty>0){ capRating=t("hsf_capacity_low"); capColor="var(--amber)"; capDetail=t("hsf_capacity_detail",{pct:Math.round(capacidad*100)}); }
      else{ capRating=t("hsf_capacity_healthy"); capColor="var(--mint)"; capDetail=t("hsf_capacity_detail",{pct:Math.round(capacidad*100)}); }
      factorDetails.push({label:t("hsf_capacity_label"), evaluated:true, rating:capRating, color:capColor, detail:capDetail});
    }else{
      factorsSkipped.push(t("hs_skip_capacity"));
      factorDetails.push({label:t("hsf_capacity_label"), evaluated:false, detail:t("hsf_capacity_na")});
    }

    // 3) Relación deuda / ahorro — si la deuda supera al ahorro, esto por sí solo
    // debe impedir que el resultado diga "Bien": no tiene sentido calificar como
    // buena salud financiera una situación donde se debe más de lo que se tiene ahorrado.
    var debtSavingsPenalty = 0;
    var debtExceedsSavings = totalDebt > totalSavings && totalDebt > 0;
    if(totalDebt>0){
      factorsEvaluated++;
      // Antes, sin nada ahorrado, usábamos una relación fija (deuda/ahorro = 3) sin
      // importar si la deuda era de $500 o de $50,000 — el score se quedaba "atorado"
      // aunque pagaras tu deuda, porque este factor nunca cambiaba. Ahora, sin ahorro,
      // la penalización responde directamente al monto de la deuda (topada en $20,000
      // para el máximo castigo), así que si pagas deuda el score sí se mueve.
      if(totalSavings>0){
        var ratio = totalDebt/totalSavings;
        debtSavingsPenalty = Math.round(Math.min(35, Math.max(0, (ratio-1)*15)));
      }else{
        debtSavingsPenalty = Math.round(Math.min(35, (totalDebt/20000)*35));
      }
      score -= debtSavingsPenalty;
      if(debtExceedsSavings) reasons.push({text:t("hs_debt_gt_savings",{debt:fmtMasked(totalDebt), savings:fmtMasked(totalSavings)}), weight:Math.max(debtSavingsPenalty, 1)});
      factorDetails.push({label:t("hsf_debt_savings_label"), evaluated:true, rating:debtExceedsSavings?t("hsf_debt_gt"):t("hsf_debt_ok"), color:debtExceedsSavings?"var(--coral)":"var(--mint)", detail:t("hsf_debt_savings_detail",{debt:fmtMasked(totalDebt), savings:fmtMasked(totalSavings)})});
    }else{
      factorDetails.push({label:t("hsf_debt_savings_label"), evaluated:true, rating:t("hsf_no_debt"), color:"var(--mint)", detail:t("hsf_no_debt_detail")});
    }

    // 4) Pagos próximos vencidos o urgentes
    var urgentPayments = upcomingDuePayments(dataObj.cards).filter(function(a){ return a.dLeft<=3; }).length +
      upcomingPersonalCreditPayments(dataObj.personalCredits).filter(function(a){ return a.dLeft<=3; }).length;
    if(urgentPayments>0){
      factorsEvaluated++;
      var payPenalty = Math.min(15, urgentPayments*5);
      score -= payPenalty;
      reasons.push({text:t("hs_urgent_payments",{n:urgentPayments}), weight:payPenalty});
    }
    var payRating4 = urgentPayments===0 ? {label:t("hsf_payments_ok"), color:"var(--mint)"} : urgentPayments<=2 ? {label:t("hsf_payments_attention"), color:"var(--amber)"} : {label:t("hsf_payments_urgent"), color:"var(--coral)"};
    factorDetails.push({label:t("hsf_payments_label"), evaluated:true, rating:payRating4.label, color:payRating4.color, detail:t("hsf_payments_detail",{n:urgentPayments})});

    // 5) Progreso de reducción de deuda (usando historial)
    var points = monthlyAggregate(dataObj.history);
    if(points.length>=2){
      factorsEvaluated++;
      var prevDebt = points[points.length-2].Deuda;
      var lastDebt = points[points.length-1].Deuda;
      if(prevDebt>0 && lastDebt>prevDebt){
        var growthPenalty = 10;
        score -= growthPenalty;
        reasons.push({text:t("hs_debt_grew"), weight:growthPenalty});
      }
      var grew = prevDebt>0 && lastDebt>prevDebt;
      factorDetails.push({label:t("hsf_debt_trend_label"), evaluated:true, rating:grew?t("hsf_debt_grew"):t("hsf_debt_flat"), color:grew?"var(--coral)":"var(--mint)", detail:t("hsf_debt_trend_detail",{prev:fmtMasked(prevDebt), last:fmtMasked(lastDebt)})});
    }else{
      factorDetails.push({label:t("hsf_debt_trend_label"), evaluated:false, detail:t("hsf_debt_trend_na")});
    }

    score = Math.max(0, Math.min(100, Math.round(score)));
    // Garantía dura: si la deuda supera al ahorro, o si hay un déficit mensual activo
    // (gastas más de lo que ganas), el score nunca puede caer en el rango de "Bien" (70+),
    // sin importar qué tan bien salgan los demás factores.
    if((debtExceedsSavings || monthlyDeficit) && score>=70) score = 69;
    reasons.sort(function(a,b){ return b.weight-a.weight; });
    var level = score>=70 ? {label:t("hs_level_good"), color:"var(--mint)", icon:"🟢"} : score>=40 ? {label:t("hs_level_attention"), color:"var(--amber)", icon:"🟡"} : {label:t("hs_level_critical"), color:"var(--coral)", icon:"🔴"};
    return {
      score:score, level:level,
      mainReason: reasons.length ? reasons[0].text : t("hs_no_red_flags"),
      reasons:reasons, factorsEvaluated:factorsEvaluated, factorsSkipped:factorsSkipped, factorDetails:factorDetails
    };
  }

  /* ---------- análisis por categoría ---------- */
  function categoryBreakdown(cards, year, month){
    var byCat = {};
    var total = 0;
    cards.forEach(function(c){
      (c.expenses||[]).forEach(function(e){
        var d = new Date(e.date);
        if(d.getFullYear()!==year || d.getMonth()!==month) return;
        var cat = e.category || "Otros";
        byCat[cat] = (byCat[cat]||0)+e.amount;
        total += e.amount;
      });
    });
    return { total:total, byCat: Object.keys(byCat).map(function(k){ return {category:k, amount:byCat[k], pct: total>0?(byCat[k]/total)*100:0}; }).sort(function(a,b){ return b.amount-a.amount; }) };
  }
  function previousMonth(year, month){
    return month===0 ? {year:year-1, month:11} : {year:year, month:month-1};
  }

  /* ---------- plan para salir de deudas ---------- */
  function debtPayoffPlan(dataObj, extraMonthly){
    extraMonthly = extraMonthly || 0;
    var items = paymentPriorityList(dataObj); // ya viene ordenado de mayor a menor tasa (avalancha)
    var totalDebt = items.reduce(function(s,i){ return s+i.remaining; },0);
    if(!items.length) return null;
    var hasEstimated = items.some(function(i){ return i.isEstimated; });
    var totalMonthlyPayment = items.reduce(function(s,i){ return s+(i.monthlyPayment||0); },0);

    function simulate(extra){
      // Cada partida se amortiza con su propio pago real (diferidos/créditos personales usan su
      // mensualidad ya calculada con interés + IVA) o, cuando no hay un pago registrado
      // (saldo revolvente de tarjeta), con un pago mínimo estimado — señalado como tal en la UI.
      // El método avalancha aplica el pago adicional íntegro a la deuda de mayor tasa vigente;
      // al liquidarse, su mensualidad completa se libera y se suma al "pool" disponible para las demás.
      //
      // amortPayment (capital+interés, SIN IVA) es lo que reduce el saldo cada mes — el IVA no
      // amortiza capital, es un impuesto adicional sobre el interés. Pero el costo total que
      // reportamos al usuario ("intereses estimados") SÍ debe incluir el IVA cuando la deuda lo
      // genera (diferidos y créditos personales), igual que se muestra en el detalle de cada
      // tarjeta/crédito — de lo contrario el IVA "desaparecería" del estimado. Las tarjetas
      // revolventes no manejan IVA en ningún otro cálculo de la app, así que no se le agrega aquí.
      var balances = items.map(function(i){ return {type:i.type, rate:i.rate, remaining:i.remaining, amortPayment:i.amortPayment||i.monthlyPayment||0}; });
      var months = 0, totalInterest = 0;
      while(balances.some(function(b){ return b.remaining>0.5; }) && months<600){
        months++;
        var freedUp = 0; // mensualidades de deudas ya liquidadas, redirigidas a la de mayor tasa (bola de nieve del método avalancha)
        for(var k=0;k<balances.length;k++){
          var bk = balances[k];
          if(bk.remaining<=0.5){
            freedUp += bk.amortPayment; // esta deuda ya se liquidó: su pago mensual se redirige a las demás
            continue;
          }
          var monthlyRate = (bk.rate/100)/12;
          var interest = bk.remaining*monthlyRate;
          var interestCost = (bk.type==="diferido" || bk.type==="personalCredit") ? interest*(1+IVA_RATE) : interest;
          totalInterest += interestCost;
          var pay = Math.min(bk.amortPayment+freedUp, bk.remaining+interest);
          freedUp = Math.max(0, (bk.amortPayment+freedUp) - pay);
          bk.remaining = Math.max(0, bk.remaining + interest - pay);
        }
        // pago extra: se aplica completo a la deuda de mayor tasa que siga pendiente (avalancha)
        var availableExtra = extra;
        for(var j=0;j<balances.length;j++){
          if(availableExtra<=0) break;
          var bj = balances[j];
          if(bj.remaining<=0.5) continue;
          var payExtra = Math.min(availableExtra, bj.remaining);
          bj.remaining -= payExtra;
          availableExtra -= payExtra;
        }
      }
      return { months: months, totalInterest: totalInterest };
    }

    var base = simulate(0);
    var withExtra = extraMonthly>0 ? simulate(extraMonthly) : base;
    return {
      items: items,
      totalDebt: totalDebt,
      hasEstimated: hasEstimated,
      totalMonthlyPayment: totalMonthlyPayment,
      currentMonths: base.months,
      currentInterest: base.totalInterest,
      extraMonths: withExtra.months,
      extraInterest: withExtra.totalInterest,
      monthsSaved: Math.max(0, base.months - withExtra.months),
      interestSaved: Math.max(0, base.totalInterest - withExtra.totalInterest)
    };
  }

  function reassignCategory(fromCat, toCat){

  function fileToBase64(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result.split(",")[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /* Las fotos de cámara modernas fácilmente pesan 5-10+ MB, lo cual puede exceder
     límites de tamaño de la API, tardar mucho en conexiones lentas, o gastar tokens
     de más al analizar una resolución innecesariamente alta para leer un recibo.
     Reducimos a un máximo razonable (1600px de lado mayor) antes de enviar —
     de sobra para que la IA lea texto impreso con claridad. */
  /* Construye el bloque de contenido correcto para la API de Anthropic: las imágenes
     usan type:"image" y los PDF usan type:"document" — enviar un PDF como si fuera
     una imagen hace que la API lo rechace o falle en vez de leerlo. */
  function buildAiContentBlock(mediaType, base64){
    if(mediaType==="application/pdf"){
      return { type:"document", source:{ type:"base64", media_type:"application/pdf", data:base64 } };
    }
    return { type:"image", source:{ type:"base64", media_type:mediaType, data:base64 } };
  }

  function prepareReceiptImage(file){
    var MAX_DIMENSION = 1600;
    var JPEG_QUALITY = 0.85;
    return new Promise(function(resolve){
      if(!file.type || file.type.indexOf("image/")!==0){
        fileToBase64(file).then(function(b64){ resolve({base64:b64, mediaType:file.type||"image/jpeg"}); });
        return;
      }
      var img = new Image();
      var objectUrl = URL.createObjectURL(file);
      img.onload = function(){
        URL.revokeObjectURL(objectUrl);
        var w = img.naturalWidth, h = img.naturalHeight;
        if(w<=MAX_DIMENSION && h<=MAX_DIMENSION && file.size < 2*1024*1024){
          // ya es razonablemente pequeña, no vale la pena recomprimir
          fileToBase64(file).then(function(b64){ resolve({base64:b64, mediaType:file.type||"image/jpeg"}); });
          return;
        }
        var scale = Math.min(1, MAX_DIMENSION/Math.max(w,h));
        var canvas = document.createElement("canvas");
        canvas.width = Math.round(w*scale);
        canvas.height = Math.round(h*scale);
        try{
          var ctx = canvas.getContext("2d");
          if(!ctx) throw new Error("sin contexto 2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          var dataUrl = canvas.toDataURL("image/jpeg", JPEG_QUALITY);
          resolve({base64: dataUrl.split(",")[1], mediaType:"image/jpeg"});
        }catch(e){
          // si el navegador no puede procesar el canvas por cualquier razón,
          // mandamos el archivo original tal cual en vez de fallar todo el escaneo
          fileToBase64(file).then(function(b64){ resolve({base64:b64, mediaType:file.type||"image/jpeg"}); });
        }
      };
      img.onerror = function(){
        URL.revokeObjectURL(objectUrl);
        // si algo falla al procesar la imagen, mandamos el archivo original tal cual
        fileToBase64(file).then(function(b64){ resolve({base64:b64, mediaType:file.type||"image/jpeg"}); });
      };
      img.src = objectUrl;
    });
  }

  function buildMovementsCSV(dataObj){
    var body = [];
    dataObj.cards.forEach(function(c){
      (c.expenses||[]).forEach(function(e){ body.push([c.name, "Gasto", e.description, e.category||"Otros", e.amount, e.date]); });
      (c.payments||[]).forEach(function(p){ body.push([c.name, "Pago", "", "", p.amount, p.date]); });
    });
    body.sort(function(a,b){ return new Date(b[5]) - new Date(a[5]); });
    var rows = [["Tarjeta","Tipo","Descripción","Categoría","Monto","Fecha"]].concat(body.map(function(r){
      return [r[0], r[1], r[2], r[3], r[4], new Date(r[5]).toLocaleDateString("es-MX")];
    }));
    return rows.map(function(r){
      return r.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(",");
    }).join("\n");
  }

  function buildFilteredMovementsCSV(results){
    var rows = [["Tarjeta","Descripción","Categoría","Monto","Fecha"]].concat(results.map(function(r){
      return [r.cardName, r.description, r.category||"Otros", r.amount, new Date(r.date).toLocaleDateString("es-MX")];
    }));
    return rows.map(function(r){
      return r.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(",");
    }).join("\n");
  }

  /* ---------- conciliación con estado de cuenta ---------- */
  function reconcileStatement(cardId, file){
    if(!AI_BACKEND_URL && !isDevModeEnabled()){
      ui.devModeModal = true;
      render();
      return;
    }
    if(!AI_BACKEND_URL && !getApiKey()){
      ui.apiKeyModal = true;
      render();
      return;
    }
    ui.reconcileBusy = true;
    ui.reconcileTarget = cardId;
    ui.reconcileError = "";
    render();
    prepareReceiptImage(file).then(function(prepared){
      var base64 = prepared.base64;
      var mediaType = prepared.mediaType;
      var prompt = 'Analiza esta foto de la página de RESUMEN de un estado de cuenta de tarjeta de crédito (normalmente la primera página, con los totales generales). Responde ÚNICAMENTE con un objeto JSON, sin texto adicional ni markdown, con este formato exacto: {"cutoffDate": "YYYY-MM-DD del corte, o null", "statementBalance": saldo_al_corte_como_numero_o_null, "minimumPayment": pago_minimo_como_numero_o_null, "noInterestPayment": pago_para_no_generar_intereses_como_numero_o_null, "dueDate": "YYYY-MM-DD fecha limite de pago, o null"}. Si no puedes leer algún dato con claridad, usa null en ese campo específico.';
      if(AI_BACKEND_URL){
        return fetch(AI_BACKEND_URL, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ image: base64, mediaType: mediaType, prompt: prompt })
        }).then(function(res){ return res.json(); }).then(function(json){
          return { fromBackend:true, data: json };
        });
      }
      var apiKey = getApiKey();
      return fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {

  function computePaymentEffect(card, amount, due, rawTotal){
    var balanceApplied = Math.min(amount, card.balance);
    var leftover = +(amount - balanceApplied).toFixed(2);
    var existingCredit = card.extraCredit || 0;
    var msi = card.msi || [];
    var diferidos = card.diferidos || [];
    var adjustments = []; // para poder revertir exactamente si se edita/borra el pago
    var coversEverything = due && rawTotal > 0 && (amount + existingCredit) >= rawTotal - 0.01;
    var extraCredit;
    if(coversEverything){
      msi = msi.map(function(p){
        var next = msiNextPago(p, card.cutoffDay, card.dueDay);
        if(next && next.getTime()<=due.getTime()){
          var paid = msiEffectivePaid(p, card.cutoffDay, card.dueDay);
          var newPaid = Math.min(p.months, paid+1);
          adjustments.push({kind:"msi", planId:p.id, from:p.paidMonths, to:newPaid});
          return Object.assign({}, p, {paidMonths: newPaid});
        }
        return p;
      });
      diferidos = diferidos.map(function(p){
        var next = msiNextPago(p, card.cutoffDay, card.dueDay);
        if(next && next.getTime()<=due.getTime()){
          var paid2 = msiEffectivePaid(p, card.cutoffDay, card.dueDay);
          var newPaid2 = Math.min(p.months, paid2+1);
          adjustments.push({kind:"diferido", planId:p.id, from:p.paidMonths, to:newPaid2});
          return Object.assign({}, p, {paidMonths: newPaid2});
        }
        return p;
      });
      var nonBalancePortion = Math.max(0, rawTotal - balanceApplied);
      extraCredit = Math.max(0, existingCredit + leftover - nonBalancePortion);
    }else{
      // No sabemos (o el pago no alcanza para) cubrir exactamente "este corte" con
      // precisión de fecha. Antes, en este caso, CUALQUIER excedente sobre el saldo
      // se guardaba automáticamente como "crédito a favor" — lo cual generaba
      // créditos fantasma cuando en realidad ese excedente correspondía a una cuota
      // de MSI o diferido que la persona sí pagó (típicamente porque la tarjeta aún
      // no tenía día de corte/pago configurado). En vez de eso, ese excedente se va
      // abonando a las cuotas MÁS PRÓXIMAS de cada plan pendiente, una por una,
      // mientras alcance para cubrirlas completas — y solo lo que sobre después de
      // eso se guarda como crédito real.
      msi = msi.map(function(p){
        var paidCount = msiEffectivePaid(p, card.cutoffDay, card.dueDay);
        var monthly = msiMonthly(p);
        var startPaid = paidCount;
        while(paidCount < p.months && monthly>0 && leftover >= monthly - 0.01){
          leftover = +(leftover - monthly).toFixed(2);
          paidCount++;
        }
        if(paidCount===startPaid) return p;
        adjustments.push({kind:"msi", planId:p.id, from:p.paidMonths, to:paidCount});
        return Object.assign({}, p, {paidMonths: paidCount});
      });
      diferidos = diferidos.map(function(p){
        var paidCount2 = msiEffectivePaid(p, card.cutoffDay, card.dueDay);
        var startPaid2 = paidCount2;
        while(paidCount2 < p.months){
          var row = buildAmortizationAdjusted(p.principal, p.months, p.annualRate, p.overrides)[paidCount2];
          if(!row || leftover < row.total - 0.01) break;
          leftover = +(leftover - row.total).toFixed(2);
          paidCount2++;
        }
        if(paidCount2===startPaid2) return p;
        adjustments.push({kind:"diferido", planId:p.id, from:p.paidMonths, to:paidCount2});
        return Object.assign({}, p, {paidMonths: paidCount2});
      });
      extraCredit = existingCredit + leftover;
    }
    return {
      balanceApplied: balanceApplied,
      creditAdded: extraCredit-existingCredit,
      msi: msi,
      diferidos: diferidos,
      adjustments: adjustments,
      extraCredit: extraCredit,
      newBalance: Math.max(0, +(card.balance-balanceApplied).toFixed(2))
    };
  }
  function reverseAdjustments(card, adjustments){
    if(!adjustments || !adjustments.length) return card;
    var msi = (card.msi||[]).map(function(p){
      var adj = adjustments.find(function(a){ return a.kind==="msi" && a.planId===p.id; });
      return adj ? Object.assign({}, p, {paidMonths: adj.from}) : p;
    });
    var diferidos = (card.diferidos||[]).map(function(p){
      var adj = adjustments.find(function(a){ return a.kind==="diferido" && a.planId===p.id; });
      return adj ? Object.assign({}, p, {paidMonths: adj.from}) : p;
    });
    return Object.assign({}, card, {msi:msi, diferidos:diferidos});
  }

  function registerPayment(cardId, amount, dateStr){
    if(!amount || isNaN(amount) || amount<=0) return;
    var iso = dateStr ? new Date(dateStr+"T12:00:00").toISOString() : new Date().toISOString();
    var cardBefore = data.cards.find(function(c){return c.id===cardId;});
    if(!cardBefore) return;
    var info = cardAmountDueNow(cardBefore);
    var effect = computePaymentEffect(cardBefore, amount, info.due, info.rawTotal);
    var cards = data.cards.map(function(c){
      if(c.id!==cardId) return c;
      var payments = (c.payments||[]).concat([{id:uid(), date:iso, amount:amount, balanceApplied:effect.balanceApplied, creditAdded:effect.creditAdded, adjustments:effect.adjustments}])
        .sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
      return Object.assign({}, c, {balance: effect.newBalance, payments:payments, msi:effect.msi, diferidos:effect.diferidos, extraCredit:effect.extraCredit});
    });
    persist(withHistory(Object.assign({}, data, {cards:cards})));
  }

  function updatePayment(cardId, paymentId, amount, dateStr){
    if(!amount || isNaN(amount) || amount<=0) return;
    var iso = dateStr ? new Date(dateStr+"T12:00:00").toISOString() : new Date().toISOString();
    var cardBefore = data.cards.find(function(c){return c.id===cardId;});
    if(!cardBefore) return;
    var oldPayment = (cardBefore.payments||[]).find(function(p){return p.id===paymentId;});
    if(!oldPayment) return;
    var oldBalanceApplied = oldPayment.balanceApplied != null ? oldPayment.balanceApplied : oldPayment.amount;
    var oldCreditAdded = oldPayment.creditAdded || 0;
    var reversedCard = reverseAdjustments(Object.assign({}, cardBefore, {
      balance: +(cardBefore.balance + oldBalanceApplied).toFixed(2),
      extraCredit: Math.max(0, (cardBefore.extraCredit||0) - oldCreditAdded)
    }), oldPayment.adjustments);
    var info = cardAmountDueNow(reversedCard);
    var effect = computePaymentEffect(reversedCard, amount, info.due, info.rawTotal);
    var cards = data.cards.map(function(c){
      if(c.id!==cardId) return c;
      var payments = (c.payments||[]).map(function(p){
        return p.id===paymentId ? Object.assign({},p,{amount:amount, date:iso, balanceApplied:effect.balanceApplied, creditAdded:effect.creditAdded, adjustments:effect.adjustments}) : p;
      }).sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
      return Object.assign({}, c, {balance: effect.newBalance, payments:payments, msi:effect.msi, diferidos:effect.diferidos, extraCredit:effect.extraCredit});
    });
    persist(withHistory(Object.assign({}, data, {cards:cards})));
  }

  function reapplyAdjustments(card, adjustments){

      var adj = adjustments.find(function(a){ return a.kind==="msi" && a.planId===p.id; });

    });
    var diferidos = (card.diferidos||[]).map(function(p){
      var adj = adjustments.find(function(a){ return a.kind==="diferido" && a.planId===p.id; });

  function restorePayment(cardId, paymentObj){
    if(!paymentObj) return;

    var creditAdded = paymentObj.creditAdded || 0;
    var cards = data.cards.map(function(c){

      if((c.payments||[]).some(function(p){ return p.id===paymentObj.id; })) return c; // ya existe, evita duplicados
      var payments = (c.payments||[]).concat([paymentObj]);

      return Object.assign({}, reappliedC, {

  function registerExpense(cardId, amount, description, dateStr, category){

  function updateExpense(cardId, expenseId, amount, description, dateStr, category){

      var expenses = (c.expenses||[]).map(function(e){ return e.id===expenseId ? Object.assign({},e,{amount:amount, description:description||"Gasto", date:iso, category:category||e.category||"Otros"}) : e; });
      if(c.type==="debito") return Object.assign({}, c, {expenses:expenses});

      if((c.expenses||[]).some(function(e){ return e.id===expenseObj.id; })) return c; // ya existe, evita duplicados
      var expenses = (c.expenses||[]).concat([expenseObj]);
      if(c.type==="debito") return Object.assign({}, c, {expenses:expenses});
      return Object.assign({}, c, {balance: +(c.balance+expenseObj.amount).toFixed(2), expenses:expenses});
    });
    persist(withHistory(Object.assign({}, data, {cards:cards})));
  }
  function saveFromModal(item, kind){
    if(kind==="card"){
      var exists = data.cards.some(function(c){return c.id===item.id;});
      var cards = exists ? data.cards.map(function(c){return c.id===item.id?item:c;}) : data.cards.concat([item]);
      persist(withHistory(Object.assign({}, data, {cards:cards})));
    }else{
      var exists2 = data.savings.some(function(s){return s.id===item.id;});
      var savings = exists2 ? data.savings.map(function(s){return s.id===item.id?item:s;}) : data.savings.concat([item]);
      persist(withHistory(Object.assign({}, data, {savings:savings})));
    }
    ui.modal = null;
    render();
  }

  function renderCategoryBreakdown(){
    var now = new Date();
    var cur = categoryBreakdown(data.cards, now.getFullYear(), now.getMonth());
    var prevM = previousMonth(now.getFullYear(), now.getMonth());
    var prev = categoryBreakdown(data.cards, prevM.year, prevM.month);
    if(!cur.byCat.length) return "";
    var prevByCat = {};
    prev.byCat.forEach(function(c){ prevByCat[c.category]=c.amount; });
    var topGrowth = null;
    cur.byCat.forEach(function(c){
      var before = prevByCat[c.category]||0;
      var growth = before>0 ? ((c.amount-before)/before)*100 : (c.amount>0?100:0);
      c.growth = growth;
      c.hasPrev = before>0;
      if(growth>0 && (!topGrowth || growth>topGrowth.growth)) topGrowth = c;
    });
    var vsTotal = prev.total>0 ? ((cur.total-prev.total)/prev.total)*100 : null;

    var html = '<section><div class="sec-title" style="margin-bottom:12px;">'+t("analisis_money_going")+'</div><div class="card">';
    html += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">'+
      '<span style="color:var(--muted);font-size:11px;">'+t("analisis_total_spent")+'</span>'+
      '<span style="color:var(--text);font-family:var(--mono);font-size:16px;">'+fmt(cur.total)+'</span></div>';
    if(vsTotal!==null){
      var vColor = vsTotal>0 ? "var(--coral)" : "var(--mint)";
      html += '<div style="color:'+vColor+';font-size:11px;margin-bottom:12px;">'+(vsTotal>=0?"+":"")+Math.round(vsTotal)+'% '+t("analisis_vs_prev_month")+'</div>';
    }
    html += '<div style="display:flex;flex-direction:column;gap:10px;margin-top:4px;">';
    cur.byCat.forEach(function(c, i){
      var color = colorForCategory(c.category);
      html += '<div>'+
        '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">'+
        '<span style="color:var(--text);">'+esc(c.category)+'</span>'+
        '<span style="color:var(--muted);font-family:var(--mono);">'+fmt(c.amount)+' · '+Math.round(c.pct)+'%'+
        (c.hasPrev ? ' <span style="color:'+(c.growth>0?"var(--coral)":"var(--mint)")+';">('+(c.growth>=0?"+":"")+Math.round(c.growth)+'%)</span>' : '')+
        '</span></div>'+
        '<div class="bar"><div class="bar-fill" style="width:'+c.pct+'%;background:'+color+';"></div></div>'+
        '</div>';
    });
    html += '</div>';
    if(topGrowth){
      html += '<div style="background:var(--surface3);border-left:3px solid var(--amber);border-radius:10px;padding:10px 12px;margin-top:14px;">'+
        '<div style="color:var(--text);font-size:12px;">'+t("analisis_top_growth",{cat:esc(topGrowth.category), amount:fmt(topGrowth.amount), pct:Math.round(topGrowth.growth)})+'</div></div>';
    }
    html += '</div></section>';
    return html;
  }

  function renderReconcileResultModal(){
    if(!ui.reconcileResult) return "";
    var r = ui.reconcileResult;
    var card = data.cards.find(function(c){ return c.id===r.cardId; });
    var cardName = card ? card.name : "";
    var s = r.statement;

    function compareRow(label, bankVal, appVal){
      if(bankVal==null) return "";
      var diff = Math.abs((bankVal||0) - (appVal||0));
      var matches = diff < 1; // menos de $1 de diferencia por redondeo se considera coincidencia
      var color = matches ? "var(--mint)" : "var(--coral)";
      var icon = matches ? "✓" : "⚠";
      return '<div style="background:var(--surface3);border-radius:12px;padding:10px 12px;margin-bottom:8px;">'+
        '<div style="color:var(--muted);font-size:11px;margin-bottom:6px;">'+label+'</div>'+
        '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px;">'+
        '<span style="color:var(--muted);">'+t("rec_your_statement")+'</span><span style="font-family:var(--mono);color:var(--text);">'+fmt(bankVal)+'</span></div>'+
        '<div style="display:flex;justify-content:space-between;font-size:13px;">'+
        '<span style="color:var(--muted);">'+t("rec_app_calc")+'</span><span style="font-family:var(--mono);color:var(--text);">'+fmt(appVal)+'</span></div>'+
        '<div style="color:'+color+';font-size:12px;margin-top:6px;font-weight:600;">'+icon+' '+(matches?t("rec_matches"):t("rec_diff_of",{amount:fmt(diff)}))+'</div>'+
        '</div>';
    }

    var html = '<div class="modal-overlay" data-act="close-reconcile-result-bg">'+
      '<div class="modal" data-stop="1" style="max-height:85vh;overflow-y:auto;">';
    html += '<div class="modal-head"><h3>'+t("rec_title")+' · '+esc(cardName)+'</h3><button data-act="close-reconcile-result">✕</button></div>';
    if(s.cutoffDate){
      html += '<p style="color:var(--muted);font-size:11px;margin:0 0 12px;">'+t("rec_cutoff_reported",{date:dateLabel(s.cutoffDate)})+(s.dueDate?t("rec_due_limit",{date:dateLabel(s.dueDate)}):'')+'</p>';
    }
    html += compareRow(t("rec_statement_balance"), s.statementBalance, r.appBalance);
    html += compareRow(t("rec_noint"), s.noInterestPayment, r.appAmountDue);
    if(s.minimumPayment!=null){
      html += '<div style="background:var(--surface3);border-radius:12px;padding:10px 12px;margin-bottom:8px;">'+
        '<div style="color:var(--muted);font-size:11px;margin-bottom:4px;">'+t("rec_min_payment")+'</div>'+
        '<div style="color:var(--text);font-family:var(--mono);font-size:13px;">'+fmt(s.minimumPayment)+'</div>'+
        '<div style="color:var(--muted);font-size:10px;margin-top:4px;">'+t("rec_min_note")+'</div>'+
        '</div>';
    }
    html += '<div style="display:flex;align-items:center;gap:6px;margin-top:10px;">'+renderInfoToggle("reconcile-diff")+'<span style="color:var(--muted);font-size:10px;">'+t("rec_why_diff")+'</span></div>';
    if(infoOpen("reconcile-diff")) html += '<p style="color:var(--muted);font-size:10px;line-height:1.5;margin-top:4px;">'+t("card_reconcile_diff_note")+'</p>';
    html += '</div></div>';
    return html;
  }

  function renderAlerts(){
    var s = data.settings;
    var alerts = s.alertPayments ? upcomingDuePayments(data.cards) : [];
    var loanAlerts = s.alertPayments ? upcomingPersonalCreditPayments(data.personalCredits) : [];
    var cutoffs = s.alertCutoffs ? upcomingCutoffs(data.cards) : [];
    var needsSetup = s.alertPayments ? data.cards.filter(function(c){ return cardAmountDueNow(c).needsDueDay; }) : [];
    var out = "";

    if(needsSetup.length){
      var setupRows = needsSetup.map(function(c){
        return '<button class="row" data-act="goto-card" data-id="'+c.id+'"><span>'+esc(c.name)+'</span><span class="amt" style="color:var(--amber)">'+fmtMasked(cardAmountDueNow(c).totalOwed)+' '+t("al_pending")+'</span></button>';
      }).join("");
      out += '<div class="alerts" style="background:rgba(255,159,10,.12);border:1px solid rgba(255,159,10,.25);border-left:3px solid var(--amber);"><div class="title" style="color:var(--amber);">'+t("al_setup_title")+'</div>'+setupRows+
        '<div style="color:var(--muted);font-size:11px;margin-top:6px;">'+t("al_setup_note")+'</div></div>';
    }

    if(s.alertBudget && data.budget.configured){
      var now0 = new Date();
      var gastoMes0 = data.cards.reduce(function(sum,c){ return sum+monthTotal(c.expenses||[], now0.getFullYear(), now0.getMonth()); },0);
      var presu0 = (data.budget.salary||0)*4.33*(data.budget.pctGastos/100);
      if(presu0>0 && gastoMes0>presu0){
        out += '<div class="alerts" style="background:rgba(255,69,58,.12);border:1px solid rgba(255,69,58,.25);border-left:3px solid var(--coral);"><div class="title">'+t("al_budget_title")+'</div>'+
          '<button class="row" data-act="goto-analisis"><span>'+t("al_budget_row")+'</span><span class="amt" style="color:var(--coral)">'+fmtMasked(gastoMes0)+' / '+fmtMasked(presu0)+'</span></button></div>';
      }
    }
    if(s.alertGoals){
      var reachedGoals = data.savings.filter(function(sv){
        return sv.goal>0 && sv.current>=sv.goal && (data.celebratedGoalIds||[]).indexOf(sv.id)===-1;
      });
      if(reachedGoals.length){
        var reachedRows = reachedGoals.map(function(sv){
          var bankKey = (sv.bank && sv.bank.trim()) ? sv.bank.trim() : t("ahorros_no_bank");
          return '<div class="row" style="align-items:center;">'+
            '<button data-act="goto-saving" data-bank="'+esc(bankKey)+'" style="background:none;border:none;color:inherit;font:inherit;text-align:left;padding:0;cursor:pointer;flex:1;">🎉 '+esc(sv.name)+'</button>'+
            '<button data-act="dismiss-goal-celebration" data-id="'+sv.id+'" style="background:none;border:none;color:var(--mint);font-size:11px;padding:0;">'+t("al_great")+'</button></div>';
        }).join("");
        out += '<div class="alerts" style="background:rgba(50,215,75,.12);border:1px solid rgba(50,215,75,.25);border-left:3px solid var(--mint);margin-top:'+(out?"8px":"0")+';"><div class="title" style="color:var(--mint);">'+t("al_goal_reached_title")+'</div>'+reachedRows+'</div>';
      }
      var delayedGoals = data.savings.filter(function(sv){
        if(!sv.targetDate) return false;
        var target = new Date(sv.targetDate); target.setHours(0,0,0,0);
        var today = new Date(); today.setHours(0,0,0,0);
        return target<today && sv.current<sv.goal;
      });
      if(delayedGoals.length){
        var goalRows = delayedGoals.map(function(sv){
          var bankKey2 = (sv.bank && sv.bank.trim()) ? sv.bank.trim() : t("ahorros_no_bank");
          return '<button class="row" data-act="goto-saving" data-bank="'+esc(bankKey2)+'"><span>'+esc(sv.name)+'</span><span class="amt" style="color:var(--amber)">'+t("al_goal_delayed")+'</span></button>';
        }).join("");
        out += '<div class="alerts" style="background:rgba(255,159,10,.12);border:1px solid rgba(255,159,10,.25);border-left:3px solid var(--amber);margin-top:'+(out?"8px":"0")+';"><div class="title" style="color:var(--amber);">'+t("al_goal_delayed_title")+'</div>'+goalRows+'</div>';
      }
    }
    if(s.alertUtilization){
      var highUtilCards = data.cards.filter(function(c){ return c.limit>0 && cardUtilizationPct(c)>=70; });
      if(highUtilCards.length){
        var utilRows = highUtilCards.map(function(c){
          return '<button class="row" data-act="goto-card" data-id="'+c.id+'"><span>'+esc(c.name)+'</span><span class="amt" style="color:var(--amber)">'+t("al_util_row",{pct:Math.round(cardUtilizationPct(c))})+'</span></button>';
        }).join("");
        out += '<div class="alerts" style="background:rgba(255,159,10,.12);border:1px solid rgba(255,159,10,.25);border-left:3px solid var(--amber);margin-top:'+(out?"8px":"0")+';"><div class="title" style="color:var(--amber);">'+t("al_util_title")+'</div>'+utilRows+'</div>';
      }
    }
    if(s.alertDebtGrowth){
      var histPoints = monthlyAggregate(data.history);
      if(histPoints.length>=2){
        var prevD = histPoints[histPoints.length-2].Deuda;
        var lastD = histPoints[histPoints.length-1].Deuda;
        if(prevD>0 && lastD>prevD){
          out += '<div class="alerts" style="background:rgba(255,159,10,.12);border:1px solid rgba(255,159,10,.25);border-left:3px solid var(--amber);margin-top:'+(out?"8px":"0")+';"><div class="title" style="color:var(--amber);">'+t("al_debt_grew_title")+'</div>'+
            '<button class="row" data-act="goto-analisis"><span>'+t("al_vs_prev")+'</span><span class="amt" style="color:var(--amber)">'+fmtMasked(prevD)+' → '+fmtMasked(lastD)+'</span></button></div>';
        }
      }
    }

    if(alerts.length){
      var rows = alerts.map(function(a){
        var color = a.dLeft<=3 ? "var(--coral)" : "var(--amber)";
        var label = a.dLeft===0 ? t("al_today") : t("al_in_days",{n:a.dLeft, s:a.dLeft===1?"":"s"});
        return '<button class="row" data-act="goto-card" data-id="'+a.card.id+'"><span>'+esc(a.card.name)+'</span><span class="amt" style="color:'+color+'">'+label+' · '+dateLabel(a.due)+'</span></button>';
      }).join("");
      out += '<div class="alerts"><div class="title">'+t("al_upcoming_cards")+'</div>'+rows+'</div>';
    }
    if(loanAlerts.length){
      var rows3 = loanAlerts.map(function(a){
        var color = a.dLeft<=3 ? "var(--coral)" : "var(--amber)";
        var label = a.dLeft===0 ? t("al_today") : t("al_in_days",{n:a.dLeft, s:a.dLeft===1?"":"s"});
        return '<button class="row" data-act="goto-loan"><span>'+esc(a.credit.description)+'</span><span class="amt" style="color:'+color+'">'+label+' · '+dateLabel(a.date)+'</span></button>';
      }).join("");
      out += '<div class="alerts" style="background:rgba(50,215,75,.1);border:1px solid rgba(50,215,75,.22);border-left:3px solid var(--mint);margin-top:'+(alerts.length?'8px':'0')+';"><div class="title" style="color:var(--mint);">'+t("al_upcoming_loans")+'</div>'+rows3+'</div>';
    }
    if(cutoffs.length){
      var rows2 = cutoffs.map(function(a){
        var label = a.dLeft===0 ? t("al_today") : t("al_in_days",{n:a.dLeft, s:a.dLeft===1?"":"s"});
        return '<button class="row" data-act="goto-card" data-id="'+a.card.id+'"><span>'+esc(a.card.name)+'</span><span class="amt" style="color:var(--amber)">'+label+' · '+dateLabel(a.cutoff)+'</span></button>';
      }).join("");
      out += '<div class="alerts" style="background:rgba(255,159,10,.12);border:1px solid rgba(255,159,10,.25);border-left:3px solid var(--amber);margin-top:'+((alerts.length||loanAlerts.length)?'8px':'0')+';"><div class="title" style="color:var(--amber);">'+t("al_upcoming_cutoffs")+'</div>'+rows2+'</div>';
    }
    return out;
  }

  function renderHealthScore(totalDebt, totalSavings){
    var h = computeHealthScore(data, totalDebt, totalSavings);
    var pct = h.score;
    var circumference = 2*Math.PI*30;
    var offset = circumference*(1-pct/100);
    var html = '<section style="margin-bottom:32px;"><div class="sec-title" style="margin-bottom:12px;">'+t("hs_title")+'</div>';
    html += '<div class="card">';
    html += '<div style="display:flex;align-items:center;gap:16px;">';
    html += '<svg width="72" height="72" viewBox="0 0 72 72" style="flex-shrink:0;">'+
      '<circle cx="36" cy="36" r="30" fill="none" stroke="var(--surface3)" stroke-width="7"/>'+
      '<circle cx="36" cy="36" r="30" fill="none" stroke="'+h.level.color+'" stroke-width="7" stroke-linecap="round" '+
      'stroke-dasharray="'+circumference+'" stroke-dashoffset="'+offset+'" transform="rotate(-90 36 36)"/>'+
      '<text x="36" y="41" text-anchor="middle" font-size="18" font-weight="600" fill="var(--text)">'+pct+'</text>'+
      '</svg>';
    html += '<div style="flex:1;">'+
      '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">'+
      '<span style="color:'+h.level.color+';font-family:var(--disp);font-size:14px;font-weight:600;">'+h.level.icon+' '+h.level.label+'</span>'+
      '<span style="color:var(--muted);font-size:11px;">('+pct+'/100)</span></div>'+
      '<div style="color:var(--muted);font-size:12px;line-height:1.4;">'+esc(h.mainReason)+'</div>'+
      '</div>';
    html += '</div>'; /* cierra la fila flex (svg + texto) */
    if(h.reasons && h.reasons.length){
      html += '<div style="border-top:1px solid var(--surface2);margin-top:12px;padding-top:12px;">';
      html += '<div style="color:var(--text);font-size:12px;font-weight:500;margin-bottom:8px;">'+t("hs_why")+'</div>';
      html += '<div style="display:flex;flex-direction:column;gap:6px;">';
      h.reasons.slice(0,3).forEach(function(r){
        html += '<div style="display:flex;gap:8px;align-items:flex-start;">'+
          '<span style="color:var(--amber);font-size:11px;flex-shrink:0;">●</span>'+
          '<span style="color:var(--muted);font-size:11px;line-height:1.4;">'+esc(r.text)+'</span></div>';
      });
      html += '</div></div>';
    }
    if(h.factorsSkipped && h.factorsSkipped.length){
      html += '<div style="border-top:1px solid var(--surface2);margin-top:12px;padding-top:12px;">';
      html += '<div style="color:var(--text);font-size:11px;font-weight:500;margin-bottom:6px;">'+t("hs_not_evaluated")+'</div>';
      h.factorsSkipped.forEach(function(f){
        html += '<div style="color:var(--muted);font-size:11px;line-height:1.4;">· '+esc(f)+'</div>';
      });
      html += '</div>';
    }
    var factorsOpen = isSubsectionOpen("health", "factors");
    html += '<div style="border-top:1px solid var(--surface2);margin-top:12px;padding-top:12px;">';
    html += '<button data-act="toggle-subsection" data-card="health" data-key="factors" style="width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:none;padding:0;text-align:left;">'+
      '<span style="color:var(--text);font-size:12px;font-weight:500;">'+(factorsOpen?t("hsf_hide_toggle"):t("hsf_toggle"))+'</span>'+
      '<span style="color:var(--muted);font-size:11px;transform:rotate('+(factorsOpen?"180deg":"0deg")+');transition:transform .15s;">▾</span>'+
      '</button>';
    if(factorsOpen && h.factorDetails && h.factorDetails.length){
      html += '<div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">';
      h.factorDetails.forEach(function(f){
        html += '<div style="background:var(--surface3);border-radius:10px;padding:8px 10px;">'+
          '<div style="display:flex;justify-content:space-between;align-items:center;">'+
          '<span style="color:var(--text);font-size:12px;">'+f.label+'</span>'+
          '<span style="color:'+(f.evaluated?f.color:"var(--muted)")+';font-size:11px;font-weight:600;">'+(f.evaluated?f.rating:t("hsf_not_evaluated"))+'</span>'+
          '</div>'+
          '<div style="color:var(--muted);font-size:11px;margin-top:2px;">'+f.detail+'</div>'+

      });
