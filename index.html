    html += '</div>';
    html += '<div style="color:var(--muted);font-size:10px;margin-top:10px;line-height:1.5;">'+t("hs_calc_note",{n:h.factorsEvaluated})+'</div>';
    html += '</div>'; /* cierra .card */
    html += '</section>';
    return html;
  }

  function renderBudgetSection(totalDebt){
    var html = '<section>';
    html += '<div class="sec-title" style="margin-bottom:8px;display:flex;align-items:center;gap:6px;">'+t("budget_title")+' '+renderInfoToggle("budget-5030")+'</div>';
    if(infoOpen("budget-5030")) html += '<div style="color:var(--muted);font-size:11px;line-height:1.5;margin-bottom:12px;">'+t("budget_5030_note")+'</div>';
    html += renderBudgetPanel(totalDebt);
    html += renderBudgetHistory();
    html += '</section>';
    return html;
  }

  function renderBudgetHistory(){
    var b = data.budget;
    if(!b.configured || !(b.salary>0)) return "";
    var presupuestoMensual = b.salary*4.33*b.pctGastos/100;
    if(presupuestoMensual<=0) return "";
    var now = new Date();
    var months = [];
    for(var i=2;i>=0;i--){
      var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      var total = data.cards.reduce(function(s,c){ return s+monthTotal(c.expenses||[], d.getFullYear(), d.getMonth()); },0);
      months.push({label:d.toLocaleDateString(tlang()==="en"?"en-US":"es-MX",{month:"short",year:"2-digit"}), total:total, isCurrent:i===0});
    }
    if(!months.some(function(m){ return m.total>0; })) return "";
    var html = '<div class="bank-box" style="margin-top:12px;">';
    html += '<div class="bank-title">'+t("budget_vs_real")+'</div>';
    months.forEach(function(m){
      var pct = Math.min(150, (m.total/presupuestoMensual)*100);
      var over = m.total > presupuestoMensual;
      var color = over ? "var(--coral)" : "var(--mint)";
      html += '<div style="margin-bottom:10px;">'+
        '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">'+
        '<span style="color:var(--text);">'+m.label+(m.isCurrent?t("budget_current"):"")+'</span>'+
        '<span style="font-family:var(--mono);color:'+color+';">'+fmt(m.total)+' / '+fmt(presupuestoMensual)+'</span></div>'+
        '<div class="bar"><div class="bar-fill" style="width:'+Math.min(100,pct)+'%;background:'+color+';"></div></div>'+
        '</div>';
    });
    html += '<div style="color:var(--muted);font-size:10px;margin-top:4px;">'+t("budget_calc_note",{amount:fmt(presupuestoMensual)})+'</div>';
    html += '</div>';
    return html;
  }

  function renderBudgetPanel(totalDebt){
    var b = data.budget;
    var salary = b.salary || 0;
    var pctSum = b.pctGastos + b.pctDiversion + b.pctAhorro;
    function weekly(pct){ return salary*pct/100; }
    function monthly(pct){ return weekly(pct)*4.33; }
    var rows = [
      {key:"gastos", label:t("budget_gastos"), val:b.pctGastos, color:"var(--coral)"},
      {key:"diversion", label:t("budget_diversion"), val:b.pctDiversion, color:"var(--amber)"},
      {key:"ahorro", label:t("budget_ahorro"), val:b.pctAhorro, color:"var(--mint)"}
    ];
    var html = '<div class="bank-box">';
    html += '<div class="bank-title">'+t("budget_weekly_title")+'</div>';
    if(!b.configured){
      html += '<div style="color:var(--muted);font-size:11px;line-height:1.5;margin-bottom:10px;">'+t("budget_unconfirmed_note")+'</div>';
    }
    html += '<span class="field-label">'+t("budget_weekly_salary")+'</span><input type="text" inputmode="decimal" id="budget-salary" value="'+salary+'" style="margin-bottom:10px;" />';
    rows.forEach(function(r){
      html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--surface2);">'+
        '<div style="display:flex;align-items:center;gap:8px;">'+
        '<span style="font-size:14px;">'+r.label+'</span>'+
        '<input type="text" inputmode="numeric" id="budget-pct-'+r.key+'" value="'+r.val+'" style="width:44px;padding:6px 8px;text-align:center;color:'+r.color+';" />'+
        '<span style="color:var(--muted);font-size:12px;">%</span>'+
        '</div>'+
        '<div style="text-align:right;">'+
        '<div style="color:'+r.color+';font-family:var(--mono);font-size:13px;">'+fmt(weekly(r.val))+t("budget_per_week")+'</div>'+
        '<div style="color:var(--muted);font-family:var(--mono);font-size:11px;">'+t("budget_approx_month",{amount:fmt(monthly(r.val))})+'</div>'+
        '</div></div>';
    });
    if(pctSum !== 100){
      html += '<div style="color:var(--amber);font-size:11px;margin-top:8px;">'+t("budget_pct_mismatch",{pct:pctSum})+'</div>';
    }
    if(!b.configured){
      html += '<button class="modal-save" data-act="save-budget" style="margin-top:12px;">'+t("budget_confirm_btn")+'</button>';
      html += '</div>';
      return html;
    }
    var now = new Date();
    var gastoMesActual = data.cards.reduce(function(s,c){ return s+monthTotal(c.expenses||[], now.getFullYear(), now.getMonth()); },0);
    var presupuestoGastoMensual = monthly(b.pctGastos);
    if(presupuestoGastoMensual>0){
      var usedPct = Math.min(999, (gastoMesActual/presupuestoGastoMensual)*100);
      var semColor = usedPct>=100 ? "var(--coral)" : usedPct>=80 ? "var(--amber)" : "var(--mint)";
      var semIcon = usedPct>=100 ? "🔴" : usedPct>=80 ? "🟡" : "🟢";
      var daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
      var daysLeft = daysInMonth - now.getDate();
      html += '<div style="background:var(--surface3);border-radius:10px;padding:10px 12px;margin-top:12px;">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">'+
        '<span style="color:var(--text);font-size:12px;">'+semIcon+' '+t("budget_monthly_progress")+'</span>'+
        '<span style="color:'+semColor+';font-family:var(--mono);font-size:12px;">'+Math.round(usedPct)+'%</span></div>'+
        '<div class="bar"><div class="bar-fill" style="width:'+Math.min(100,usedPct)+'%;background:'+semColor+';"></div></div>'+
        '<div style="color:var(--muted);font-size:11px;margin-top:6px;">'+t("budget_used_of",{used:fmt(gastoMesActual), total:fmt(presupuestoGastoMensual), days:daysLeft, s:daysLeft===1?"":"s"})+'</div>'+
        '</div>';
    }
    if(totalDebt > 0){
      var PAYOFF_WEEKS = 26;
      var suggestedWeekly = totalDebt / PAYOFF_WEEKS;
      var currentAhorroWeekly = weekly(b.pctAhorro);
      var onTrack = currentAhorroWeekly >= suggestedWeekly;
      var suggestedPct = salary>0 ? Math.min(100, Math.round((suggestedWeekly/salary)*100)) : null;
      html += '<div style="background:var(--surface3);border-left:3px solid '+(onTrack?"var(--mint)":"var(--coral)")+';border-radius:10px;padding:10px 12px;margin-top:12px;">'+
        '<div style="color:var(--text);font-size:12px;">'+t("budget_debt_suggestion",{debt:fmt(totalDebt), amount:fmt(suggestedWeekly), color:onTrack?"var(--mint)":"var(--coral)", pctNote:(suggestedPct!==null?t("budget_debt_pct_note",{pct:suggestedPct}):"")})+'</div>'+
        '<div style="color:'+(onTrack?"var(--mint)":"var(--amber)")+';font-size:11px;margin-top:4px;">'+
        (onTrack ? t("budget_ontrack",{amount:fmt(currentAhorroWeekly)}) : t("budget_behind",{amount:fmt(currentAhorroWeekly)}))+
        '</div></div>';
    }
    html += '<button class="modal-save" data-act="save-budget" style="margin-top:12px;">'+t("btn_save_changes")+'</button>';
    html += '</div>';
    return html;
  }

  function renderPersonalCreditRow(credit){
    var paid = personalElapsed(credit);
    var done = paid >= credit.months;
    var remaining = personalRemaining(credit);
    var nextRow = personalNextPaymentRow(credit);
    var nextDate = personalNextPaymentDate(credit);
    var donePct = Math.min(100, (paid/credit.months)*100);
    var dLeft = nextDate ? daysUntil(nextDate) : null;
    var dueColor = dLeft===null ? "var(--muted)" : dLeft<=3 ? "var(--coral)" : dLeft<=7 ? "var(--amber)" : "var(--muted)";
    var adjusting = ui.adjustPersonalTarget === credit.id;
    var html = '<div class="card">';
    html += '<div class="card-top">';
    html += '<div style="flex:1;">';
    html += '<div class="name">'+esc(credit.description)+'</div>';
    html += '<div class="amount-line"><span class="amount-main">'+fmtMasked(remaining)+'</span><span class="amount-sub">de '+fmtMasked(credit.principal)+' · '+credit.annualRate+'% anual</span></div>';
    if(!done && nextRow && nextDate){
      html += '<div style="color:'+dueColor+';font-size:11px;margin-top:4px;">'+t("prestamos_next_payment",{amount:fmtMasked(nextRow.total), date:dateLabel(nextDate)})+
        (dLeft!==null ? ' ('+(dLeft===0?t("prestamos_today"):t("prestamos_in_days",{n:dLeft, s:dLeft===1?"":"s"}))+')' : '')+
        (nextRow.adjusted?t("def_adjusted"):'')+'</div>';
      html += '<div style="color:var(--muted);font-size:11px;margin-top:2px;">'+t("prestamos_capital_interest_iva",{capital:fmtMasked(nextRow.capital), interest:fmtMasked(nextRow.interest), iva:fmtMasked(nextRow.iva)})+'</div>';
    }
    if(done) html += '<div style="color:var(--mint);font-size:11px;margin-top:4px;">'+t("prestamos_paid_off")+'</div>';
    html += '</div>';
    html += '<div style="display:flex;gap:2px;">'+
      '<button class="icon-btn" data-act="edit-personal-credit" data-id="'+credit.id+'">✎</button>'+
      '<button class="icon-btn" data-act="delete-personal-credit" data-id="'+credit.id+'">🗑</button>'+
      '</div></div>';
    html += '<div style="display:flex;align-items:center;gap:8px;margin-top:10px;">'+
      '<div class="bar" style="flex:1;"><div class="bar-fill" style="width:'+donePct+'%;background:'+(done?"var(--mint)":"var(--coral)")+'"></div></div>'+
      '<span style="color:var(--muted);font-family:var(--mono);font-size:11px;">'+paid+'/'+credit.months+'</span>'+
      '</div>';
    html += '<div style="display:flex;gap:8px;margin-top:8px;">';
    if(paid>0) html += '<button class="mark-btn" style="color:var(--muted);" data-act="unmark-personal-credit" data-id="'+credit.id+'">'+t("prestamos_unmark")+'</button>';
    if(!done) html += '<button class="mark-btn" data-act="mark-personal-credit" data-id="'+credit.id+'">'+t("prestamos_mark_paid")+'</button>';
    html += '</div>';
    if(!done){
      if(adjusting){
        html += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--hairline);">'+
          '<span class="field-label">'+t("def_real_amount",{n:paid+1, total:credit.months})+'</span>'+
          '<input type="text" inputmode="decimal" id="adjust-personal-input-'+credit.id+'" placeholder="ej. '+Math.round(nextRow?nextRow.total:0)+'" style="margin-bottom:8px;" />'+
          '<div class="form-actions">'+
          '<button class="btn-cancel" data-act="toggle-adjust-personal" data-id="'+credit.id+'">'+t("btn_cancel")+'</button>'+
          '<button class="btn-save" data-act="submit-adjust-personal" data-id="'+credit.id+'" data-month="'+(paid+1)+'">'+t("btn_save")+'</button>'+
          '</div></div>';
      }else{
        html += '<button class="mini-add" style="color:var(--muted);margin-top:8px;" data-act="toggle-adjust-personal" data-id="'+credit.id+'">'+t("def_adjust_this")+'</button>';
      }
    }
    html += '</div>';
    return html;
  }

            '<div style="color:var(--muted);font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(r.category)+' · '+esc(r.cardName)+'</div>'+

            '</div></div>';
        });
        html += '</div>';
      });
      html += '<button class="modal-save" style="background:var(--surface2);color:var(--text);margin-top:14px;" data-act="export-csv" data-scope="filtered">'+t("mov_export",{n:results.length, s:results.length===1?"":"s"})+'</button>';
    }

    html += '</section>';
    return html;
  }

  function renderCardsSection(){
    var creditCards = data.cards.filter(function(c){ return c.type!=="debito"; });
    var html = '<section>'+renderHideBalancesToggle()+'<div class="sec-head"><div class="sec-title">💳 '+t("section_title_tarjetas")+'</div>'+
      '<button class="add-btn" data-act="open-modal" data-kind="card" data-card-type="credito">'+t("btn_add")+'</button></div>';
    if(!creditCards.length){
      html += emptyState("💳", t("card_empty_title"), t("card_empty_body"));
    }
    sortCardsByDue(creditCards).forEach(function(c){ html += renderCard(c); });
    html += '</section>';
    return html;
  }

  function renderGastosSection(){
    var debitCards = data.cards.filter(function(c){ return c.type==="debito"; });
    var html = '<section>'+renderHideBalancesToggle()+'<div class="sec-head"><div class="sec-title">💵 '+t("title_gastos")+'</div>'+
      '<button class="add-btn" data-act="open-modal" data-kind="card" data-card-type="debito">'+t("btn_add")+'</button></div>';
    if(!debitCards.length){
      html += emptyState("💵", t("gastos_empty_title"), t("gastos_empty_body"));
    }
    debitCards.forEach(function(c){ html += renderCard(c); });
    html += '</section>';
    return html;
  }

  function renderCard(item){
    if(item.type==="debito") return renderDebitCard(item);
    var msiOwed = cardMsiTotal(item);
    var deferredOwed = cardDeferredTotal(item);
    var usedTotal = Math.max(0, item.balance + msiOwed + deferredOwed - (item.extraCredit||0));
    var pct = item.limit>0 ? Math.min(100, (usedTotal/item.limit)*100) : 0;
    var barColor = pct>90 ? "var(--coral)" : pct>70 ? "var(--amber)" : "var(--mint)";
    var available = item.limit>0 ? Math.max(0, item.limit-usedTotal) : null;
    var due = nextDueDate(item.dueDay);
    var dLeft = due ? daysUntil(due) : null;
    var dueColor = dLeft===null ? "var(--muted)" : dLeft<=3 ? "var(--coral)" : dLeft<=7 ? "var(--amber)" : "var(--muted)";
    var dueLabel = dLeft===null ? null : (dLeft===0?t("card_pay_today"):t("card_pay_in_days",{n:dLeft, s:dLeft===1?"":"s"}));
    var payments = item.payments || [];
    var lastPayment = payments.length ? payments[payments.length-1] : null;
    var open = ui.openCard === item.id;
    var grad = gradientForCard(item.name, item.colorOverride);

    var html = '<div class="card" data-card="'+item.id+'" style="padding:14px;">';

    /* acciones (editar/eliminar) arriba, fuera de la cara de la tarjeta, para no saturarla */
    html += '<div style="display:flex;justify-content:flex-end;gap:2px;margin-bottom:8px;">'+
      '<button class="icon-btn" data-act="edit-card" data-id="'+item.id+'">✎</button>'+
      '<button class="icon-btn" data-act="delete-card" data-id="'+item.id+'">🗑</button>'+
      '</div>';

    /* --- cara de la tarjeta: proporción real de una tarjeta bancaria (~1.586:1) --- */
    html += '<button class="card-main" data-act="toggle-card" data-id="'+item.id+'" style="display:block;width:100%;">';
    html += '<div style="aspect-ratio:1.586/1;background:linear-gradient(135deg,'+grad[0]+','+grad[1]+');border-radius:18px;padding:16px 18px;position:relative;overflow:hidden;box-shadow:0 12px 24px rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:space-between;">';
    // brillo especular sutil, como el vinil/plastico de una tarjeta real
    html += '<div style="position:absolute;top:-40%;left:-20%;width:90%;height:140%;background:linear-gradient(115deg,rgba(255,255,255,.16),rgba(255,255,255,0) 45%);pointer-events:none;"></div>';
    // fila superior: nombre de la tarjeta + icono de contactless
    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;">'+
      '<span style="color:rgba(255,255,255,.92);font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:-0.01em;">'+esc(item.name)+'</span>'+
      '<svg width="20" height="20" viewBox="0 0 24 24" style="opacity:.75;"><path d="M8.5 8.5a5 5 0 0 1 7 0M6 6a9 9 0 0 1 12 0M11 11a2 2 0 0 1 2 0" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>'+
      '</div>';
    // chip, a media altura como en una tarjeta real
    html += '<div style="position:relative;z-index:1;">'+
      '<div style="width:34px;height:26px;border-radius:6px;background:linear-gradient(160deg,#E4E6E9,#A9AFB8);display:flex;align-items:center;justify-content:center;">'+
      '<div style="width:24px;height:17px;border:1.2px solid rgba(0,0,0,.35);border-radius:3px;position:relative;">'+
      '<div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(0,0,0,.35);"></div>'+
      '<div style="position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(0,0,0,.35);"></div>'+
      '</div></div></div>';
    // linea inferior: saldo (numero principal, como iria el numero de tarjeta) + limite
    // linea inferior: saldo total (numero principal) + limite — el saldo total incluye
    // saldo normal + MSI pendiente + diferidos pendientes - crédito a favor, para que
    // coincida con "saldo al corte + movimientos después del corte - pagos" tal como
    // lo verías en tu estado de cuenta real (antes solo mostraba el saldo "normal",
    // dejando fuera MSI y diferidos, lo cual no cuadraba con el total real).
    html += '<div style="position:relative;z-index:1;">'+
      '<div style="color:#fff;font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-0.01em;">'+fmtMasked(usedTotal)+'</div>'+
      '<div style="color:rgba(255,255,255,.7);font-family:var(--mono);font-size:11px;margin-top:2px;">de '+fmtMasked(item.limit)+' '+t("card_limit")+'</div>'+
      '</div>';
    html += '</div>'; // fin cara de tarjeta
    html += '</button>';

    /* --- cuadrícula de datos clave, ordenada y fuera de la tarjeta --- */
    html += '<div style="display:grid;grid-template-columns:repeat('+(item.cutoffDay?3:2)+',1fr);gap:8px;margin-top:10px;">';
    html += '<div style="background:var(--surface3);border-radius:12px;padding:8px 10px;">'+
      '<div style="color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;">'+t("card_available")+'</div>'+
      '<div style="color:var(--text);font-family:var(--mono);font-size:13px;font-weight:600;">'+(available!==null?fmtMasked(available):"—")+'</div>'+
      '</div>';
    html += '<div style="background:var(--surface3);border-radius:12px;padding:8px 10px;">'+
      '<div style="color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;">'+t("card_usage")+'</div>'+
      '<div style="color:'+barColor+';font-family:var(--mono);font-size:13px;font-weight:600;">'+Math.round(pct)+'%</div>'+
      '</div>';
    if(item.cutoffDay){
      html += '<div style="background:var(--surface3);border-radius:12px;padding:8px 10px;">'+
        '<div style="color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;">'+(dueLabel?t("card_payment"):t("card_cutoff"))+'</div>'+
        '<div style="color:'+(dueLabel?dueColor:"var(--text)")+';font-family:var(--mono);font-size:13px;font-weight:600;">'+(dueLabel||("día "+item.cutoffDay))+'</div>'+
        '</div>';
    }
    html += '</div>';

    /* segunda fila de datos, solo si aplica: MSI/diferido/crédito a favor/último pago */
    var extraFacts = [];
    if(msiOwed>0) extraFacts.push({label:"MSI pendiente", value:fmtMasked(msiOwed), color:"var(--amber)"});
    if(deferredOwed>0) extraFacts.push({label:"Diferido", value:fmtMasked(deferredOwed), color:"var(--coral)"});
    // Crédito a favor "restante": lo guardado internamente se resta contra el saldo, MSI y
    // diferidos vigentes — mostrar el número crudo hacía parecer que el crédito "nunca se
    // quitaba" aunque ya se hubiera consumido con gastos nuevos.
    var remainingCredit = Math.max(0, (item.extraCredit||0) - item.balance - msiOwed - deferredOwed);
    if(remainingCredit>0) extraFacts.push({label:"Crédito a favor", value:fmtMasked(remainingCredit), color:"var(--mint)", editable:true, cardId:item.id});
    if(lastPayment) extraFacts.push({label:"Último pago", value:fmtMasked(lastPayment.amount)+" · "+dateLabel(lastPayment.date), color:"var(--text)"});
    if(extraFacts.length){
      html += '<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px;">';
      extraFacts.forEach(function(f){
        if(f.editable && ui.editCreditTarget===f.cardId){
          html += '<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;padding:0 2px;">'+
            '<span style="color:var(--muted);">'+f.label+'</span>'+
            '<span style="display:flex;align-items:center;gap:4px;">'+
            '<input type="text" inputmode="decimal" id="edit-credit-input-'+f.cardId+'" value="'+Math.round(item.extraCredit||0)+'" style="width:80px;padding:4px 6px;font-size:11px;" />'+
            '<button class="icon-btn" style="color:var(--mint);padding:2px;" data-act="save-credit-edit" data-id="'+f.cardId+'">✓</button>'+
            '<button class="icon-btn" style="color:var(--muted);padding:2px;" data-act="cancel-credit-edit">✕</button>'+
            '</span></div>';
        }else{
          html += '<div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:0 2px;">'+
            '<span style="color:var(--muted);">'+f.label+(f.editable?' <button class="icon-btn" style="padding:0 2px;font-size:10px;color:var(--muted);" data-act="start-credit-edit" data-id="'+f.cardId+'">✎</button>':'')+'</span>'+
            '<span style="color:'+f.color+';font-family:var(--mono);">'+f.value+'</span></div>';
        }
      });
      html += '</div>';
    }

    /* estimado de pago: una sola línea compacta; el detalle completo vive dentro al expandir */
    var dueInfo = cardAmountDueNow(item);
    var msiDue = msiDueThisPeriod(item, due);
    var defDue = deferredDueThisPeriod(item, due);
    var futureCycleTotal = dueInfo.futureCycleTotal;
    if(due && dueInfo.amount>0){
      var dueTotal = dueInfo.amount;
      html += '<button data-act="toggle-card" data-id="'+item.id+'" style="width:100%;text-align:left;background:var(--surface3);border:none;border-left:3px solid '+dueColor+';border-radius:10px;padding:8px 10px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;">'+
        '<span style="color:var(--text);font-size:11px;">'+t("card_cover_by",{date:dateLabel(due)})+'</span>'+
        '<span style="font-family:var(--mono);color:'+dueColor+';font-size:13px;font-weight:600;white-space:nowrap;">'+fmtMasked(dueTotal)+'</span>'+
        '</button>';
    }

    html += '<div class="bar" style="margin-top:10px;"><div class="bar-fill" style="width:'+pct+'%;background:'+barColor+'"></div></div>';

    if(open){
      if(due && dueInfo.amount>0){
        var disclaimerKey = "due-disclaimer-"+item.id;
        html += '<div style="background:var(--surface3);border-radius:10px;padding:8px 10px;margin-top:8px;">'+
          '<div style="display:flex;align-items:center;gap:5px;">'+renderInfoToggle(disclaimerKey)+'<span style="color:var(--muted);font-size:10px;">¿De dónde sale este monto?</span></div>'+
          (infoOpen(disclaimerKey) ? '<div style="color:var(--muted);font-size:10px;margin-top:4px;">Consulta tu estado de cuenta para confirmar el pago para no generar intereses — la app no conoce el saldo oficial del banco.</div>' : '')+
          (msiDue>0 ? '<div style="color:var(--amber);font-size:11px;margin-top:4px;">incluye '+fmtMasked(msiDue)+' de cuotas MSI</div>' : '')+
          (defDue>0 ? '<div style="color:var(--coral);font-size:11px;margin-top:4px;">incluye '+fmtMasked(defDue)+' de pagos diferidos (con interés + IVA)</div>' : '')+
          (dueInfo.credit>0 ? '<div style="color:var(--mint);font-size:11px;margin-top:4px;">se restó '+fmtMasked(dueInfo.credit)+' de crédito a favor</div>' : '')+
          (futureCycleTotal>0 ? '<div style="color:var(--muted);font-size:11px;margin-top:4px;">'+fmtMasked(futureCycleTotal)+' en compras recientes no entran aquí — se facturan en el próximo corte</div>' : '')+
          '<div style="color:var(--muted);font-size:11px;margin-top:4px;">'+(dLeft===0?"vence hoy":"faltan "+dLeft+" día"+(dLeft===1?"":"s"))+' desde el corte del día '+item.cutoffDay+'</div>'+
          '</div>';
      }
      html += renderExpensesSection(item);
      html += renderPaymentsSection(item, payments);
      html += renderMsiSection(item);
      html += renderDeferredSection(item);
    }
    html += '</div>';
    return html;
  }

  function renderDebitCard(item){
    var expenses = (item.expenses||[]).slice().sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
    var now = new Date();
    var thisMonthTotal = monthTotal(item.expenses||[], now.getFullYear(), now.getMonth());
    var open = ui.openCard === item.id;
    var grad = gradientForCard(item.name, item.colorOverride);

    var html = '<div class="card" data-card="'+item.id+'" style="padding:14px;">';
    html += '<div style="display:flex;justify-content:flex-end;gap:2px;margin-bottom:8px;">'+
      '<button class="icon-btn" data-act="edit-card" data-id="'+item.id+'">✎</button>'+
      '<button class="icon-btn" data-act="delete-card" data-id="'+item.id+'">🗑</button>'+
      '</div>';

    html += '<button class="card-main" data-act="toggle-card" data-id="'+item.id+'" style="display:block;width:100%;">';
    html += '<div style="border-radius:16px;padding:16px 18px;background:linear-gradient(135deg,'+grad[0]+','+grad[1]+');position:relative;overflow:hidden;box-shadow:0 12px 24px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:space-between;">';
    html += '<div style="position:absolute;top:-40%;left:-20%;width:90%;height:140%;background:linear-gradient(115deg,rgba(255,255,255,.16),rgba(255,255,255,0) 45%);pointer-events:none;"></div>';
    html += '<div style="position:relative;z-index:1;min-width:0;">'+
      '<div style="color:rgba(255,255,255,.92);font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:-0.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(item.name)+'</div>'+
      '<div style="color:rgba(255,255,255,.65);font-size:10px;margin-top:2px;">'+t("debit_type_badge")+'</div>'+
      '</div>';
    html += '<div style="position:relative;z-index:1;text-align:right;flex-shrink:0;margin-left:10px;">'+
      '<div style="color:#fff;font-family:var(--mono);font-size:19px;font-weight:600;">'+fmtMasked(thisMonthTotal)+'</div>'+
      '<div style="color:rgba(255,255,255,.7);font-size:10px;margin-top:2px;">'+t("debit_this_month")+'</div>'+
      '</div>';
    html += '</div></button>';

    if(open){
      html += '<div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:10px;margin-bottom:4px;">';
      html += '<input type="file" accept="image/*,.pdf,application/pdf" id="receipt-input-'+item.id+'" style="display:none;" />';
      html += '<button class="mini-add" style="color:var(--amber);" data-act="scan-receipt" data-id="'+item.id+'">'+t("card_scan_receipt")+'</button>';
      if(ui.expenseForm !== item.id){
        html += '<button class="mini-add" data-act="show-expense-form" data-id="'+item.id+'">'+t("card_register_expense")+'</button>';
      }
      html += '</div>';
      if(ui.expenseForm === item.id && ui.scanError){
        html += '<div style="color:var(--coral);font-size:11px;margin-bottom:8px;">'+esc(ui.scanError)+'</div>';
      }
      if(!expenses.length){
        html += '<div class="empty">'+t("debit_empty")+'</div>';
      }else{
        html += '<div class="mini-card">';
        expenses.forEach(function(e, idx){
          html += '<div class="swipe-row" data-swipe-id="exp-'+e.id+'">'+
            '<div class="swipe-actions">'+
            '<button style="background:var(--amber);" data-act="edit-expense" data-card="'+item.id+'" data-exp="'+e.id+'">✎</button>'+
            '<button style="background:var(--coral);" data-act="delete-expense" data-card="'+item.id+'" data-exp="'+e.id+'">✕</button>'+
            '</div>'+
            '<div class="swipe-content mini-row" style="padding:6px 0;'+(idx<expenses.length-1?'border-bottom:1px solid var(--surface2);':'')+'">'+
            '<span class="pay-date" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65%;">'+esc(e.description)+' · '+dateLabel(e.date)+'</span>'+
            '<span style="font-family:var(--mono);font-size:12px;">'+fmtMasked(e.amount)+'</span>'+
            '</div></div>';
        });
        html += '</div>';
      }
    }
    html += '</div>';
    return html;
  }

  function isSubsectionOpen(cardId, key){ return !!ui.openSubsections[cardId+"-"+key]; }
  function renderSubsectionToggle(cardId, key, label, summary){
    var open = isSubsectionOpen(cardId, key);
    return '<button class="subsection-toggle" data-act="toggle-subsection" data-card="'+cardId+'" data-key="'+key+'" style="width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:none;padding:0;text-align:left;">'+
      '<span class="subsection-label">'+label+'</span>'+
      '<span style="display:flex;align-items:center;gap:6px;">'+
      (summary?'<span style="color:var(--muted);font-size:11px;">'+summary+'</span>':'')+
      '<span style="color:var(--muted);font-size:11px;transform:rotate('+(open?"180deg":"0deg")+');transition:transform .15s;">▾</span>'+
      '</span></button>';
  }
  /* Ícono "?" chiquito para esconder explicaciones genéricas (método, disclaimers)
     que no cambian con tus datos — se despliegan solo si las quieres leer, en vez de
     ocupar espacio siempre. Reutiliza el mismo mecanismo de abrir/cerrar que las
     demás secciones colapsables (ui.openSubsections), con "info" como espacio de
     nombres para no chocar con otras claves. */
  function renderInfoToggle(key){
    return '<button data-act="toggle-subsection" data-card="info" data-key="'+key+'" style="display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--surface3);border:none;color:var(--muted);font-size:10px;font-weight:700;flex-shrink:0;line-height:1;padding:0;vertical-align:middle;">?</button>';
  }
  function infoOpen(key){ return isSubsectionOpen("info", key); }

  function renderExpensesSection(item){
    var schedule = paymentSchedule(item);
    var expenses = item.expenses || [];
    var scanning = ui.scanningCard === item.id;
    var open = isSubsectionOpen(item.id, "expenses");
    var thisMonthNow = new Date();
    var thisMonthTotalSummary = monthTotal(expenses, thisMonthNow.getFullYear(), thisMonthNow.getMonth());
    var html = '<div class="subsection">';
    html += renderSubsectionToggle(item.id, "expenses", t("card_expenses"), expenses.length+" · "+fmtMasked(thisMonthTotalSummary)+" "+t("card_this_month"));
    if(!open){ html += '</div>'; return html; }
    html += '<div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:8px;margin-bottom:4px;">';
    html += '<input type="file" accept="image/*,.pdf,application/pdf" id="receipt-input-'+item.id+'" style="display:none;" />';
    html += '<button class="mini-add" style="color:var(--amber);" data-act="scan-receipt" data-id="'+item.id+'" '+(scanning?"disabled":"")+'>'+(scanning?t("card_scanning"):t("card_scan_receipt"))+'</button>';
    if(ui.expenseForm !== item.id){
      html += '<button class="mini-add" data-act="show-expense-form" data-id="'+item.id+'">'+t("card_register_expense")+'</button>';
    }
    html += '</div>';

    if(ui.expenseForm === item.id && ui.scanError){
      html += '<div style="color:var(--coral);font-size:11px;margin-bottom:8px;">'+esc(ui.scanError)+'</div>';
    }

    if(!item.cutoffDay || !item.dueDay){
      html += '<div class="empty" style="margin-bottom:8px;">'+t("card_add_cutoff_note")+'</div>';
    }

    var now = new Date();
    var prevMonthDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
    var thisTotal = monthTotal(expenses, now.getFullYear(), now.getMonth());
    var prevTotal = monthTotal(expenses, prevMonthDate.getFullYear(), prevMonthDate.getMonth());
    if(thisTotal>0 || prevTotal>0){
      var diff = thisTotal-prevTotal;
      var pctChange = prevTotal>0 ? Math.round((diff/prevTotal)*100) : null;
      html += '<div style="background:var(--surface3);border-radius:10px;padding:8px 10px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;">'+
        '<span style="color:var(--muted);font-size:11px;">'+t("card_this_month_colon",{amount:'<span style="color:var(--text);font-family:var(--mono);">'+fmtMasked(thisTotal)+'</span>', prev:fmtMasked(prevTotal)})+'</span>'+
        (pctChange!==null ? '<span style="color:'+(diff>0?"var(--coral)":"var(--mint)")+';font-size:11px;white-space:nowrap;">'+(diff>0?"▲":diff<0?"▼":"—")+' '+Math.abs(pctChange)+'%</span>' : '')+
        '</div>';
    }

    var reconciling = ui.reconcileBusy && ui.reconcileTarget === item.id;
    var manualForm = ui.reconcileManualForm === item.id;
    html += '<div style="background:var(--surface3);border-radius:10px;padding:8px 10px;margin-bottom:8px;">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;">'+
      '<span style="color:var(--muted);font-size:11px;">'+t("card_reconcile_title")+'</span>'+
      '<div style="display:flex;gap:10px;">'+
      '<input type="file" accept="image/*,.pdf,application/pdf" id="statement-input-'+item.id+'" style="display:none;" />'+
      '<button class="mini-add" style="color:var(--muted);" data-act="toggle-reconcile-manual" data-id="'+item.id+'">'+t("card_reconcile_manual")+'</button>'+

        '<button style="background:var(--amber);" data-act="edit-expense" data-card="'+item.id+'" data-exp="'+e.id+'">✎</button>'+

        '<span style="font-family:var(--mono);font-size:12px;">'+fmtMasked(e.amount)+'</span>'+
        '</div></div>';
    }
    function renderCycleCard(g){
      var dl = daysUntil(g.pago);
      var color = dl<=3 ? "var(--coral)" : dl<=10 ? "var(--amber)" : "var(--mint)";
      var fullyPaid = g.remaining<=0.01;
      var out = '<div class="mini-card"><div class="mini-row">'+
        '<span style="font-size:12px;">'+t("card_cutoff_label",{date:dateLabel(g.corte), n:g.count, s:g.count===1?"":"s"})+'</span>'+

      out += g.expenses.map(renderExpenseRow).join("");
      out += '</div>';
      return out;
    }
    upcomingCycles.forEach(function(g){ html += renderCycleCard(g); });
    if(pastCycles.length){
      if(showPastCycles){
        pastCycles.forEach(function(g){ html += renderCycleCard(g); });

      html += '<div class="mini-card"><div class="empty" style="margin-bottom:8px;">'+t("card_unassigned",{n:schedule.unassigned.count, s:schedule.unassigned.count===1?"":"s", amount:fmtMasked(schedule.unassigned.total)})+'</div>';
      html += schedule.unassigned.expenses.map(renderExpenseRow).join("");
      html += '</div>';
    }

    html += '</div>';
    return html;

  function renderBankGroups(){
    var byBank = {};
    data.savings.forEach(function(s){
      var key = (s.bank && s.bank.trim()) ? s.bank.trim() : t("ahorros_no_bank");
      if(!byBank[key]) byBank[key] = [];
      byBank[key].push(s);
    });
    var totalAll = data.savings.reduce(function(s,x){ return s+(x.current||0); },0);
    var banks = Object.keys(byBank).sort(function(a,b){
      var totalA = byBank[a].reduce(function(s,x){ return s+(x.current||0); },0);

  function renderSavingGoalNested(item){
    var pct = item.goal>0 ? Math.min(100, (item.current/item.goal)*100) : 0;
    var remaining = Math.max(0, item.goal-item.current);
    var suggestion = "";
    if(item.targetDate && remaining>0){
      var today = new Date(); today.setHours(0,0,0,0);
      var target = new Date(item.targetDate); target.setHours(0,0,0,0);
      var overdue = target < today;
      var monthsLeft = Math.max(0, (target.getFullYear()-today.getFullYear())*12 + (target.getMonth()-today.getMonth()) + (target.getDate()>=today.getDate()?0:-1) + 1);
      var monthlyNeeded = overdue ? remaining : remaining/Math.max(1, monthsLeft);
      var tLabel = target.toLocaleDateString(tlang()==="en"?"en-US":"es-MX",{day:"numeric",month:"short",year:"numeric"});
      if(overdue){
        suggestion = '<div style="color:var(--coral);font-size:11px;margin-top:6px;">'+t("goal_overdue",{date:dateLabel(target), amount:fmtMasked(remaining)})+'</div>';
      }else if(item.monthlyContribution && item.monthlyContribution>0){
        var monthsAtCurrentRate = Math.ceil(remaining/item.monthlyContribution);
        if(monthsAtCurrentRate > monthsLeft){
          var estCompletion = clampedDate(today.getFullYear(), today.getMonth()+monthsAtCurrentRate, today.getDate());
          var monthsLate = monthsAtCurrentRate - monthsLeft;
          suggestion = '<div style="color:var(--amber);font-size:11px;margin-top:6px;line-height:1.4;">'+t("goal_behind",{amount:fmtMasked(item.monthlyContribution), n:monthsLate, s:monthsLate===1?"":(tlang()==="en"?"s":"es"), date:dateLabel(estCompletion), needed:fmtMasked(monthlyNeeded)})+'</div>';
        }else{
          suggestion = '<div style="color:var(--mint);font-size:11px;margin-top:6px;">'+t("goal_ontrack",{amount:fmtMasked(item.monthlyContribution), date:tLabel, needed:fmtMasked(monthlyNeeded)})+'</div>';

    html += renderChips(item.id, "saving");

    var movements = (item.movements||[]).slice().sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
    var histOpen = isSubsectionOpen(item.id, "sav-history");
    html += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--hairline);">';
    html += '<button data-act="toggle-subsection" data-card="'+item.id+'" data-key="sav-history" style="width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:none;padding:0;text-align:left;">'+

  function buildSvgChart(points){
    var w = 400, h = 180, padL = 40, padR = 10, padT = 10, padB = 20;
    var maxVal = Math.max(1, Math.max.apply(null, points.map(function(p){ return Math.max(p.Deuda, p.Ahorro); })));
    var stepX = (w - padL - padR) / Math.max(1, points.length-1);
    function xAt(i){ return padL + i*stepX; }
    function yAt(v){ return padT + (h-padT-padB) * (1 - v/maxVal); }
    function pathFor(key, color){
      var d = points.map(function(p,i){ return (i===0?"M":"L") + xAt(i).toFixed(1) + "," + yAt(p[key]).toFixed(1); }).join(" ");
      return '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" />';
    }
    var dots = "";
    points.forEach(function(p,i){
      dots += '<circle cx="'+xAt(i).toFixed(1)+'" cy="'+yAt(p.Deuda).toFixed(1)+'" r="2.5" fill="var(--coral)" />';
      dots += '<circle cx="'+xAt(i).toFixed(1)+'" cy="'+yAt(p.Ahorro).toFixed(1)+'" r="2.5" fill="var(--mint)" />';
    });
    // Con pocos meses mostramos la etiqueta de cada punto, pero con muchos (historial
    // largo) eso se encima y se vuelve ilegible — mostramos como máximo ~6 etiquetas
    // repartidas parejo, siempre incluyendo la primera y la última, para que el
    // gráfico se mantenga legible sin importar cuánto historial tengas acumulado.
    var maxLabels = 6;
    var labelEvery = Math.max(1, Math.ceil(points.length / maxLabels));
    var labels = points.map(function(p,i){
      var show = (i % labelEvery === 0) || i===points.length-1;
      if(!show) return "";
      return '<text x="'+xAt(i).toFixed(1)+'" y="'+(h-4)+'" font-size="9" fill="var(--muted)" text-anchor="middle">'+p.label+'</text>';
    }).join("");
    var gridLines = "";
    for(var g=0; g<=2; g++){
      var yv = padT + (h-padT-padB) * (g/2);
      gridLines += '<line x1="'+padL+'" y1="'+yv.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+yv.toFixed(1)+'" stroke="var(--surface2)" stroke-width="1" />';
    }
    return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:200px;">'+
      gridLines + pathFor("Deuda","var(--coral)") + pathFor("Ahorro","var(--mint)") + dots + labels +
      '</svg>';
  }

  function buildDonutChart(items){
    var total = items.reduce(function(s,d){ return s+d.value; },0);
    if(total<=0) return "";
    var size=130, radius=50, stroke=16, circumference=2*Math.PI*radius;
    var offset=0;
    var selected = ui.donutSelected;
    var arcs = '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+radius+'" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="'+stroke+'" />';
    items.forEach(function(d,i){
      var frac = d.value/total;
      var dash = frac*circumference;
      var isActive = selected===i;
      var isDim = selected!=null && !isActive;
      arcs += '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+radius+'" fill="none" stroke="'+d.color+'" stroke-width="'+(isActive?stroke+3:stroke)+'" '+
        'stroke-opacity="'+(isDim?0.25:1)+'" data-act="select-donut" data-idx="'+i+'" style="cursor:pointer;transition:stroke-opacity .15s ease,stroke-width .15s ease;" '+
        'stroke-dasharray="'+dash.toFixed(2)+' '+(circumference-dash).toFixed(2)+'" stroke-dashoffset="'+(-offset).toFixed(2)+'" />';
      offset += dash;
    });
    var centerHtml;
    if(selected!=null && items[selected]){
      var sel = items[selected];
      centerHtml = '<span style="color:'+sel.color+';font-family:var(--mono);font-size:14px;font-weight:600;">'+Math.round(sel.value/total*100)+'%</span>'+
        '<span style="color:var(--muted);font-size:10px;text-align:center;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(sel.label)+'</span>';
    }else{
      centerHtml = '<span style="color:var(--text);font-family:var(--mono);font-size:12px;font-weight:600;">'+fmt(total)+'</span>'+
        '<span style="color:var(--muted);font-size:10px;">total</span>';
    }
    var svg = '<div style="position:relative;width:'+size+'px;height:'+size+'px;flex-shrink:0;">'+
      '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
      '<g transform="rotate(-90 '+(size/2)+' '+(size/2)+')">'+arcs+'</g></svg>'+
      '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding:0 8px;">'+centerHtml+'</div>'+
      '</div>';
    var legend = '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;">';
    items.forEach(function(d,i){
      var isDim = selected!=null && selected!==i;
      legend += '<button data-act="select-donut" data-idx="'+i+'" style="background:none;border:none;padding:0;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;opacity:'+(isDim?0.45:1)+';">'+
        '<div style="display:flex;align-items:center;gap:6px;min-width:0;">'+
        '<span style="width:8px;height:8px;border-radius:4px;background:'+d.color+';flex-shrink:0;"></span>'+
        '<span style="color:var(--text);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(d.label)+'</span>'+
        '</div>'+
        '<span style="color:var(--muted);font-family:var(--mono);font-size:11px;flex-shrink:0;">'+fmt(d.value)+' · '+Math.round(d.value/total*100)+'%</span>'+
        '</button>';
    });
    legend += '</div>';
    return '<div style="display:flex;align-items:center;gap:16px;">'+svg+legend+'</div>';
  }

  function clampDay(v){
    var n = v.replace(/[^0-9]/g,"");

  function bindHandlers(){
    var app = document.getElementById("app");

    // numeric-only filtering for free-typed inputs
    app.querySelectorAll('input[inputmode="decimal"]').forEach(function(inp){
      inp.addEventListener("input", function(){
        var cleaned = this.value.replace(/[^0-9.]/g,"");
        // evita que se pueda escribir más de un punto decimal — antes el campo podía
        // mostrar "12.34.56" mientras por dentro se guardaba solo "12.34", sin avisar
        // que lo mostrado y lo guardado ya no coincidían.
        var firstDot = cleaned.indexOf(".");
        if(firstDot !== -1){
          cleaned = cleaned.slice(0, firstDot+1) + cleaned.slice(firstDot+1).replace(/\./g, "");
        }
        this.value = cleaned;
      });
    });
    app.querySelectorAll('#m-cutoff, #m-due, #pc-day').forEach(function(inp){
      inp.addEventListener("input", function(){ this.value = clampDay(this.value); });

      }

    if(ui.adjustPersonalTarget){
      var adjPInput = document.getElementById("adjust-personal-input-"+ui.adjustPersonalTarget);
      if(adjPInput){
        adjPInput.addEventListener("keydown", function(e){
          if(e.key==="Enter"){ e.preventDefault(); onClick({ target: document.querySelector('[data-act="submit-adjust-personal"]') }); }
          else if(e.key==="Escape"){ e.preventDefault(); onClick({ target: document.querySelector('[data-act="toggle-adjust-personal"]') }); }
        });
        adjPInput.focus();
      }
    }

    // Calculadora en vivo de "¿cuánto podrías ahorrar?" (no depende de ninguna meta
    // en particular, solo ilustra proyecciones a partir de un monto semanal).
    var savingsTipInput = document.getElementById("savings-tip-input");
    var savingsTipPreview = document.getElementById("savings-tip-preview");
    if(savingsTipInput && savingsTipPreview){
      var updateSavingsTip = function(){

          var periods = [ {label:"En 1 mes", weeks:4.33}, {label:"En 3 meses", weeks:13}, {label:"En 6 meses", weeks:26}, {label:"En 1 año", weeks:52} ];
          savingsTipPreview.innerHTML = periods.map(function(p){

    // Live preview for MSI cuota (updates only the preview div, never re-renders — keeps focus)

      var mMonthsEl = document.getElementById("msi-months-"+ui.msiForm);
      var mPreviewEl = document.getElementById("msi-preview-"+ui.msiForm);

      if(mMonthsEl) mMonthsEl.addEventListener("input", updateMsiPreview);

    // Live preview for the first diferido installment (capital + interés + IVA)
    if(ui.deferredForm){
      var dPrincipalEl = document.getElementById("def-principal-"+ui.deferredForm);
      var dMonthsEl = document.getElementById("def-months-"+ui.deferredForm);
      var dRateEl = document.getElementById("def-rate-"+ui.deferredForm);
      var dPreviewEl = document.getElementById("def-preview-"+ui.deferredForm);
      var updateDefPreview = function(){
        if(!dPrincipalEl || !dMonthsEl || !dRateEl || !dPreviewEl) return;
        var p = parseFloat(dPrincipalEl.value), m = parseInt(dMonthsEl.value,10), r = parseFloat(dRateEl.value);
        if(p>0 && m>0 && !isNaN(r)){

          dPreviewEl.innerHTML = 'Primera cuota: <span style="color:var(--coral);font-family:var(--mono);font-weight:600;">'+fmt(first.total)+'</span>'+

        }else{
          dPreviewEl.style.display = "none";
        }
      };
      if(dPrincipalEl) dPrincipalEl.addEventListener("input", updateDefPreview);
      if(dMonthsEl) dMonthsEl.addEventListener("input", updateDefPreview);
      if(dRateEl) dRateEl.addEventListener("input", updateDefPreview);
      updateDefPreview();
    }
    app.querySelectorAll('input[inputmode="numeric"]').forEach(function(inp){
      if(inp.id==="m-cutoff"||inp.id==="m-due") return;
      inp.addEventListener("input", function(){ this.value = this.value.replace(/[^0-9]/g,""); });
    });

    var movQueryEl = document.getElementById("mov-query");
    if(movQueryEl) movQueryEl.addEventListener("change", function(){ ui.movQuery = this.value; render(); });
    var movCatEl = document.getElementById("mov-cat");
    if(movCatEl) movCatEl.addEventListener("change", function(){ ui.movCategory = this.value; render(); });
    var movCardEl = document.getElementById("mov-card");
    if(movCardEl) movCardEl.addEventListener("change", function(){ ui.movCard = this.value; render(); });
    var movMonthEl = document.getElementById("mov-month");
    if(movMonthEl) movMonthEl.addEventListener("change", function(){ ui.movMonth = this.value; render(); });

    var extraPayEl = document.getElementById("extra-payment-input");
    if(extraPayEl) extraPayEl.addEventListener("change", function(){
      ui.extraPayment = Math.max(0, parseFloat(this.value)||0); render();
    });

    app.addEventListener("click", onClick);

    app.querySelectorAll('input[id^="receipt-input-"]').forEach(function(inp){
      inp.addEventListener("change", function(){
        var file = this.files && this.files[0];
        this.value = "";
        if(!file) return;
        var cardId = this.id.replace("receipt-input-","");
        scanReceipt(cardId, file);
      });
    });

    app.querySelectorAll('input[id^="statement-input-"]').forEach(function(inp){
      inp.addEventListener("change", function(){
        var file = this.files && this.files[0];
        this.value = "";
        if(!file) return;
        var cardId = this.id.replace("statement-input-","");
        reconcileStatement(cardId, file);
      });
    });

    var backupInput = document.getElementById("backup-file-input");
    if(backupInput){
      backupInput.addEventListener("change", function(){
        var file = this.files && this.files[0];
        this.value = "";
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(){
          try{
            var rawParsed = JSON.parse(reader.result);
            var normalized = normalizeData(rawParsed);
            if(!normalized){
              ui.backupMessage = "Ese archivo no parece un respaldo válido.";
              render();
              return;
            }
            if(!confirm(t("confirm_restore_backup"))){
              return;
            }
            data = normalized;
            saveData();
            try{ localStorage.setItem(LAST_BACKUP_KEY, new Date().toISOString()); }catch(e){}
            ui.backupMessage = "Respaldo restaurado ✓";
            ui.backupModal = false;
            render();
          }catch(err){
            ui.backupMessage = "No se pudo leer ese archivo. Verifica que sea un respaldo exportado desde esta app.";
            render();
          }
        };
        reader.readAsText(file);
      });
    }

    // --- Swipe-to-reveal for expense/payment rows ---
    var ACTIONS_WIDTH = 104; // 2 buttons x 52px
    var isTouchDevice = ("ontouchstart" in window) || (navigator.maxTouchPoints>0);
    app.querySelectorAll(".swipe-row").forEach(function(row){
      var content = row.querySelector(".swipe-content");
      if(!content) return;
      var startX = 0, startY = 0, currentX = 0, dragging = false, isHorizontal = null;
      var open = swipeOpenId === row.getAttribute("data-swipe-id");
      content.style.transform = open ? "translateX(-"+ACTIONS_WIDTH+"px)" : "translateX(0)";

      /* En dispositivos sin pantalla táctil (computadora con mouse) no hay gesto de
         swipe posible — sin este botón, editar/eliminar un gasto o pago individual
         dentro de la tarjeta sería completamente inalcanzable ahí. */
      if(!isTouchDevice){
        content.style.cursor = "pointer";
        content.addEventListener("click", function(e){
          if(e.target.closest("[data-act]") && e.target.closest("[data-act]")!==content) return;
          var rowId = row.getAttribute("data-swipe-id");
          var isOpen = swipeOpenId === rowId;
          if(swipeOpenId && swipeOpenId !== rowId){
            var prevRow = app.querySelector('.swipe-row[data-swipe-id="'+swipeOpenId+'"] .swipe-content');
            if(prevRow){ prevRow.style.transition = "transform .2s ease"; prevRow.style.transform = "translateX(0)"; }
          }
          content.style.transition = "transform .2s ease";
          content.style.transform = isOpen ? "translateX(0)" : "translateX(-"+ACTIONS_WIDTH+"px)";
          swipeOpenId = isOpen ? null : rowId;
        });
        return; // no agregamos los listeners de touch en dispositivos sin touch
      }

      content.addEventListener("touchstart", function(e){
        // Close any other open row
        if(swipeOpenId && swipeOpenId !== row.getAttribute("data-swipe-id")){
          var prevRow = app.querySelector('.swipe-row[data-swipe-id="'+swipeOpenId+'"] .swipe-content');
          if(prevRow) prevRow.style.transform = "translateX(0)";
          swipeOpenId = null;
        }
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        currentX = open ? -ACTIONS_WIDTH : 0;
        dragging = true;
        isHorizontal = null;
        content.style.transition = "none";
      }, {passive:true});

      content.addEventListener("touchmove", function(e){
        if(!dragging) return;
        var dx = e.touches[0].clientX - startX;
        var dy = e.touches[0].clientY - startY;
        if(isHorizontal === null){
          isHorizontal = Math.abs(dx) > Math.abs(dy);
        }
        if(!isHorizontal) return;
        var next = currentX + dx;
        next = Math.max(-ACTIONS_WIDTH, Math.min(0, next));
        content.style.transform = "translateX("+next+"px)";
      }, {passive:true});

      content.addEventListener("touchend", function(e){
        if(!dragging) return;
        dragging = false;
        content.style.transition = "transform .2s ease";
        var dx = (e.changedTouches[0].clientX - startX);
        var willOpen = open ? dx > -ACTIONS_WIDTH/2 : dx < -ACTIONS_WIDTH/2;
        content.style.transform = willOpen ? "translateX(-"+ACTIONS_WIDTH+"px)" : "translateX(0)";
        swipeOpenId = willOpen ? row.getAttribute("data-swipe-id") : null;
      });
    });
  }

  function onClick(e){
    var el = e.target.closest("[data-act]");
    if(!el) return;
    var act = el.getAttribute("data-act");

    if(act==="open-modal"){
      ui.modal = { kind: el.getAttribute("data-kind"), data:null, colorOverride:null, cardType: el.getAttribute("data-card-type")||"credito" };
      render();
    }else if(act==="toggle-hide-balances"){
      ui.hideBalances = !ui.hideBalances;
      setHideBalancesPref(ui.hideBalances);
      render();
    }else if(act==="pick-card-color"){
      var pickedIdx = el.getAttribute("data-color-index");
      ui.modal.colorOverride = pickedIdx==="" ? null : parseInt(pickedIdx,10);
      render();
    }else if(act==="goto-card"){
      ui.tab = "tarjetas";
      ui.openCard = el.getAttribute("data-id");
      ui.navSheetOpen = false;
      window.scrollTo(0,0);
      render();
    }else if(act==="goto-loan"){
      ui.tab = "prestamos";
      ui.navSheetOpen = false;
      window.scrollTo(0,0);
      render();
    }else if(act==="goto-saving"){
      ui.tab = "ahorros";
      ui.openBankGroup = el.getAttribute("data-bank");
      ui.navSheetOpen = false;
      window.scrollTo(0,0);
      render();
    }else if(act==="goto-analisis"){
      ui.tab = "analisis";
      ui.navSheetOpen = false;
      window.scrollTo(0,0);
      render();
    }else if(act==="set-tab"){
      ui.tab = el.getAttribute("data-tab");
      ui.navSheetOpen = false;
      window.scrollTo(0,0);
      render();
    }else if(act==="toggle-nav-sheet"){
      ui.navSheetOpen = !ui.navSheetOpen;
      render();
    }else if(act==="close-nav-sheet"){
      ui.navSheetOpen = false;
      render();
    }else if(act==="movimientos-add"){
      if(data.cards.length===1){
        ui.expenseForm = data.cards[0].id; ui.expenseEditId = null; ui.expenseDraft = null; render();
      }else{
        ui.movCardPicker = true; render();
      }
    }else if(act==="pick-mov-card"){
      ui.movCardPicker = false;
      ui.expenseForm = el.getAttribute("data-id"); ui.expenseEditId = null; ui.expenseDraft = null;
      render();
    }else if(act==="close-mov-card-picker" || act==="close-mov-card-picker-bg"){
      if(act==="close-mov-card-picker-bg" && e.target !== el) return;
      ui.movCardPicker = false; render();
    }else if(act==="run-search"){
      var searchInput = document.getElementById("analysis-search");
      ui.analysisQuery = searchInput ? searchInput.value : "";
      render();
    }else if(act==="select-donut"){
      var idx = parseInt(el.getAttribute("data-idx"),10);
      ui.donutSelected = ui.donutSelected===idx ? null : idx;
      render();
    }else if(act==="set-chart-period"){
      ui.chartPeriod = el.getAttribute("data-period");
      render();
    }else if(act==="undo-toast"){
      if(toastTimer) clearTimeout(toastTimer);
      var fn = ui.toast ? ui.toast.onUndo : null;
      ui.toast = null;
      if(fn) fn();
      else render();
    }else if(act==="set-font-size"){
      updateSettings(Object.assign({}, data.settings, {fontSize: el.getAttribute("data-size")}));
    }else if(act==="set-accent-color"){
      var newAccent = el.getAttribute("data-color");
      applyAccentColor(newAccent);
      updateSettings(Object.assign({}, data.settings, {accentColor: newAccent}));
    }else if(act==="set-theme"){
      var newTheme = el.getAttribute("data-theme");
      applyTheme(newTheme);
      updateSettings(Object.assign({}, data.settings, {theme: newTheme}));
    }else if(act==="set-language"){
      setLanguage(el.getAttribute("data-lang"));
    }else if(act==="enable-notifications"){
      if(typeof Notification === "undefined"){ render(); return; }
      if(Notification.permission === "granted"){
        updateSettings(Object.assign({}, data.settings, {notificationsEnabled:true}));
        checkAndNotify(true);
      }else{
        Notification.requestPermission().then(function(perm){
          if(perm === "granted"){
            updateSettings(Object.assign({}, data.settings, {notificationsEnabled:true}));
            checkAndNotify(true);
          }else{
            render();
          }
        });
      }
    }else if(act==="disable-notifications"){
      updateSettings(Object.assign({}, data.settings, {notificationsEnabled:false}));
    }else if(act==="toggle-alert-setting"){
      var key = el.getAttribute("data-key");
      var patch = {}; patch[key] = !data.settings[key];
      updateSettings(Object.assign({}, data.settings, patch));
    }else if(act==="add-category"){
      var newCatInput = document.getElementById("new-category-input");
      var newCat = newCatInput ? newCatInput.value.trim() : "";
      var existingCats = data.categories||DEFAULT_CATEGORIES.slice();
      var alreadyExists = existingCats.some(function(c){ return c.toLowerCase()===newCat.toLowerCase(); });
      if(newCat && !alreadyExists){
        persist(Object.assign({}, data, {categories: existingCats.concat([newCat])}));
        if(newCatInput) newCatInput.value = "";
      }else{
        if(newCat && alreadyExists) alert("Ya existe una categoría con ese nombre.");
        render();
      }
    }else if(act==="remove-category"){
      var catToRemove = el.getAttribute("data-cat");
      var usageCount = categoryUsageCount(data.cards, catToRemove);
      var remainingCats = (data.categories||DEFAULT_CATEGORIES.slice()).filter(function(c){return c!==catToRemove;});
      if(!remainingCats.length){
        alert("No puedes eliminar tu única categoría.");
      }else if(usageCount>0){
        ui.reassignCategory = { from: catToRemove, count: usageCount, to: remainingCats[0] };
        render();
      }else{
        persist(Object.assign({}, data, {categories: remainingCats}));
      }
    }else if(act==="start-rename-category"){
      ui.renamingCategory = el.getAttribute("data-cat");
      render();
    }else if(act==="cancel-rename-category"){
      ui.renamingCategory = null;
      render();
    }else if(act==="confirm-rename-category"){
      var oldName = el.getAttribute("data-cat");
      var renameInput = document.getElementById("rename-category-input");
      var newName = renameInput ? renameInput.value.trim() : "";
      var existingCatsForRename = data.categories||DEFAULT_CATEGORIES.slice();
      var clashesWithOther = existingCatsForRename.some(function(c){ return c!==oldName && c.toLowerCase()===newName.toLowerCase(); });
      if(!newName){
        ui.renamingCategory = null; render();
      }else if(clashesWithOther){
        alert("Ya existe una categoría con ese nombre.");
      }else if(newName===oldName){
        ui.renamingCategory = null; render();
      }else{
        var renamedCats = existingCatsForRename.map(function(c){ return c===oldName ? newName : c; });
        var renamedCards = data.cards.map(function(c){
          var expenses = (c.expenses||[]).map(function(e){
            return (e.category||"Otros")===oldName ? Object.assign({}, e, {category:newName}) : e;
          });
          return Object.assign({}, c, {expenses:expenses});
        });
        ui.renamingCategory = null;
        persist(Object.assign({}, data, {categories:renamedCats, cards:renamedCards}));
      }
    }else if(act==="close-reassign-category" || act==="close-reassign-category-bg"){
      if(act==="close-reassign-category-bg" && e.target!==el) return;
      ui.reassignCategory = null; render();
    }else if(act==="confirm-reassign-category"){
      var toSel = document.getElementById("reassign-to-select");
      var toCat = toSel ? toSel.value : (ui.reassignCategory ? ui.reassignCategory.to : null);
      if(ui.reassignCategory && toCat){
        reassignCategory(ui.reassignCategory.from, toCat);
        ui.reassignCategory = null;
      }
      render();
    }else if(act==="confirm-subscription"){
      var confKey = el.getAttribute("data-key");
      var confirmedList = (data.confirmedSubscriptions||[]).slice();
      if(confirmedList.indexOf(confKey)===-1) confirmedList.push(confKey);
      persist(Object.assign({}, data, {confirmedSubscriptions: confirmedList}));
    }else if(act==="discard-subscription"){
      var discKey = el.getAttribute("data-key");
      var dismissedList = (data.dismissedSubscriptions||[]).slice();
      if(dismissedList.indexOf(discKey)===-1) dismissedList.push(discKey);
      persist(Object.assign({}, data, {dismissedSubscriptions: dismissedList}));
    }else if(act==="dismiss-goal-celebration"){
      var celebratedId = el.getAttribute("data-id");
      var celebratedList = (data.celebratedGoalIds||[]).slice();
      if(celebratedList.indexOf(celebratedId)===-1) celebratedList.push(celebratedId);
      persist(Object.assign({}, data, {celebratedGoalIds: celebratedList}));
    }else if(act==="check-for-updates"){
      ui.checkingUpdate = true;
      ui.updateCheckResult = null;
      render();
      if("serviceWorker" in navigator){
        navigator.serviceWorker.getRegistration().then(function(reg){
          if(!reg){
            ui.checkingUpdate = false;
            ui.updateCheckResult = "No se pudo revisar en este navegador.";
            render();
            return;
          }
          reg.update().then(function(){
            // Dar un momento a que el navegador termine de instalar la nueva versión
            // si es que existe, antes de decidir qué mensaje mostrar.
            setTimeout(function(){
              ui.checkingUpdate = false;
              if(!ui.updateAvailable && !reg.waiting){
                ui.updateCheckResult = "Ya tienes la versión más reciente.";
              }else{
                ui.updateAvailable = true;
              }
              render();
            }, 1200);
          }).catch(function(){
            ui.checkingUpdate = false;
            ui.updateCheckResult = "No se pudo revisar — checa tu conexión e intenta de nuevo.";
            render();
          });
        });
      }else{
        ui.checkingUpdate = false;
        window.location.reload();
      }
    }else if(act==="reload-app"){
      if("serviceWorker" in navigator){
        navigator.serviceWorker.getRegistration().then(function(reg){
          if(reg && reg.waiting){
            reg.waiting.postMessage({type:"SKIP_WAITING"});
          }
        }).finally(function(){ window.location.reload(); });
      }else{
        window.location.reload();
      }
    }else if(act==="install-pwa"){
      if(ui.deferredInstallPrompt){
        ui.deferredInstallPrompt.prompt();
        ui.deferredInstallPrompt.userChoice.then(function(){ ui.deferredInstallPrompt = null; render(); });
      }
    }else if(act==="gate-toggle-mode"){
      ui.cloudMode = ui.cloudMode==="signup" ? "login" : "signup";
      ui.cloudError = "";
      ui.cloudResetSent = false;
      render();
    }else if(act==="gate-do-signup" || act==="gate-do-login"){
      /* la lógica real vive en el listener "submit" del formulario (ver renderLoginGate),
         para que un solo camino maneje tanto Enter como el clic del botón sin duplicar el envío */
    }else if(act==="gate-forgot-password"){
      var gForgotEmail = document.getElementById("gate-email-input").value.trim();
      cloudSendPasswordReset(gForgotEmail);
    }else if(act==="cloud-logout"){
      if(confirm(t("confirm_logout"))){
        cloudSignOutUser();
      }
    }else if(act==="open-delete-account-modal"){
      ui.deleteAccountModal = true; ui.deleteAccountError = ""; ui.deleteAccountPassword = ""; render();
    }else if(act==="close-delete-account-modal"){
      ui.deleteAccountModal = false; render();
    }else if(act==="close-delete-account-modal-bg"){
      if(e.target===el){ ui.deleteAccountModal = false; render(); }
    }else if(act==="confirm-delete-account"){

      var a = isDebitSave ? 0 : parseFloat(aEl ? aEl.value : "");
      var b = isDebitSave ? 0 : parseFloat(bEl ? bEl.value : "");
      if(!name || (!isDebitSave && (isNaN(a) || isNaN(b)))) return;
      var item = { id: existingId || uid(), name: name };
      if(kind2==="card"){
        item.type = isDebitSave ? "debito" : "credito";
        item.colorOverride = (ui.modal && ui.modal.colorOverride!=null) ? ui.modal.colorOverride : null;
        if(isDebitSave){
          item.balance = 0; item.limit = 0;
          item.cutoffDay = null; item.dueDay = null; item.revolvingRate = null; item.minPayment = null;
        }else{
          var cutoff = document.getElementById("m-cutoff").value;
          var due = document.getElementById("m-due").value;
          var revRate = document.getElementById("m-revolving-rate").value;
          var minPay = document.getElementById("m-min-payment").value;
          item.balance = a; item.limit = b;
          item.cutoffDay = cutoff ? parseInt(cutoff,10) : null;
          item.dueDay = due ? parseInt(due,10) : null;
          item.revolvingRate = revRate ? parseFloat(revRate) : null;
          item.minPayment = minPay ? parseFloat(minPay) : null;
        }
        if(existingId){
          var old = data.cards.find(function(c){return c.id===existingId;});
          if(old){ item.msi = old.msi; item.payments = old.payments; item.expenses = old.expenses; item.diferidos = old.diferidos; item.extraCredit = old.extraCredit; }
        }
      }else{
        var bank = document.getElementById("m-bank").value.trim();
        var targetDateVal = document.getElementById("m-target-date").value;
        var contribEl = document.getElementById("m-contribution");
        var contrib = contribEl ? parseFloat(contribEl.value) : NaN;
        item.current = a; item.goal = b; item.bank = bank;
        item.targetDate = targetDateVal ? new Date(targetDateVal+"T12:00:00").toISOString() : null;
        item.monthlyContribution = (!isNaN(contrib) && contrib>0) ? contrib : null;
      }
      saveFromModal(item, kind2);
    }
  }

  function checkAndNotify(force){
    if(!data.settings.notificationsEnabled) return;
    if(typeof Notification === "undefined" || Notification.permission !== "granted") return;
    var todayStr = new Date().toDateString();
    if(!force){
      var lastNotified = null;
      try{ lastNotified = localStorage.getItem("last-notification-date"); }catch(e){}
      if(lastNotified === todayStr) return;
    }
    var dueCards = upcomingDuePayments(data.cards).filter(function(a){ return a.dLeft<=3; });
    var dueLoans = upcomingPersonalCreditPayments(data.personalCredits).filter(function(a){ return a.dLeft<=3; });
    if(dueCards.length===0 && dueLoans.length===0) return;
    var names = dueCards.map(function(a){ return a.card.name; }).concat(dueLoans.map(function(a){ return a.credit.description; }));
    try{
      new Notification("Pagos próximos", { body: names.join(", ")+" — revisa Control financiero." });
      localStorage.setItem("last-notification-date", todayStr);
    }catch(e){}
  }

  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    ui.deferredInstallPrompt = e;
    if(ui.tab === "config") render();
  });
  window.addEventListener("appinstalled", function(){ ui.deferredInstallPrompt = null; });

  if("serviceWorker" in navigator){
    var swRefreshing = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(swRefreshing) return;
      swRefreshing = true;
      window.location.reload();
    });
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        reg.addEventListener("updatefound", function(){
          var newWorker = reg.installing;
          if(!newWorker) return;
          newWorker.addEventListener("statechange", function(){
            if(newWorker.state==="installed" && navigator.serviceWorker.controller){
              // hay una versión nueva instalada y en espera: avisamos sin forzar el recargo
              ui.updateAvailable = true;
              render();
            }
          });
        });
      }).catch(function(){});
    });
  }

  render();
  checkAndNotify(false);
})();
</script>
</body>
</html>
